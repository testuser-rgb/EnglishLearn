<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>学位英语备考</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1a1d24;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:34px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 12px 32px rgba(16,24,40,.08)}
.logo{width:60px;height:60px;border-radius:16px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;margin:0 auto 16px}
h1{font-size:20px;margin-bottom:6px}.sub{font-size:13px;color:#6b7280;margin-bottom:24px}
.btn{display:block;width:100%;background:#2563eb;color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:12px;font-size:15px;margin-bottom:12px}
.tip{font-size:12px;color:#9aa1ac;line-height:1.8;margin-top:16px;text-align:left}
</style>
</head>
<body>
<div class="card">
  <div class="logo">英</div>
  <h1>江苏联盟学位英语备考</h1>
  <div class="sub">60 天两阶段 · 离线可用 · 进度存本机</div>
  <a class="btn" href="app.html">进入学习台</a>
  <div class="tip">
    · 学习记录保存在本手机 App 内，与电脑网页版各自独立、不会同步。<br>
    · 卸载应用或清除数据会丢失进度，重要进度请自己另记一份。<br>
    · 题目全部自编，真题只作考前检验；完全离线，飞行模式也能用。
  </div>
</div>
</body>
</html>
