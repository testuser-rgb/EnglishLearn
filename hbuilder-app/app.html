<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>学位英语备考</title>
<link rel="stylesheet" href="css/common.css">
<style>
  /* App 端：手机界面铺满屏幕，无 Web 外壳 */
  html,body{height:100%;overflow:hidden;width:100%;max-width:100%}
  .phone-stage{display:block;min-height:0;height:100vh;height:100dvh;padding:0;background:var(--bg)}
  .phone{width:100%;max-width:100%;height:100%;box-shadow:none;border:none;border-radius:0}
  .phone-notch{display:none}
  .phone-screen{height:100%;padding:calc(34px + env(safe-area-inset-top,0)) 16px calc(16px + env(safe-area-inset-bottom,0));overflow-y:auto;overflow-x:hidden}
  /* 真机无边框：抵消原型为402px模型设的负边距，保证底部Tab贴底不溢出 */
  .ph-nav{margin-left:-16px;margin-right:-16px;margin-bottom:calc(-16px - env(safe-area-inset-bottom,0));padding-bottom:calc(16px + env(safe-area-inset-bottom,0))}
  .ph-task,.ph-card,.ph-stat{min-width:0}
  .ph-task .tx{min-width:0;word-break:break-word}
  /* 三列统计在窄屏适当压缩 */
  .ph-stats{gap:6px}
  .ph-stat{padding:10px 4px}
  .ph-stat .v{font-size:18px}
</style>
</head>
<body>
<div id="web-shell" class="hide"></div>
<div id="phone-shell" class="phone-stage">
  <div class="phone">
    <div class="phone-notch"></div>
    <div class="phone-screen" id="phoneScreen"></div>
  </div>
</div>

<!-- 共享内核：App 端独立存档 KEY + 仅手机模式 -->
<script>window.XWYY_STORAGE_KEY='xwyy_plan_v2_app';window.XWYY_MODE='phone';</script>
<script src="data/01_config.js"></script>
<script src="data/02_words.js"></script>
<script src="data/07_mnemonic.js"></script>
<script src="data/03_exam_vocab.js"></script>
<script src="data/04_exam_cloze.js"></script>
<script src="data/05_exam_reading.js"></script>
<script src="data/06_exam_write.js"></script>
<script src="core/storage.js"></script>
<script src="core/mastery.js"></script>
<script src="core/srs.js"></script>
<script src="core/grade.js"></script>
<script src="core/exam.js"></script>
<script src="adapters/speech.js"></script>
<script src="app/main.js"></script>
<script src="ui/web_views.js"></script>
<script src="ui/exam_ui.js"></script>
<script src="ui/phone_views.js"></script>
<script src="app/bootstrap.js"></script>
<script src="app-plus.js"></script>
</body>
</html>
