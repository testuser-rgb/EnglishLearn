<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学位英语 · 70天通关台</title>
<style>
  :root{
    --ink:#16202e; --ink-2:#3d4c60; --ink-3:#77869a; --ink-4:#9aa8ba;
    --line:#e4eaf3; --line-2:#eff3f9;
    --bg:#f4f7fb; --card:#ffffff;
    --blue:#14539a; --blue-2:#eaf1fa; --blue-3:#d6e4f5;
    --teal:#0f766e; --teal-2:#e6f4f1;
    --amber:#b45309; --amber-2:#fdf3e4;
    --rose:#a8324a; --rose-2:#fbeef1;
    --ok:#2f8f5b; --ok-2:#e7f4ec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
    font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .app{display:grid; grid-template-columns:198px 1fr; min-height:100vh;}

  /* ===== 侧栏 ===== */
  .side{background:#fff; border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column;}
  .brand{font-size:13px; font-weight:700; color:var(--blue); letter-spacing:.04em; padding:4px 10px 14px; border-bottom:1px solid var(--line-2); margin-bottom:12px;}
  .brand span{display:block; font-size:11px; color:var(--ink-4); font-weight:400; letter-spacing:.02em; margin-top:3px;}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav button{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:9px 11px; border-radius:8px; border:0; background:transparent;
    font-size:13.3px; color:var(--ink-2); cursor:pointer; font-family:inherit; transition:background .12s;
  }
  .nav button:hover{background:#f5f8fc;}
  .nav button.on{background:var(--blue-2); color:var(--blue); font-weight:700;}
  .nav button .ic{width:16px; text-align:center; font-size:13px; opacity:.85;}
  .side-foot{margin-top:auto; padding:12px 10px 4px; border-top:1px solid var(--line-2); font-size:11.6px; color:var(--ink-4);}
  .side-foot b{color:var(--blue); font-size:15px;}

  /* ===== 主区 ===== */
  main{padding:26px 32px 70px; max-width:940px; width:100%;}
  .vhead{margin-bottom:22px;}
  .vhead h1{font-size:22px; margin:0 0 5px; letter-spacing:-.01em;}
  .vhead p{margin:0; font-size:12.8px; color:var(--ink-3);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:18px 20px;}
  .card + .card{margin-top:14px;}
  .card h3{font-size:13.6px; margin:0 0 12px; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .card h3 .sub{font-weight:400; color:var(--ink-4); font-size:11.8px;}

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 16px;}
  .stat .k{font-size:11.4px; color:var(--ink-4); letter-spacing:.03em;}
  .stat .v{font-size:21px; font-weight:700; color:var(--blue); line-height:1.35; margin-top:1px;}
  .stat .v em{font-size:11.5px; font-weight:500; color:var(--ink-4); font-style:normal; margin-left:3px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 16px; border-radius:9px; border:1px solid var(--line);
    background:#fff; color:var(--ink-2); font-size:13.2px; font-family:inherit;
    cursor:pointer; transition:all .12s; font-weight:600;
  }
  .btn:hover{border-color:var(--blue-3); background:#f8fbff;}
  .btn.pri{background:var(--blue); border-color:var(--blue); color:#fff;}
  .btn.pri:hover{background:#0f4580; border-color:#0f4580;}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-3); font-weight:400;}
  .btn.sm{padding:6px 12px; font-size:12.5px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* 任务清单 */
  .task{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--line-2); cursor:pointer;}
  .task:last-child{border-bottom:none;}
  .task .box{
    flex:none; width:19px; height:19px; border-radius:5px; border:1.6px solid #c9d5e6;
    margin-top:2px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; transition:all .15s;
  }
  .task.done .box{background:var(--ok); border-color:var(--ok);}
  .task.done .tx{color:var(--ink-4); text-decoration:line-through;}
  .task .tx{font-size:13.4px; color:var(--ink); line-height:1.6;}
  .task .min{margin-left:auto; flex:none; font-size:11.8px; color:var(--ink-4); padding-top:2px;}

  .bar{height:7px; border-radius:99px; background:#e9eef6; overflow:hidden;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,#2d7bd0,#14539a); border-radius:99px; transition:width .4s;}

  /* 词卡 */
  .flash{
    min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:14px; background:#fff; padding:30px;
    cursor:pointer; text-align:center; position:relative; transition:border-color .15s;
  }
  .flash:hover{border-color:var(--blue-3);}
  .flash .w{font-family:Georgia,"Times New Roman",serif; font-size:38px; color:var(--ink); letter-spacing:.01em; line-height:1.3;}
  .flash .pt{font-size:12.6px; color:var(--ink-4); margin-top:10px;}
  .flash .zh{font-size:19px; color:var(--blue); font-weight:600; margin-bottom:8px;}
  .flash .use{font-size:13.4px; color:var(--ink-2); margin-top:6px; font-family:Georgia,serif; line-height:1.85;}
  .flash .poslegend{font-size:11px; color:var(--ink-4); margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); line-height:1.7;}
  .flash .bkrow{display:flex; align-items:flex-start; gap:9px; margin-top:10px; width:100%; text-align:left;}
  .flash .btag{flex:none; font-size:11px; font-weight:700; padding:2.5px 8px; border-radius:6px; margin-top:1.5px; letter-spacing:.04em;}
  .flash .t-tip{background:var(--blue-2); color:var(--blue);}
  .flash .t-cmp{background:#f1ecfb; color:#6b4fbf;}
  .flash .t-read{background:#e7f2ea; color:#2f7d4f;}
  .flash .readsen i{display:block; font-style:normal; font-family:Georgia,serif; font-size:12.9px; line-height:1.72; color:var(--ink-2);}
  .flash .readsen b{display:block; font-weight:400; font-size:11.8px; color:var(--ink-3); margin-top:3px;}
  .layerbadge.lr{background:#e7f2ea; color:#2f7d4f;}
  .tline{display:flex; gap:10px; padding:9px 0; border-top:1px dashed var(--line);}
  .tline:first-of-type{border-top:none;}
  .tline .tn{flex:none; width:18px; font-size:11px; color:var(--ink-4); padding-top:3px;}
  .tline .ten{font-family:Georgia,serif; font-size:13.4px; line-height:1.72; color:var(--ink-1);}
  .tline .tzh{font-size:11.8px; color:var(--ink-3); margin-top:2px; line-height:1.65;}
  .flash .saybar{font-size:11.5px; color:var(--blue); background:var(--blue-2); display:inline-block; padding:4px 11px; border-radius:20px; margin-top:9px; cursor:pointer;}
  .flash .saymini{cursor:pointer; font-size:13px; opacity:.65; margin-left:4px;}
  .flash .saymini:hover{opacity:1;}
  .flash .t-use{background:#ecf7ef; color:#2e7d43;}
  .flash .t-ext{background:#f2edfa; color:#7452b0;}
  .flash .t-fun{background:var(--amber-2); color:var(--amber);}
  .flash .t-mine{background:var(--rose-2); color:var(--rose);}
  .flash .bval{font-size:13px; color:var(--ink-2); line-height:1.8;}
  .flash .bval .tipnone{font-style:normal; color:var(--amber);}
  .flash .fam-inline{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .flash .medit{font-size:11.4px; color:var(--rose); cursor:pointer; text-decoration:underline; margin-left:4px;}
  .flash .bkadd{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); width:100%;
    font-size:12.4px; color:var(--blue); cursor:pointer; font-weight:600; text-align:left;}
  .flash .bkadd:hover{color:#0d3f77;}
  .flash .bkadd .bkadd-s{font-weight:400; font-size:11px; color:var(--ink-4); margin-left:8px;}
  /* 课堂 */
  .lesson .lh{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .lesson .lt{font-size:14.6px; font-weight:700; color:var(--ink);}
  .lesson .wk{font-size:10.8px; font-weight:600; color:var(--blue); background:var(--blue-2); padding:2px 8px; border-radius:6px; margin-left:6px; vertical-align:2px;}
  .lesson .ls{font-size:12px; color:var(--ink-3); margin-top:5px; line-height:1.6;}
  .lesson .lbtns{display:flex; gap:8px; margin-top:12px;}
  .lesson .pill{margin-left:auto; flex:none;}
  .lsec{margin-bottom:16px;}
  .lsec h4{font-size:13.6px; margin:0 0 7px; color:var(--blue);}
  .lsec .lbody{font-size:13.2px; line-height:2.0; color:var(--ink-2);}
  .lsec .lbody b{color:var(--ink);}
  .qtext{font-size:15.4px; font-weight:600; line-height:1.9; color:var(--ink); margin-bottom:14px;}
  .qtext .blank{color:var(--blue); border-bottom:2px solid var(--blue-3); padding:0 6px;}
  .qopts{display:grid; gap:9px;}
  .qopt{text-align:left; padding:11px 14px; border:1px solid var(--line); border-radius:10px; background:#fff;
    font-size:13.6px; color:var(--ink-2); cursor:pointer; font-family:inherit; line-height:1.6; transition:border-color .12s, background .12s;}
  .qopt:hover{border-color:var(--blue-3); background:#f8fbff;}
  .qopt.ok{border-color:#2e7d43; background:#ecf7ef; color:#1e5c30; font-weight:600;}
  .qopt.bad{border-color:var(--rose); background:var(--rose-2); color:var(--rose); font-weight:600;}
  .qopt:disabled{cursor:default;}
  .exp{margin-top:14px; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.9;}
  .exp.eok{background:#ecf7ef; border:1px solid #cde8d4; color:#1e5c30;}
  .exp.ebad{background:var(--amber-2); border:1px solid #f3dfc0; color:var(--amber);}
  .witem{padding:10px 0; border-bottom:1px solid var(--line-2);}
  .witem .wq{font-size:13.4px; font-weight:600; color:var(--ink);}
  .witem .wa{font-size:12.8px; color:#1e5c30; margin-top:4px;}
  .witem .we{font-size:12.6px; color:var(--ink-3); margin-top:3px; line-height:1.8;}
  .pill{display:inline-block; font-size:11px; font-weight:700; padding:2.5px 9px; border-radius:6px; background:var(--line-2); color:var(--ink-3);}
  .pill.ok{background:#ecf7ef; color:#1e5c30;}
  .pill.warn{background:var(--amber-2); color:var(--amber);}
  .flash .hint{position:absolute; bottom:14px; font-size:11.6px; color:var(--ink-4);}
  .layerbadge{position:absolute; top:14px; left:16px; font-size:11px; font-weight:700; padding:1px 9px; border-radius:99px;}
  .la{background:var(--rose-2); color:var(--rose);}
  .lb{background:var(--amber-2); color:var(--amber);}
  .lc{background:var(--blue-2); color:var(--blue);}

  /* 直读词卡：一次摊开，不再翻面 */
  .flash.wcard{cursor:default; min-height:0; padding:18px 22px 20px; align-items:stretch; justify-content:flex-start; text-align:left;}
  .flash.wcard:hover{border-color:var(--line);}
  .wcard .wtop{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .wcard .layerbadge{position:static;}
  .wcard .widx{font-size:11.4px; color:var(--ink-4); margin-left:auto;}
  .wcard .whead{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .wcard .w{font-family:Georgia,"Times New Roman",serif; font-size:33px; color:var(--ink); letter-spacing:.01em; line-height:1.25;}
  .wcard .saybtn{font-family:inherit; font-size:11.6px; font-weight:600; color:var(--blue); background:var(--blue-2);
    border:0; padding:4px 11px; border-radius:99px; cursor:pointer; margin-top:4px;}
  .wcard .saybtn:hover{background:var(--blue-3);}
  .wcard .zh{font-size:17px; color:var(--blue); font-weight:600; margin-top:6px; line-height:1.7;}
  .wcard .story{margin-top:14px; padding:12px 16px 13px; border-left:3px solid #dda23a;
    background:linear-gradient(180deg,#fffbf2,#fdf6e8); border-radius:0 10px 10px 0; position:relative;}
  .wcard .story .stag{display:inline-block; font-size:10.6px; font-weight:700; letter-spacing:.06em;
    color:#96600f; background:#f7e3bf; padding:1px 8px; border-radius:99px;}
  .wcard .story .q{position:absolute; right:13px; top:0; font-family:Georgia,serif; font-size:40px;
    color:#eed9b4; line-height:1; user-select:none;}
  .wcard .story p{margin:7px 0 0; font-size:14.2px; line-height:1.95; color:#5b3f16;}
  .wcard .story p b{color:#8a4a06;}
  .wcard .story.none{background:#fafbfd; border-left-color:var(--line);}
  .wcard .story.none p{color:var(--ink-3); font-size:13px;}
  .wcard .story.none .stag{color:var(--ink-4); background:var(--line-2);}
  .wcard .story.none .q{display:none;}
  .wcard .bkrow{margin-top:9px;}
  .wcard .bkadd{margin-top:14px;}

  .gradebar{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:14px;}
  .gradebar .btn{padding:12px 0; font-size:13.6px;}

  /* 词根词缀层 */
  .mnote{background:#fff; border-left:3px solid var(--teal); border-radius:0 8px 8px 0;
    padding:11px 15px; font-size:12.6px; color:var(--ink-2); line-height:1.75; margin-bottom:14px;}
  .mnote b{color:var(--ink);}
  .flash{align-items:stretch; justify-content:flex-start; padding:26px 24px 34px;}
  .flash .inner{display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; flex:1;}
  .roothint{font-size:12.2px; color:var(--ink-3); margin-bottom:14px; display:flex; align-items:center; gap:7px;}
  .roothint .rh{background:var(--teal-2); color:var(--teal); font-size:10.8px; font-weight:700;
    padding:1px 7px; border-radius:99px;}
  .morph{margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); text-align:left; width:100%;}
  .morph .mt{font-size:13.2px; color:var(--ink); line-height:1.85;}
  .morph .ms{font-size:11px; color:var(--ink-4); margin-top:5px; line-height:1.6;}
  .morph.none .mt{color:var(--amber); font-weight:600; font-size:12.8px;}
  .fam{margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; text-align:left; width:100%;}
  .fam .fl{font-size:10.8px; font-weight:700; color:var(--blue); background:var(--blue-2);
    padding:1px 7px; border-radius:99px;}
  .fam .fw{font-size:12.2px; color:var(--ink-2); background:#f5f8fc; border:1px solid var(--line-2);
    padding:3px 9px; border-radius:7px; font-family:Georgia,serif;}
  .fam .fw i{font-style:normal; color:var(--ink-4); font-family:inherit; font-size:11.4px; margin-left:4px;}
  .fam .fadd{font-size:11.6px; color:var(--blue); cursor:pointer; text-decoration:underline; margin-left:2px;}

  /* 词根总览 */
  .rhead{display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer;
    border-bottom:1px solid var(--line-2); background:#fff;}
  .rhead:hover{background:#f9fbfe;}
  .rhead .rt{font-family:Georgia,serif; font-size:15px; font-weight:700; color:var(--blue); min-width:150px;}
  .rhead .rc{font-size:13px; color:var(--ink-2);}
  .rhead .rn{margin-left:auto; font-size:11.6px; color:var(--ink-4); white-space:nowrap;}
  .rbody{padding:4px 16px 14px; background:#fbfcfe; border-bottom:1px solid var(--line-2);}
  .rbody table{font-size:12.6px;}
  .rbody .rq{font-size:12.4px; color:var(--ink-3); padding:8px 0 2px; line-height:1.8;}
  .rcard2{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:12px;}

  /* 句子本：拆句输入区 */
  .sent{font-family:Georgia,"Times New Roman",serif; font-size:17.5px; line-height:2.05; color:var(--ink);
    background:#f8fafd; border:1px solid var(--line); border-radius:11px; padding:18px 20px;}
  .lab{font-size:12.2px; color:var(--ink-3); margin:16px 0 6px; display:flex; align-items:center; gap:7px;}
  .lab b{color:var(--ink-2); font-weight:600;}
  .lab .tip{color:var(--ink-4); font-weight:400;}
  textarea,input[type=text]{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px;
    font-size:13.4px; font-family:inherit; color:var(--ink); background:#fff; resize:vertical;
    line-height:1.75;
  }
  textarea:focus,input[type=text]:focus{outline:none; border-color:#8fb4dd; box-shadow:0 0 0 3px rgba(20,83,154,.07);}
  .cmp{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
  .cmp .b{border:1px solid var(--line); border-radius:9px; padding:11px 13px; font-size:13.2px; line-height:1.85;}
  .cmp .b .t{font-size:11.3px; color:var(--ink-4); margin-bottom:4px;}
  .cmp .mine{background:#fdfbf7;}
  .cmp .ref{background:#f6fbf9;}
  /* 课堂：本周长难句示范 */
  .demo{margin-top:18px; padding-top:14px; border-top:1px dashed var(--line);}
  .demo h4{font-size:13px; color:var(--ink-2); margin:0 0 2px;}
  .ditem{padding:13px 0; border-bottom:1px dashed var(--line-2);}
  .ditem:last-child{border-bottom:0; padding-bottom:2px;}
  .ditem .de{font-family:Georgia,"Times New Roman",serif; font-size:14.4px; line-height:1.95; color:var(--ink); margin-bottom:8px;}
  .dsegs{margin-bottom:7px;}
  .dseg{display:inline-block; font-size:12.4px; padding:2px 7px; background:var(--teal-2); color:var(--teal); border-radius:5px; margin:0 5px 4px 0;}
  .drow{font-size:12.6px; line-height:1.85; color:var(--ink-3);}
  .drow b{color:var(--ink-2); font-weight:600;}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{border:1px solid var(--line); border-radius:99px; padding:5px 13px; font-size:12.4px; color:var(--ink-2); cursor:pointer; background:#fff;}
  .chip.on{background:var(--rose-2); border-color:#f0cfd7; color:var(--rose); font-weight:700;}

  /* 表格 */
  table{width:100%; border-collapse:collapse; font-size:12.9px;}
  thead th{background:#eef3fa; color:var(--ink-2); text-align:left; font-weight:700; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; font-size:12.4px;}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line-2); vertical-align:top; color:var(--ink-2); line-height:1.7;}
  tbody tr:last-child td{border-bottom:none;}
  tbody td:first-child{color:var(--ink); font-weight:600;}
  .c{text-align:center;} .nw{white-space:nowrap;}

  /* 日历 */
  .cal{display:grid; grid-template-columns:repeat(10,1fr); gap:6px;}
  .cal div{aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10.6px; color:var(--ink-4); background:#eef1f6;}
  .cal div.d1{background:#dce8f6; color:#5b7fa8;}
  .cal div.d2{background:#a9c6e5; color:#2c5b8c;}
  .cal div.d3{background:#5d93c9; color:#fff;}
  .cal div.d4{background:var(--blue); color:#fff; font-weight:700;}
  .cal div.now{outline:2px solid #e0a33a; outline-offset:1px;}

  .note{background:#fff; border-left:3px solid var(--blue); border-radius:0 8px 8px 0; padding:12px 16px; font-size:13px; color:var(--ink-2); margin-top:12px; line-height:1.8;}
  .note.warn{border-left-color:var(--rose);}
  .note.good{border-left-color:var(--teal);}
  .note b{color:var(--ink);}

  ul.tight{margin:0; padding-left:18px;}
  ul.tight li{font-size:13px; color:var(--ink-2); margin-bottom:5px; line-height:1.7;}

  .pill{display:inline-block; font-size:11.2px; font-weight:700; padding:1px 9px; border-radius:99px; background:var(--blue-2); color:var(--blue);}
  .pill.ok{background:var(--ok-2); color:var(--ok);}
  .pill.warn{background:var(--amber-2); color:var(--amber);}

  .empty{text-align:center; padding:36px 20px; color:var(--ink-4); font-size:13.2px;}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;}

  "population":"population 是人口：an aging population 老龄人口，说人口多寡用它。",

  "major":"major 是主要的：a major factor 主要因素，反义 minor。",
  "recent":"recent 是最近的：in recent years 近年来，常配现在完成时。",
  "rapid":"rapid 是快速：rapid growth 快速增长，比 fast 书面。",

  "complex":"complex 是复杂：a complex problem 复杂问题，反义 simple。",
  "potential":"potential 是潜在的，也是潜力：potential customers 潜在客户。",
  "appropriate":"appropriate 是合适：appropriate for 适合……的场合。",
  "comprehensive":"comprehensive 是全面的：comprehensive reading 精读，com-（全）+ prehens（抓）。",
  "familiar":"familiar 是熟悉：be familiar with sb/sth，with 别写成 to。",

  "take place":"take place 是「按计划发生」，happen 是「碰巧发生」。",

  "put out":"put out 扑灭：put out the fire 灭火，别理解成「放出去」。",
  "come up with":"come up with 想出：come up with an idea，with 不能丢。",

  "look forward to":"to 是介词：look forward to hearing from you，不是 to hear。",
  "look into":"look into 调查：look into the matter 查这件事，不是往里看。",
  "look up to":"look up to 敬佩：一直往上看的那个人，就是你的榜样。",
  "turn out":"turn out 结果是：It turned out that he was right 结果他是对的。",

  "turn to":"turn to 求助于：turn to sb for help，for 后面是求什么。",
  "break down":"break down 出故障，也指人崩溃：车会 break down，人也会。",

  "carry on":"carry on 继续：carry on with sth，别停。",
  "give up":"give up 放弃：give up doing，不接 to do。",

  "so far":"so far 迄今为止：常配现在完成时。",
  "by contrast":"by contrast 相比之下：两个事物对着说。",

  ['为什么先上这节课','后面的课文里会不断出现「主语、谓语、宾语、介词、定语」这些词。如果你不懂它们，每句话都像天书。这节课用大白话把这些术语一次讲清，看完再回 L1，所有句子都看得懂了。<br>不用背，先混个脸熟，后面每课都会反复用到，用着用着就懂了。'],
  ['一、先认识「词性」——每个英文单词都有自己的岗位','<b>名词</b> = 人、事物、地点的名字：teacher 老师、city 城市、book 书、water 水。<br><b>动词</b> = 表示「动作或状态」：run 跑、teach 教、love 爱。<b>是句子的发动机，每个句子必须有一个。</b><br><b>形容词</b> = 描述「什么样的」：beautiful 漂亮的、important 重要的、red 红色的。<br><b>副词</b> = 描述「怎么做的」：quickly 快地、very 非常、always 总是。多数副词长这样：形容词 + ly（quick → quickly）。<br><b>代词</b> = 代替名词避免重复：I 我、he 他、it 它、they 他们。<br>一张图记住分工：名词是「东西」，动词是「动作」，形容词给名词「贴标签」，副词给动词「贴标签」。'],
  ['二、介词——你圈出来的这个词（重点讲透）','<b>介词 = 表示「关系」的小词，本身没有动作，只负责把前后的词连起来。</b><br>它像一个小挂钩，主要表达三种关系：<br>· <b>位置关系</b>：in the room 在房间里（in = 在…里面）、on the desk 在桌上（on = 在…上面）、under the tree 在树下<br>· <b>方向关系</b>：go <b>to</b> school 去学校（to = 朝向）、come <b>from</b> China 来自中国（from = 从）<br>· <b>时间关系</b>：at 9:00 在九点、on Monday 在周一、in 2026 在2026年<br>为什么叫「介」词？因为它「介于」名词和其他词之间，必须带着一个名词一起出现：<br><b>arrive at</b> the station —— at 后面必须挂一个名词（the station），这个「at + 名词」的整体叫<b>介词短语</b>，作用相当于一个形容词或副词，用来说明「在哪里 / 什么时候 / 怎么样」。<br>换个角度看：<b>中文里「在」「到」「从」「向」「对」这些字，就是介词的角色</b>。「到达车站」的「到」、「在桌上」的「在」——英文换成 at / on 而已。你早就在用介词，只是中文里它们长得不像一个「词类」。<br>考试怎么考：① 固定搭配记哪个介词（arrive <b>at</b>、listen <b>to</b>、good <b>at</b> 擅长）② 时间介词三选一（at 点 / on 天 / in 段）③ 它标记的短语在长句里是「修饰」，砍长句时整块砍掉。'],
  ['三、句子成分——一句话里的六个岗位','拿一句中文对照：「昨天那个女孩在图书馆认真地读了一本书。」<br>· <b>主语</b> = 动作的发出者，回答「谁？」：那个女孩（the girl）<br>· <b>谓语</b> = 动词本身，回答「做什么」：读了（read）<br>· <b>宾语</b> = 动作的承受者，回答「动了什么」：一本书（a book）<br>· <b>定语</b> = 修饰<b>名词</b>的成分：「昨天那个」修饰女孩——定语回答「哪个？」<br>· <b>状语</b> = 修饰<b>动词</b>的成分：「在图书馆」「认真地」修饰读——状语回答「在哪 / 怎么做 / 何时」<br>· <b>表语</b> = be 动词后面的成分：「她是医生」的「医生」（She is a doctor）<br>记法：<b>主语干活，谓语是动作，宾语挨打，定语贴在名词前，状语围着动词转。</b><br>英文完全一样：The girl <b>carefully</b> read a book in the library.（carefully = 状语，in the library = 状语）'],
  ['四、及物与不及物——为什么有的动词后面要加介词','<b>及物动词（vt）</b>：动作直接砸到对象上，后面直接跟宾语——I love <b>you</b>. 我爱你。<br><b>不及物动词（vi）</b>：动作自己就完整，后面<b>不能</b>直接跟对象——Birds fly. 鸟会飞（fly 后面什么都不用带）。<br>问题来了：不及物动词也想说「对谁做」怎么办？——<b>必须请介词当中间人</b>：<br>listen（听，不及物）→ listen <b>to</b> music 听音乐（to 是中间人）<br>arrive（到达，不及物）→ arrive <b>at</b> the station 到达车站<br>✗ arrive the station（中间人不能省）✓ arrive <b>at</b> the station<br>这就是 L1 说的「要接宾语必须加介词」的全部含义：<b>不及物动词 + 介词 + 名词</b>，介词是它的通行证。'],
  ['五、三句话检验你是否过关','① I put the book <b>on</b> the desk. —— on 是<b>介词</b>（位置关系），the book 是<b>宾语</b>，on the desk 整体是<b>状语</b>（说明放哪儿）。<br>② She looks <b>beautiful</b>. —— beautiful 是<b>形容词</b>作表语（looks 是系动词）。<br>③ The man <b>in the car</b> is my boss. —— in the car 是介词短语作<b>定语</b>，修饰 the man（「车里那个男人」）。<br>能想明白这三句，就可以进 L1 了。想不明白就再读一遍第二、三节。'],

{id:'L1',wk:'第 1 周',t:'句子骨架：五种基本句型',sub:'主谓 / 主谓宾 / 主系表 / 双宾 / 宾补 / there be / it',
 teach:[
  ['为什么先学骨架','中文和英文的语序思路不一样：中文把修饰放在前面（「穿红衣服的女孩」），英文把长修饰放在后面（The girl in red）。所以读英文长句的正确动作是：<b>先找骨架，再看修饰</b>。<br>每读一句先问三个问题：① 谁是主语？② 谓语动词是哪个？③ 其余部分在修饰谁？把这三个问题练成本能，阅读 70% 的困难就消失了。'],
  ['① 主+谓（不及物动词）','<b>The man left.</b> 那个人走了。<br><b>Birds fly.</b> 鸟会飞。<br><b>What happened?</b> 发生了什么事？<br>「不及物」= 动作不需要承受者，后面<b>不能直接跟宾语</b>。常见不及物：come、go、happen、rise（上升）、die、arrive、listen。<br>要接对象必须加<b>介词</b>（介词 = 表示「到 / 在 / 从」这类关系的小词，详见先修课 L0 第三节）：<b>arrive at</b> the station 到达车站、<b>listen to</b> music 听音乐。<br>✗ arrive the station　✓ arrive <b>at</b> the station'],
  ['② 主+谓+宾','<b>She teaches English.</b> 她教英语。<br><b>I love this city.</b> 我爱这座城市。<br><b>He is reading a book.</b> 他正在读一本书。<br>「及物」= 动作有承受者，宾语就是动作的对象。找宾语的方法：谓语动词后问「什么？」——teach 什么？English。<br>阅读技巧：先抓「谁 + 做了什么」，句子意思就懂了一半，剩下的都是修饰。'],
  ['③ 主+系+表','这个句型的动词不表示「做动作」，而是「描述状态」。系动词分四类，全部要认识：<br>· <b>be</b>（是）：She <b>is</b> a doctor. 她是医生。<br>· 感官类：<b>look / sound / smell / taste / feel</b>（看起来/听起来/闻起来/尝起来/摸起来）：The music <b>sounds</b> beautiful. 音乐听起来很美。<br>· 变化类：<b>become / turn / get / go</b>（变得）：He <b>got</b> angry. 他生气了。<br>· 保持类：<b>keep / stay / remain</b>（保持）：Please <b>keep</b> quiet. 请保持安静。<br><b>铁律：系动词后面接形容词，不接副词。</b><br>✗ The soup tastes well.　✓ The soup tastes <b>good</b>. 汤尝起来很好喝。<br>（特例：well 作形容词只有「身体好」一个意思：I am well. 我身体很好。）'],
  ['④ 主+谓+双宾','动作同时涉及「人」和「物」两个对象：<br><b>He gave me a book.</b> 他给了我一本书。= He gave a book <b>to</b> me.<br><b>My mother bought me a bike.</b> 妈妈给我买了辆自行车。= She bought a bike <b>for</b> me.<br>近的宾语是「物」（直接宾语），远的宾语是「人」（间接宾语）。<br>用 <b>to</b> 的动词（动作朝向人）：give / send / show / tell / pass / lend / return<br>用 <b>for</b> 的动词（为某人做）：buy / make / cook / get / find<br>判断方法：把句子改成「物 + 介词 + 人」，介词选 to 还是 for 背动词即可，考试就考这一步。'],
  ['⑤ 主+谓+宾+补','宾补 = 补充说明宾语「是什么 / 怎么样」：<br><b>We call him Jack.</b> 我们叫他 Jack。（him = Jack，宾补是名词）<br><b>The news made me happy.</b> 这个消息让我开心。（宾补是形容词）<br><b>I found the room empty.</b> 我发现房间是空的。<br><b>Keep the door open.</b> 让门开着。<br>常用动词：make / keep / find / consider / call / name / leave。<br>两个硬规则：宾语必须用<b>宾格</b>（made <b>me</b> happy ✗ made I）；补语位置用<b>形容词</b>（✗ made me happily）。'],
  ['there be 句型','表示「某地有某物」，there 无实义，真正的主语在 be 后面：<br><b>There is a book and two pens on the desk.</b> 桌上有一支笔和两本书。<br><b>There was an accident here last night.</b> 昨晚这里出了一次事故。<br><b>There is a man standing at the door.</b> 有个人正站在门口。（there be + 名词 + doing：正在做）<br><b>就近原则</b>：be 动词跟<b>最近的名词</b>保持一致——上面第一句最近的名词是 a book，所以用 is。<br>两个禁止：✗ There <b>have</b> a book.（there be 句型不能用 have）✗ There is <b>stand</b> a man.（动词要用 doing 形式）'],
  ['it 句型','it 在这里<b>没有词义</b>，只是占位，真正的内容在后面：<br><b>It is important to learn English.</b> 学英语很重要。（真正主语 = to learn English）<br><b>It takes me two hours to finish the work.</b> 完成这项工作花了我两个小时。<br><b>I find it difficult to get up early.</b> 我发现早起很难。（it 形式宾语，代替 to get up early）<br>判断方法：把 it 换成后面的真主语/真宾语，句子意思不变，就说明它是形式主语/宾语。'],
  ['长句砍修饰法（本课最重要的一节）','四步：<b>① 找谓语动词 ② 找主语 ③ 砍掉介词短语/从句/分词 ④ 连成中文</b><br>例 1：<b>The girl [in red] [who sits behind me] is my deskmate.</b><br>→ 找到谓语 is → 主语是 The girl → 方括号全是修饰 → 骨架：The girl is my deskmate.<br>→ 译文：穿红衣服、坐我后面的那个女孩是我的同桌。<br>例 2：<b>The book [that I bought yesterday] is interesting.</b><br>→ 骨架：The book is interesting. → 译文：我昨天买的那本书很有趣。<br>你看到的英文长句，90% 都能用这个方法拆开。']],
 bank:[
  {s:'There __ a pen and two books on the desk.',o:['is','are','be','been'],a:0,e:'there be 就近原则：动词跟最近的 a pen 保持一致，用单数。'},
  {s:'The soup tastes __.',o:['good','well','badly','nicely'],a:0,e:'系动词后接形容词。taste well 不成立（well 作形容词仅指「身体好」）；nicely 是副词，不能作表语。'},
  {s:'He gave __ yesterday.',o:['me a book','a book me','to me a book','a book to I'],a:0,e:'双宾语 give sb sth：人放前、物放后。宾语用宾格 me。'},
  {s:'My mother bought __ last week.',o:['a bike for me','for me a bike','a bike me','me to a bike'],a:0,e:'buy 搭配 for：buy sth for sb。give 类才用 to。'},
  {s:'The news made __.',o:['me happy','me happily','I happy','my happy'],a:0,e:'主谓宾+宾补：make + 宾语 + 形容词。宾语用宾格 me，补语用形容词。'},
  {s:'We found __ hard to finish the work on time.',o:['it','this','that','them'],a:0,e:'it 形式宾语：find it + adj + to do，真正的宾语是 to finish...。'},
  {s:'She __ a teacher for ten years.',o:['has been','is being','was been','is'],a:0,e:'for ten years 与现在完成时连用：has been。'},
  {s:'__ a lot of students on the playground now.',o:['There are','There is','There have','There has'],a:0,e:'就近的 students 是复数 → There are。there be 句型不能用 have。'},
  {s:'Which one is 主+谓+宾+补 结构？',o:['We call the dog Lucky.','The dog is Lucky.','We call the dog.','The dog called Lucky.'],a:0,e:'call + 宾(the dog) + 补(Lucky)。A 是宾补，B 是主系表，C 是主谓宾。'},
  {s:'The girl in red who sits behind me is my deskmate. 主干是？',o:['The girl is my deskmate.','The girl sits behind me.','My deskmate is behind me.','I sit behind the girl.'],a:0,e:'in red 和 who sits behind me 都是修饰 the girl 的定语，砍掉后主干是主系表。'},
  {s:'He looks __ today.',o:['tired','tiredly','tire','tiring'],a:0,e:'look 是系动词，接形容词。tired 修饰人「感到累」，tiring 修饰物「令人累」。'},
  {s:'There is a man __ at the door.',o:['standing','stands','stood','to stand'],a:0,e:'there be + 名词 + doing：主动进行的动作用现在分词。'}
 ]},
{id:'L2',wk:'第 2 周',t:'修饰语的位置：定语与状语',sub:'形容词前置 / 介词短语后置 / 副词位置 / enough 后置',
 teach:[
  ['什么是定语、状语','<b>定语</b>：修饰名词的成分，翻译成中文就是「……的」：a <b>red</b> car 一辆红色的车。<br><b>状语</b>：修饰动词/整句的成分，说明「什么时候、在哪、怎么做、为什么」：He runs <b>fast</b>. 他跑得快。<br>中英最大的差异在这里：<b>中文的修饰永远在前面，英文的短修饰在前、长修饰在后</b>。这就是你翻译不出来句子的第二个原因（第一个是找不到主干）。'],
  ['单个形容词：前置，但有一类必须后置','正常情况放名词前：an <b>interesting</b> book 一本有趣的书。<br>但修饰 <b>something / anything / nothing / everything / somewhere</b> 这类不定代词时，形容词<b>必须放后面</b>：<br>✓ something <b>important</b> 重要的事情　✗ important something<br>✓ nothing <b>new</b> 没什么新东西<br>判断方法：看到 something/anything/nothing 开头的词组，修饰语一律往后放——这个考点每年都考。'],
  ['后置定语三兄弟（长修饰放后面）','① 介词短语：the man <b>in the room</b> 房间里的那个男人<br>② 分词：the language <b>spoken in Brazil</b> 巴西人说的语言（被说 → 过去分词）；the boy <b>standing there</b> 站在那里的男孩（主动 → 现在分词）<br>③ 不定式：the way <b>to solve it</b> 解决这个问题的办法<br>翻译练习：The girl <b>in red</b> is my sister. → 穿红衣服的那个女孩是我妹妹。修饰语短就放前面，长就放后面，但<b>介词短语作定语永远后置</b>。'],
  ['副词的位置','频度副词（always / usually / often / sometimes / never）的固定位置：<br>· 实义动词<b>前面</b>：He <b>always</b> comes late. 他总是迟到。<br>· be 动词<b>后面</b>：He is <b>always</b> late. 他总是迟到。<br>· 助动词后面：I have <b>never</b> been there. 我从没去过那里。<br><b>enough 的位置是必考点</b>：修饰形容词/副词时放<b>后面</b>：<br>✓ old <b>enough</b> 年龄够大　✗ enough old<br>✓ He is not old <b>enough</b> to join the army. 他年纪不够大，不能参军。'],
  ['多个状语的排列顺序','顺序：<b>方式 → 地点 → 时间</b>（小的时间单位在前）：<br>He worked <b>quietly</b>（方式）<b>in the office</b>（地点）<b>all day</b>（时间）. 他一整天都在办公室安静地工作。<br>时间状语可以提到句首表强调：<b>Yesterday</b> I met an old friend. 昨天我遇到了一位老朋友。'],
  ['时间介词三兄弟（送分题）','<b>at</b> + 钟点：at 9:00 在九点<br><b>on</b> + 具体某天（含某天的上午下午）：on Monday 在周一、on Monday morning 在周一早上<br><b>in</b> + 月 / 年 / 季节 / 世纪：in May 在五月、in 2026、in winter<br>口诀：<b>at 点、on 天、in 大</b>。易错：具体某天的上下午也用 on（因为 Monday morning 是「一天」的概念）。'],
  ['数词修饰','确切数字：数词 + 名词，<b>不加 s、不加 of</b>：two <b>hundred</b> students 两百个学生<br>泛指「成百上千」：<b>加 s + of</b>：<b>hundreds of</b> students 成百上千的学生<br>同理：thousands of 成千上万的、millions of 数百万的。<br>✗ two hundreds students　✓ two hundred students'],
  ['复合形容词作定语','「数词-名词-形容词」用连字符连起来放名词前，中间名词用<b>单数</b>：<br>a <b>five-year-old</b> boy 一个五岁的男孩（✗ five-years-old）<br>a <b>well-prepared</b> meeting 一场准备充分的会议<br>a <b>hard-working</b> student 一个勤奋的学生']],
 bank:[
  {s:'I have __ to tell you.',o:['something important','important something','something of important','important anything'],a:0,e:'不定代词的定语后置：something important。'},
  {s:'He is not __ to join the army.',o:['old enough','enough old','too old','so old'],a:0,e:'enough 修饰形容词要后置；not...enough to do = 不够…而不能。'},
  {s:'He __ late for school.',o:['is always','always is','always be','be always'],a:0,e:'频度副词放 be 动词之后。'},
  {s:'The man __ is our new teacher.',o:['in black','in a black','in black is','wear black'],a:0,e:'介词短语作后置定语：「穿黑衣的男人」，不能说 the man in a black。'},
  {s:'The meeting will begin __.',o:['at nine o\'clock','on nine o\'clock','in nine o\'clock','nine o\'clock at'],a:0,e:'具体钟点用 at。'},
  {s:'He lives __.',o:['next to me','next me','to next me','next of me'],a:0,e:'next to 是固定介词短语：紧挨着。'},
  {s:'There is __ in today\'s newspaper.',o:['nothing new','new nothing','new something','nothing of new'],a:0,e:'不定代词的定语后置：nothing new「没什么新闻」。'},
  {s:'We had a __ meeting yesterday.',o:['well-prepared','well prepared','prepared well','prepare-well'],a:0,e:'复合形容词作前置定语要加连字符：a well-prepared meeting。'},
  {s:'She speaks English __.',o:['very well','very good','very better','good very'],a:0,e:'修饰动词 speak 用副词 well。'},
  {s:'He didn\'t notice the picture __.',o:['on the wall','on wall','in the wall','at wall'],a:0,e:'挂在墙上用 on the wall；介词短语作后置定语。'},
  {s:'The teacher asked us to keep __.',o:['quiet','quietly','quieten','quietness'],a:0,e:'keep + 宾语 + 形容词（宾补）：保持安静。'},
  {s:'__ students watched the game.',o:['Hundreds of','Three hundreds','Two hundred of','Some hundreds'],a:0,e:'泛指 hundreds of；确切数字 two hundred 不加 s 也不加 of。'}
 ]},
{id:'L3',wk:'第 3 周',t:'并列句 + 四大时态',sub:'and/but/or/so · 现在完成 · 过去完成 · 主将从现',
 teach:[
  ['并列连词：把两个句子拧在一起','<b>and</b> 顺承（然后）：He opened the door <b>and</b> walked in. 他打开门走了进去。<br><b>but</b> 转折（但是）：He is old <b>but</b> strong. 他年纪大但身体壮。<br><b>or</b> 否则：Study hard, <b>or</b> you will fail. 好好学，否则你会不及格。<br><b>so</b> 因此：It was late, <b>so</b> we went home. 天晚了，所以我们回家了。<br><b>并列主语的就近原则</b>：Neither he nor I <b>am</b> interested. 他和我都对数学不感兴趣。（动词跟最近的主语 I 一致）'],
  ['祈使句 + and / or（固定考法）','<b>祈使句 + and</b> = 「那么就会」：Work hard, <b>and</b> you will pass. 努力学，你就会通过。<br><b>祈使句 + or</b> = 「否则就会」：Hurry up, <b>or</b> we\'ll be late. 快点，否则我们要迟到了。<br>考法：给一句祈使句让你选 and / or / but / so。判断方法：后半句是「好结果」选 and，「坏结果」选 or。'],
  ['四大时态：一张结构表','<table><tr><th>时态</th><th>结构</th><th>信号词</th><th>例句</th></tr><tr><td>一般现在</td><td>do / does</td><td>often、usually、every day</td><td>He <b>goes</b> to school every day. 他每天上学。</td></tr><tr><td>一般过去</td><td>did</td><td>yesterday、last week、in 2020、ago</td><td>I <b>lost</b> my keys yesterday. 我昨天丢了钥匙。</td></tr><tr><td>现在完成</td><td>have / has + done</td><td>since、for、already、yet、just、recently、so far</td><td>I <b>have lost</b> my keys. 我把钥匙弄丢了。</td></tr><tr><td>过去完成</td><td>had + done</td><td>by the time + 过去、by last year、before + 过去</td><td>He <b>had finished</b> before I came. 我来之前他就做完了。</td></tr></table><br>做题第一步：<b>先在句子里找信号词</b>，信号词直接决定时态，这是送分题。'],
  ['现在完成时深讲（考得最多）','两个用法：<br>① <b>过去的事对现在有影响</b>：I <b>have lost</b> my keys.（丢钥匙是过去的事，但影响是「现在没钥匙开门」）<br>② <b>从过去延续到现在</b>：She <b>has taught</b> here since 2020. 从 2020 年起她一直在这里教书。（现在还在教）<br>两个「去」的辨析：<br>have <b>been to</b> Beijing 去过北京（人已经回来了）→ 可以说次数：I have been there twice.<br>have <b>gone to</b> Beijing 去了北京（人还没回来）→ 只能说别人：He has gone to Beijing.<br>易错：since + 过去时间点（since 2020），for + 时间段（for ten years），两个都配现在完成。'],
  ['过去完成时：「过去的过去」','当过去发生两件事，<b>更早的那件用过去完成</b>：<br><b>The train had left when I got to the station.</b> 我到车站时，火车已经开走了。（先开车，后到站）<br><b>He had finished his homework before his mother came back.</b> 妈妈回来之前，他已经做完了作业。<br>判断方法：句子里有「过去的时间点」（when I got there / by the end of last year），再往前的事用 had done。'],
  ['主将从现（高频铁律）','if / when / as soon as / until / unless 引导的从句，<b>用一般现在时表将来</b>：<br>✓ If it <b>rains</b> tomorrow, we will stay home. 如果明天下雨，我们就待在家里。<br>✗ If it will rain...<br>口诀：<b>主将从现</b>——主句用将来时，从句用现在时。注意只是从句换，主句照常 will。'],
  ['过去进行时','was / were + doing：「过去某一时刻正在发生」：<br><b>She was watching TV when I called her.</b> 我打电话时她正在看电视。<br>信号：when I called（过去的短暂动作）+ was doing（延续动作）。<br>信号词 Listen! / Look! 提示现在进行：Listen! Someone <b>is playing</b> the piano. 听！有人在弹钢琴。'],
  ['三个送分细节','① 客观真理、自然规律永远用一般现在：The earth <b>goes</b> around the sun. 地球绕着太阳转。<br>② 有明确过去时间（yesterday / last night / in 2020）就用一般过去，<b>不能用现在完成</b>：✗ I have seen him yesterday.<br>③ 平行结构：and 前后形式要一致：✗ He likes swimming and to run.　✓ He likes <b>swimming</b> and <b>running</b>.']],

  {s:'I __ my keys. I can\'t open the door.',o:['have lost','lost','lose','had lost'],a:0,e:'过去的动作对现在造成影响 → 现在完成。'},
  {s:'He said that he __ the film before.',o:['had seen','saw','has seen','sees'],a:0,e:'宾语从句里「过去的过去」→ 过去完成。'},

  {s:'Work hard, __ you will pass the exam.',o:['and','or','but','so'],a:0,e:'祈使句 + and = 「那么就会」。'},

  {s:'My brother __ to Beijing twice.',o:['has been','has gone','is going','went'],a:0,e:'have been to 去过（人已回来）才有「两次」。'},

{id:'L4',wk:'第 4 周',t:'定语从句',sub:'who / which / that / whose / where / when / 介词+which',
 teach:[
  ['它是什么 + 做题总纲','定语从句就是一个「拉长的形容词」，紧跟在它修饰的名词（<b>先行词</b>）后面。<br>The book <b>[that I bought yesterday]</b> is interesting. → 我昨天买的那本书很有趣。<br>所有定语从句题都是两步：<b>① 找先行词（是人？物？时间？地点？）② 看从句里缺什么成分</b>。这两步定答案，不需要语感。'],
  ['第一步：认先行词','紧跟从句前面的那个名词就是先行词：<br>the man <b>who</b> helped me（人）帮过我的那个人<br>the book <b>that</b> I bought（物）我买的那本书<br>the day <b>when</b> we met（时间）我们见面的那天<br>the house <b>where</b> I lived（地点）我住过的房子<br>the reason <b>why</b> he was late（原因）他迟到的原因<br>易错：先行词不一定紧贴从句——The days <b>which</b> we spent together（spent 的宾语）与 The days <b>when</b> we met（met 完整）用哪个，看第二步。'],
  ['第二步：从句缺成分吗？','<b>缺主语或宾语 → 关系代词（who/whom/which/that）</b><br>the museum <b>which</b> you visited last month（visit 缺宾语：visited <b>什么</b>？缺 → 代词）你上月参观的博物馆<br>the man <b>who</b> helped me（helped 缺主语：谁帮的？缺 → 代词）<br><b>主谓宾完整 → 关系副词（where/when/why）</b><br>the house <b>where</b> I worked（I worked 主谓完整 → 副词）我工作过的房子<br>the day <b>when</b> we met（met 完整 → 副词）<br>这就是「visited 选 which、worked 选 where」的原因——同一类先行词，答案由从句内部决定。'],
  ['关系代词细讲','<b>who</b> 指人作主语：This is the man <b>who</b> helped me. 这就是帮过我的那个人。<br><b>whom</b> 指人作宾语（正式）：the girl <b>whom</b> I met 我见过的那个女孩<br><b>which / that</b> 指物：The book <b>that</b> I bought is interesting.<br><b>whose</b> = 谁的，<b>人和物都能用</b>：<br>the girl <b>whose</b> mother is a doctor 妈妈是医生的那个女孩<br>the house <b>whose</b> windows face south 窗户朝南的那座房子<br>that 作宾语可以省略：the book (that) I bought 中的 that 可省。'],
  ['只用 that 的三种情况（必背）','① 先行词是 all / everything / nothing / anything / little：<b>All that</b> can be done has been done. 能做的都做了。<br>② 先行词被序数词、最高级修饰：This is the best film <b>that</b> I have ever seen. 这是我看过的最好的电影。<br>③ 先行词被 the only / the very / all 修饰：the only book <b>that</b> I want 我唯一想要的书。'],
  ['只用 which：逗号之后','非限制性定语从句（前面有逗号）指物时<b>只能 which，不能 that</b>，它常指代前面整件事：<br><b>He failed the exam, which made his parents angry.</b> 他考试不及格，这让父母很生气。（which = 他不及格这件事）<br>判断：逗号 + 指物 → 闭眼选 which。'],
  ['介词 + which / whom（进阶）','方法：<b>看从句里的动词和什么介词搭配，把介词提前</b>：<br>He writes <b>with</b> a pen. → The pen <b>with which</b> he writes is made in Shanghai. 他写字用的那支笔是上海造的。<br>I lived <b>in</b> the house. → the house <b>in which</b> I lived = the house <b>where</b> I lived<br>规则：介词后面只能跟 which / whom，<b>不能 that</b>：✗ with that。']],

  {s:'This is the house __ I lived ten years ago.',o:['where','which','that','when'],a:0,e:'lived 是不及物动词，从句完整 → where（= in which）。'},
  {s:'The man __ car was stolen called the police.',o:['whose','his','who\'s','which'],a:0,e:'「他的车」= whose car，物主关系用 whose。'},
  {s:'He failed the exam, __ made his parents angry.',o:['which','that','what','who'],a:0,e:'逗号后面指代整件事，只能用 which，不能用 that。'},

  {s:'The pen __ he writes is made in Shanghai.',o:['with which','with that','in which','by which'],a:0,e:'write with a pen → 介词提前：with which。that 不能紧跟介词。'},

{id:'L5',wk:'第 5 周',t:'状语从句',sub:'时间 / 条件 / 让步 / 原因 / 目的 / 结果',
 teach:[
  ['状语从句是什么','两个句子，一个当「背景说明」（时间、条件、原因……），连接词放在两句之间：<br><b>Although</b> it rained heavily, he arrived on time. 虽然雨下得很大，他还是准时到了。<br>做题只考一件事：<b>两句之间是什么逻辑关系</b>？转折选 although、原因选 because、条件选 if。先读两句、想清楚关系，再选连词。'],
  ['六类从句一张表','<b>时间</b>：when / while / as / until / as soon as —— When I got home, my wife was cooking. 我到家时妻子在做饭。<br><b>条件</b>：if / unless（= if not）/ as long as（只要）—— You will fail <b>unless</b> you work harder. 除非你更努力，否则会失败。<br><b>让步</b>：although / though / even if（即使）/ however（无论多么）—— <b>However hard</b> he tries, he can\'t pass. 无论他多努力都过不了。<br><b>原因</b>：because / since（既然）/ as / now that（既然）—— <b>Now that</b> you have finished, you can rest. 既然做完了，你休息吧。<br><b>目的</b>：so that / in order that（以便，后接 can/may）—— He spoke slowly <b>so that</b> we could follow him. 他说得很慢，以便我们能跟上。<br><b>结果</b>：so...that / such...that —— It was <b>so</b> hot <b>that</b> we stayed indoors. 天太热了，我们只能待在室内。'],
  ['铁律一：although 和 but 不能同时出现','中文说「虽然……但是……」，英文<b>一个句子只能要一个</b>：<br>✗ <b>Although</b> he is old, <b>but</b> he works hard.<br>✓ <b>Although</b> he is old, he works hard. 虽然他年纪大了，但工作很努力。<br>同理：<b>because 和 so 不能同时出现</b>。<br>这是中国学生最高频的错误（母语迁移），考试专门设坑：选项里 although 和 but 同时出现，直接排除。'],
  ['铁律二：主将从现','时间、条件从句用<b>一般现在时表将来</b>：<br>✓ If it <b>rains</b> tomorrow, we will stay home. 如果明天下雨我们就待在家。<br>✗ If it will rain...<br>注意只有 when/if 引导<b>从句</b>时才这样；when 作疑问词时不受此限：I don\'t know when he <b>will come</b>. 我不知道他什么时候来。'],
  ['until 家族 + in case','肯定句 <b>until</b> = 直到：I\'ll wait <b>until</b> you come back. 我会等到你回来。<br><b>not...until</b> = 直到……才：He didn\'t go to bed <b>until</b> he finished his homework. 他做完了作业才去睡觉。<br><b>in case</b> = 以防万一（后接一般现在时表将来）：Take an umbrella <b>in case</b> it rains. 带把伞以防下雨。'],
  ['so 与 such 的公式（必考）','<b>so + 形容词/副词</b>：so hot that... 这么热以至于……<br><b>such + (a/an) + 形容词 + 名词</b>：He is <b>such a</b> kind man that everyone likes him. 他人这么好，人人都喜欢他。<br>四个例外用 so：<b>so many / so much / so few / so little</b> + 名词（so many books 那么多书）。<br>判断方法：中心词是形容词 → so；中心词是名词 → such（many/much/few/little 除外）。'],
  ['while / when / as 的分工','<b>while</b> + 延续动作，表「与此同时」：I was reading <b>while</b> he was cooking. 我在看书，他在做饭。<br><b>when</b> + 短暂或延续都行：When I got home, my wife was cooking. 我到家时她在做饭。（got home 是短暂动作，不能用 while）<br><b>as</b> = 一边……一边 / 随着：As I get older, I feel happier. 随着年龄增长我更快乐了。<br>判断方法：从句动作是「一瞬间」用 when，是「一段过程」用 while。'],
  ['because of 与 because（完形高频）','<b>because + 句子</b>（有主谓）：He was late <b>because</b> he missed the bus. 他迟到是因为没赶上公交。<br><b>because of + 名词/短语</b>：He was late <b>because of</b> the heavy rain. 他因为大雨迟到了。<br>同理：although + 句子，despite / in spite of + 名词。填空题先看横线后面是句子还是名词，再选。']],

  {s:'I\'ll wait __ you come back.',o:['until','because','though','if'],a:0,e:'肯定式 until = 直到。'},

  {s:'__ you have finished the work, you can have a rest.',o:['Now that','Because of','Even if','In case'],a:0,e:'now that = 既然（原因）。'},
  {s:'He spoke slowly __ we could follow him.',o:['so that','such that','because','until'],a:0,e:'so that + can/may = 以便（目的）。'},
  {s:'__ he was tired, he kept working.',o:['Though','Because','If','Unless'],a:0,e:'让步：虽然累但继续工作。'},
  {s:'I was reading __ he was cooking.',o:['while','when','since','until'],a:0,e:'两个延续动作同时进行 → while。'},
  {s:'You will fail __ you work harder.',o:['unless','if','when','although'],a:0,e:'unless = if not：除非你更努力，否则会失败。'},
  {s:'It was __ hot that we stayed indoors.',o:['so','such','very','too'],a:0,e:'so + 形容词 + that 结果状语从句。very 不能接 that。'},
  {s:'__ hard he tries, he can\'t pass.',o:['However','How','Whatever','Although'],a:0,e:'However + adj/adv + 主谓 = 无论多么。'},
  {s:'__ I got home, my wife was cooking.',o:['When','While','Until','Unless'],a:0,e:'got home 是短暂动作 → when；while 要接延续动作。'},

 ]},
{id:'L6',wk:'第 6 周',t:'名词性从句 + it 句型',sub:'that vs what · 陈述语序 · whether vs if · it 形式主语',
 teach:[
  ['它是什么：从句当名词用','把一整句话当一个「名词」用，有四个位置：<br>· <b>主语位置</b>：__ he said at the meeting surprised us.（「他说的话」是全句主语）<br>· <b>宾语位置</b>：I know <b>that he is honest</b>. 我知道他是诚实的。<br>· <b>be 后面（表语）</b>：The question is <b>whether we can finish it</b>. 问题是我们能否按时完成。<br>· 名词后面解释内容（同位语）：the news <b>that our team won</b> 我们队获胜的消息<br>做题核心只有一件事：<b>选对引导词</b>（that / what / whether / when...）。'],
  ['that 与 what：先看从句缺不缺成分（最高频考点）','<b>what</b>：从句里<b>缺主语或宾语</b>时用。what 自己在从句里充当成分，= the thing that：<br><b>What he said at the meeting surprised us.</b>（said 缺宾语：说了<b>什么</b>？）他在会上说的话让我们吃惊。<br><b>What we need is more time.</b>（need 缺宾语：需要<b>什么</b>？）我们需要的是更多时间。<br><b>that</b>：从句<b>主谓宾完整</b>时用。that 不作任何成分、没有词义，只负责「引出这句话」：<br>The fact <b>that</b> he works hard is known to all. 他工作努力这件事众所周知。（works hard 完整）<br><b>判断口诀：从句缺成分用 what，完整用 that。</b>做两道题就熟了。'],
  ['陈述语序（判卷必扣分点）','从句一律用<b>陈述语序：主语在前、动词在后</b>。疑问词虽然带疑问意思，但语序不倒：<br>✓ Could you tell me <b>where he lives</b>? 你能告诉我他住哪儿吗？<br>✗ where does he live（把一般疑问句的语序直接搬进来——中国学生最高频错误）<br>✓ He asked me <b>if I was tired</b>. 他问我累不累。<br>一般问句变从句的公式：<b>if/whether + 陈述语序</b>。'],
  ['whether 与 if：五个位置只能 whether','① 介词后面：It depends on <b>whether</b> he agrees. 这取决于他是否同意。<br>② 不定式前面：I don\'t know <b>whether</b> to go. 我不知道要不要去。<br>③ 句首主语从句：<b>Whether</b> he will come hasn\'t been decided. 他来不来还没定。<br>④ 与 or not 连用：I don\'t know <b>whether or not</b> he will come.<br>⑤ 表语从句：The question is <b>whether</b> we can finish it.<br>记忆技巧：拿不准就选 whether——if 能用的位置它都能用，反之不行。'],
  ['it 形式主语 / 形式宾语','主语从句太长时，用 it 先占位，真主语放句尾：<br><b>It is a pity that you missed the match.</b> 你错过了比赛，真遗憾。<br><b>It hasn\'t been decided when the meeting will be held.</b> 会议何时开还没定。<br>「动词 + it + 形容词 + to do」句型：<br><b>I find it difficult to get up early.</b> 我发现早起很难。（it 代替 to get up early）<br>特例句型：<b>It is important / necessary that + 主语 + (should) 动词原形</b>——这是第 8 课虚拟语气的入口。'],
  ['同位语从句 vs 定语从句（一招区分）','同样接在名词后，看 that 从句内部完不完整：<br>· 从句<b>完整</b> → 同位语从句（that 不作成分）：the news <b>that our team had won</b> 我们队获胜的消息<br>· 从句<b>缺成分</b> → 定语从句（that 作主语或宾语）：the news <b>that</b> he told me 他告诉我的那个消息（told 缺宾语）<br>常接同位语从句的名词：news / fact / idea / hope / suggestion。']],

  {s:'We heard the news __ our team had won.',o:['that','which','what','when'],a:0,e:'同位语从句解释 news 的内容，从句完整 → that。'},

  {s:'__ we need is more time.',o:['What','That','Which','Whether'],a:0,e:'need 缺宾语 → what 作主语从句引导词。'},

{id:'L7',wk:'第 7 周',t:'非谓语动词',sub:'to do / doing / done · 三步判断法',
 teach:[
  ['为什么要有非谓语','英语一句话<b>只能有一个谓语动词</b>。第二个动词出场时必须「卸任」——变成非谓语形式：<br>He ran fast <b>to catch</b> the bus. 他跑得很快为了赶上公交。（ran 是谓语，catch 变 to catch）<br><b>Seeing</b> the police, the thief ran away. 看到警察，小偷跑了。（see 变 doing，ran 是谓语）'],
  ['三种形态一句话记住','<b>to do</b>：将来的、目的的（要去干、还没干）<br><b>doing</b>：主动的、进行的（正在干、主动干）<br><b>done</b>：被动的、完成的（被干、已经干完）'],
  ['判断三步法（做题就靠它）','① <b>找逻辑主语</b>：这个动作是谁做的？看主句主语。<br>② <b>判断主动还是被动</b>：逻辑主语发出动作用 doing，承受动作用 done。<br>③ <b>判断先后</b>：动作在谓语之后用 to do，在谓语之前用 having done。<br>演示：<b>__ from space, the earth looks like a blue ball.</b><br>① 逻辑主语 = the earth ② the earth 是「被看」→ 被动 ③ → <b>Seen</b> from space... 从太空看，地球像一个蓝色球体。<br>演示 2：<b>__ his homework, the boy went out to play.</b><br>① 逻辑主语 = the boy ② 主动完成作业 → doing 系 ③ 先完成才出去玩 → <b>Having finished</b>'],
  ['只接 doing 的动词（背清单）','enjoy / finish / mind / avoid / suggest / practise / keep / miss / imagine / consider<br>例：I enjoy <b>reading</b>. 我喜欢阅读。　He suggested <b>putting off</b> the meeting. 他建议推迟会议。<br>口诀：<b>建议避免享受完成</b>——suggest、avoid、enjoy、finish、mind、practise 全接 doing。<br><b>介词后面一律 doing</b>：be good at <b>swimming</b> 擅长游泳、be interested in <b>learning</b> 对学……感兴趣<br>最高频陷阱：<b>look forward to doing</b>（这里的 to 是介词，不是不定式标志）：I look forward to <b>hearing</b> from you. 期待你的回信。'],
  ['to do 与 doing 的三组高频辨析','stop <b>to do</b> 停下来去做（另一件事）vs stop <b>doing</b> 停止做（手头的事）：<br>He stopped <b>to smoke</b>. 他停下来去抽烟。　He stopped <b>smoking</b>. 他戒烟了。<br>remember / forget：<b>to do</b> 记得要做（还没做）vs <b>doing</b> 记得做过（已做）：<br>I remembered <b>to close</b> the door. 我记得要去关门（关了）。　I remember <b>closing</b> the door. 我记得关过门了。<br>used to：<b>be used to doing</b> 习惯于（to 是介词）vs <b>used to do</b> 过去常常（现在不了）：<br>I\'m used to <b>getting</b> up early. 我习惯早起了。　I used to <b>get</b> up late. 我以前常晚起。'],
  ['分词作定语：主动 doing / 被动 done','单个分词放名词前，短语放名词后：<br>the <b>rising</b> sun 正在升起的太阳（太阳「升起」主动）<br><b>fallen</b> leaves 落叶（已经落下）<br>the boy <b>standing there</b> 站在那里的男孩（男孩主动站）<br>the question <b>discussed</b> at the meeting 会上讨论的问题（问题「被讨论」被动）<br>the language <b>spoken in Brazil</b> 巴西说的语言（语言「被说」）<br>判断方法：名词能不能主动发出这个动作？能 → doing；不能（是被做的）→ done。'],
  ['分词作状语：逻辑主语必须等于主句主语','<b>Given more attention, the trees could have grown better.</b> 如果给予更多照料，这些树本可以长得更好。（树「被给予」→ Given）<br><b>Having finished the work, he left.</b> 做完工作后他离开了。<br>✗ 错例：__ by the bus, he was late.（填 Hurrying 不行——「赶公交」的是 he，he 与 hurry 主动 → Hurrying 才对；反过来 <b>Seen from the hill</b>, we... 里 see 的是 we 主动，应该用 Seeing）<br>这就是三步法第①步的意义：先锁定逻辑主语，再看主动被动。'],
  ['三个特殊句型（背下来）','<b>It\'s no use doing...</b> 做……没有用：It\'s no use <b>crying</b> over spilt milk. 覆水难收（哭没用）。<br><b>make 的被动还原 to</b>：主动 He made me <b>work</b>. → 被动 I was made <b>to work</b>. 我被迫工作。<br><b>keep / catch / find + 宾语 + doing</b>：She kept me <b>waiting</b> for an hour. 她让我等了一个小时。']],
 bank:[

  {s:'__ from space, the earth looks like a blue ball.',o:['Seen','Seeing','To see','See'],a:0,e:'the earth 与 see 是被动关系 → Seen（过去分词作状语）。'},
  {s:'I look forward to __ from you.',o:['hearing','hear','heard','be heard'],a:0,e:'look forward to 中的 to 是介词 → doing。最高频陷阱。'},
  {s:'He suggested __ the meeting.',o:['putting off','to put off','put off','to putting'],a:0,e:'suggest 只接动名词：suggest doing。'},
  {s:'The __ man was taken to hospital.',o:['injured','injuring','injure','injury'],a:0,e:'受伤的人：人与 injure 是被动 → 过去分词作定语。'},
  {s:'Do you mind __ the window?',o:['opening','to open','opened','to opening'],a:0,e:'mind 后接动名词。'},
  {s:'I remember __ the door, but it\'s open now.',o:['closing','to close','close','closed'],a:0,e:'remember doing 记得做过（已发生）；remember to do 记得要去做。'},
  {s:'__ his homework, the boy went out to play.',o:['Having finished','Have finished','Finished','To finish'],a:0,e:'先完成再出去：完成 + 主动 → having done。'},
  {s:'It\'s no use __ about it.',o:['crying','to cry','cried','cry'],a:0,e:'It\'s no use doing 固定句型：哭没有用。'},
  {s:'The question __ at the meeting is very important.',o:['discussed','discussing','which discussed','to discuss'],a:0,e:'问题被讨论 → 过去分词作后置定语 = which is discussed。'},
  {s:'He was made __ twelve hours a day.',o:['to work','work','working','worked'],a:0,e:'主动句 make sb do，被动句要还原 to：be made to do。'},
  {s:'I\'m used to __ up early now.',o:['getting','get','got','have got'],a:0,e:'be used to doing 习惯于；used to do 过去常常——高频辨析。'},

{id:'L8',wk:'高频补充 ①',t:'被动语态 + 虚拟语气',sub:'be done 各时态 · if 虚拟三类 · suggest + (should) do',
 teach:[
  ['被动语态：什么时候用','三种情况用被动：① 不知道谁干的 ② 没必要说谁干的 ③ 想强调「被作用的对象」。<br>主动：Workers build bridges. 工人建桥。→ 被动：Bridges <b>are built</b> by workers. 桥是（工人们）建的。<br>变换步骤：<b>宾语提前当主语 → 动词变 be + 过去分词 → 原主语放 by 后面（可省）</b>。'],
  ['一个公式走天下','<b>be + 过去分词</b>。时态变化全在 be 身上，分词永远不变：<br>一般现在 is <b>cleaned</b>：The room is cleaned every day. 房间每天打扫。<br>一般过去 was <b>cleaned</b>：It was cleaned yesterday. 昨天打扫了。<br>现在进行 is <b>being cleaned</b>：It is being cleaned now. 现在正在打扫。<br>现在完成 has <b>been cleaned</b>：It has already been cleaned. 已经打扫完了。<br>将来 will <b>be cleaned</b>：It will be cleaned tomorrow. 明天会打扫。<br>情态 can <b>be cleaned</b>：It can be cleaned easily. 它很容易清洗。<br>做题方法：先判断「被动」再判断「时态」，两个信号叠加出答案。'],
  ['没有被动的动词（高频陷阱）','不及物动词<b>永远没有被动</b>，因为没有承受者：<br>happen 发生 / take place 发生 / break out 爆发 / rise 上升 / belong to 属于<br>✗ The accident was taken place...　✓ The accident <b>took place</b> on a rainy night. 事故发生在一个雨夜。<br>✗ is belonged to　✓ The car <b>belongs to</b> him. 这辆车属于他。<br>另外：主动表被动的固定用法先不管（如 The book sells well 这本书好卖），考试以「被动用 be done」为主。'],
  ['虚拟语气是什么','<b>说的话与事实相反</b>，动词就要「后退一步」（往后推一个时态）来表示假想：<br>事实：I am not you. → 假想：If I <b>were</b> you... 如果我是你（其实不是）<br>if 虚拟三类对照：<br><b>与现在相反</b>：If 从句用过去式（be 一律 were），主句 would + 原形：<br>If I <b>were</b> you, I <b>would take</b> the job. 如果我是你，我就接受这份工作。<br><b>与过去相反</b>：If 从句用 had done，主句 would have done：<br>If he <b>had worked</b> harder, he <b>would have passed</b>. 如果他当时更努力，就通过了。（事实：没努力，没通过）<br><b>与将来相反</b>：If it <b>should rain</b> / <b>were to rain</b> tomorrow... 万一明天下雨……'],
  ['省略 if 的倒装（看到 had/were 开头别慌）','if 省略后，had / were / should 提到主语前：<br>If he had known... → <b>Had he known</b>..., ...<br>If I were you... → <b>Were I</b> you, ...<br>判断方法：句子以 Had / Were / Should 开头，多半是虚拟倒装，还原 if 再理解。'],
  ['wish 与 as if','wish 后面的内容「不是真的」，动词后退一步：<br><b>I wish I were a bird.</b> 真希望我是只鸟。（现在不可能 → 过去式 were）<br><b>I wish I had gone</b> to the party. 真希望当时去了聚会。（过去没去 → had done）<br><b>He talks as if he knew everything.</b> 他说话好像什么都知道。（其实不知道 → 过去式）'],
  ['(should) do 家族：每年必考的送分题','suggest / demand / insist（坚持要求）/ order / require / propose + that + 主语 + <b>(should) 动词原形</b>：<br>He suggested that the meeting <b>(should) be put</b> off. 他建议会议推迟。<br>It is important / necessary / strange / suggested that + 主语 + <b>(should) 动词原形</b>：<br>It is important that every student <b>(should) follow</b> the rules. 每个学生都遵守纪律很重要。<br>判断标志：看见上面这些「建议/要求/命令」类词或句型，从句动词直接用原形（should 可省）——不看主语单复数！<br>另一句型：<b>would rather + 动词原形</b>：I would rather <b>stay</b> at home. 我宁愿待在家里。']],

{id:'L9',wk:'高频补充 ②',t:'倒装与强调',sub:'否定词倒装 · Only 倒装 · so/neither · It is...that 强调',
 teach:[
  ['倒装是什么、为什么倒','正常语序：主语 + 助动词 + 动词（I <b>have</b> seen it）。<br><b>部分倒装</b> = 把助动词提到主语前面，形状像一般疑问句：<b>Have</b> I seen it? → 倒装句 Never <b>have I</b> seen it. 我从未见过它。<br>触发条件只有一个：<b>否定词 / Only / so/neither 放在句首</b>。倒装不改变意思，只是「强调」的信号。'],
  ['否定词开头必倒装（公式 + 例句）','公式：<b>否定词 + 助动词 + 主语 + 动词原形</b><br>· <b>Never have I seen</b> such a beautiful place. 我从未见过这么美的地方。<br>· <b>Not until midnight did he come</b> back. 直到半夜他才回来。<br>· <b>Not only had he read</b> the book, but he also remembered... 他不仅读过这本书，还记得内容。<br>· <b>Seldom does he</b> go out. 他很少出门。<br>操作方法：找到句中的助动词（have/do/can/had...），把它搬到主语前面，其余不动。没有助动词就请 do 来帮忙（did he come）。'],
  ['Hardly...when 与 No sooner...than','固定搭配，都表「一……就……」，且必须倒装：<br><b>Hardly had I got home when</b> it began to rain. 我刚到家天就开始下雨。<br><b>No sooner had I got home than</b> the phone rang. 我一到家电话就响了。<br>记忆：<b>Hardly 配 when，No sooner 配 than</b>——前者用 when、后者用 than，混了就错。'],
  ['Only 开头倒装（注意例外）','<b>Only + 状语</b>（介词短语 / 状语从句 / 副词）开头才倒装：<br><b>Only in this way can we make</b> progress. 只有这样我们才能进步。<br><b>Only then did I realize</b> my mistake. 直到那时我才意识到错误。<br>例外：<b>Only + 主语</b>开头不倒装：Only he <b>knows</b> the answer. 只有他知道答案。（he 是主语，语序正常）<br>判断方法：看 Only 后面第一个词——是名词/代词就不倒，是介词短语或 then 等副词才倒。'],
  ['so / neither 开头：两种回答必须分清','<b>So / Neither + 助动词 + 主语</b> = 「另一个人也一样」（倒装）：<br>— I have never been there. — <b>Neither have I.</b> 我也没去过。<br>— He works hard. — <b>So does she.</b> 她也努力。<br><b>So + 主语 + 助动词</b> = 「此人确实如此」（不倒装）：<br>— He works hard. — <b>So he does.</b> 他的确很努力。<br>判断方法：前后说的是<b>不同的人</b> → 倒装；<b>同一个人</b>的确认 → 不倒装。这个辨析年年考。'],
  ['强调句：It is/was...that/who','公式：<b>It is/was + 被强调部分 + that(/who) + 其余部分</b>。用来突出句子的某一部分：<br>正常：I met her in Beijing. 我在北京遇见了她。<br>强调地点：<b>It was in Beijing that</b> I met her. 我是在北京遇见她的。<br>强调人可以用 who：It was <b>he who</b> is wrong. 是他错了。<br><b>判断法（一步搞定）</b>：去掉 It is/was...that，剩下的词能还原成完整句子 → 强调句：<br>It was in Beijing that I met her. → I met her in Beijing ✓ 完整 → 是强调句<br>It was rainy that day. → 去掉后不成立 → 只是普通主系表，不是强调句。<br>细节：强调句动词跟被强调者一致（It is he who <b>is</b> wrong）；that 不能省、指物不能用 which。'],
  ['as 让步倒装（写作加分）','把名词/形容词/副词提到 as 前面表「虽然」：<br><b>Child as he is</b>, he knows a lot. 虽然他还是个孩子，懂得却很多。<br>规则：提前的名词<b>不加冠词</b>（不说 A child as he is）；<br><b>Hard as he tried</b>, he failed. 尽管很努力，他还是失败了。<br>认识即可，写作文用一次很加分。']],

 ]},
{id:'L10',wk:'高频补充 ③',t:'比较结构 + 主谓一致',sub:'as...as / 倍数 / that 替代 · 就前就近 · the number of',
 teach:[
  ['原级比较 as...as','<b>as + 原级 + as</b>：He is <b>as tall as</b> his brother. 他和他哥哥一样高。<br>否定：<b>not as/so + 原级 + as</b>：It is not <b>so cold as</b> yesterday. 没有昨天冷。<br>注意两个 as 都不能省，中间放形容词/副词<b>原级</b>（不加 er / most）。'],
  ['倍数比较：两个固定公式','公式一：<b>倍数 + as...as</b>：This room is <b>three times as large as</b> that one. 这个房间是那个的三倍大。<br>公式二：<b>倍数 + the + 名词 + of</b>：This room is <b>three times the size of</b> that one.<br>两个公式等价，倍数永远放在最前面：<br>✗ as three times large as　✓ three times as large as'],
  ['比较级：修饰词与对象一致','规则一：修饰比较级用 <b>much / far / even / a little / still</b>，<b>不能用 very</b>（very 只修饰原级）：He is <b>much</b> taller than his brother. 他比他哥哥高得多。<br>规则二：比较对象必须是<b>同类事物</b>，不同类的用 that / those 代替：<br>The weather in Beijing is colder than <b>that</b> in Guangzhou. 北京的天气比广州的冷。（that = the weather；两地的天气不是一类东西，不能直接比）<br>The students in Class 1 are more than <b>those</b> in Class 2.（those = the students）<br>✗ The weather in Beijing is colder than Guangzhou.（拿「天气」跟「城市」比——错）'],
  ['the more...the more 句型','结构：<b>the + 比较级 + 主谓，the + 比较级 + 主谓</b>，表「越……越……」：<br><b>The harder</b> you work, <b>the better</b> result you will get. 你越努力，成绩就越好。<br><b>The more</b> you read, <b>the more</b> you know. 读得越多，知道得越多。<br>两个 the 都不能少，比较级后不用加 than。'],
  ['两者与三者的区别','两者比较用<b>比较级</b>：He is the <b>taller</b> of the two. 他是两人中较高的那个。（要加 the）<br>三者以上用<b>最高级 + the</b>：Tom is <b>the strongest</b> of the three boys. Tom 是三个男孩中最壮的。<br>older vs elder：older 通用（可接 than）；elder 只作定语指家人，<b>不接 than</b>：my elder brother 我哥哥。年龄差用「数字 + older」：She is three years <b>older</b> than I. 她比我大三岁。'],
  ['不接 than 的比较词（高频陷阱）','superior（优于）/ inferior（劣于）/ senior（年长于）/ junior（年幼于）+ <b>to</b>，<b>没有 than</b>：<br>This car is superior <b>to</b> that one. 这辆车比那辆好。<br>✗ superior than。这四个词来自拉丁比较级，自带 to。'],
  ['主谓一致：就前与就近','<b>就前原则</b>：主语后面跟着 as well as / together with / along with / but / except 时，动词跟<b>前面的主语</b>一致：<br>The teacher, <b>as well as</b> the students, <b>is</b> going to attend. 老师和学生们都要参加。（跟 the teacher 一致 → is）<br><b>就近原则</b>：either...or / neither...nor / not only...but also 连接主语时，动词跟<b>最近的主语</b>一致：<br>Either you or he <b>is</b> to blame. 不是你就是他该受责备。（跟 he 一致 → is）<br>each / every / either / neither + 单数名词 → 单数动词：Each of them <b>has</b> a car.'],
  ['number 家族：一个字母之差（必考）','<b>The number of</b> + 复数名词 = 「……的数量」（中心词是 number）→ <b>单数动词</b>：<br>The number of students <b>is</b> increasing. 学生人数在增加。<br><b>A number of</b> + 复数名词 = 「许多……」（= many，中心词是 students）→ <b>复数动词</b>：<br>A number of students <b>are</b> present. 许多学生到场了。<br>同理：the percentage of + 单数动词；分数/百分数 + of + 名词时，动词跟 of 后面的名词一致：Two thirds of the water <b>is</b> polluted. 三分之二的水被污染了。']],

let ses={queue:[],idx:0,flip:false,stat:{know:0,fuzzy:0,no:0},active:false};

let LASTPLAN=null;
function freshPool(){
  const fr={R:[],A:[],B:[],C:[]};
  WORDS.forEach(w=>{
    const st=S.words[w[0]];
    if(!(st&&st.seen)) fr[w[3]||'C'].push(w);
  });
  return fr;
}
/* 新词配比：阅读核心词优先（直接决定能不能读懂文章），
   其次复用词（会拼会搭，换词汇题的分），主题词补充，连接词最少。
   某一层学完会自动顺延到下一层，不会卡住不动。 */
const MIXW={R:0.48,C:0.30,B:0.16,A:0.06};
function newMix(tgt){
  const fr=freshPool();
  const want={};
  let sum=0;
  ['R','C','B','A'].forEach(k=>{ want[k]=Math.round(tgt*MIXW[k]); sum+=want[k]; });
  want.R+=tgt-sum;
  const pick=[], plan={R:0,C:0,B:0,A:0};
  ['R','C','B','A'].forEach(k=>{
    const take=Math.min(Math.max(0,want[k]),fr[k].length);
    plan[k]=take;
    pick.push.apply(pick,fr[k].slice(0,take));
  });
  if(pick.length<tgt){
    const used=new Set(pick.map(w=>w[0]));
    const rest=fr.R.concat(fr.C,fr.B,fr.A).filter(w=>!used.has(w[0]));
    pick.push.apply(pick,rest.slice(0,tgt-pick.length));
  }
  shuffle(pick);
  return {pick:pick,plan:plan};
}
function buildQueue(){
  const t=todayISO();
  const due=[];
  WORDS.forEach(w=>{
    const st=S.words[w[0]];
    if(st&&st.seen&&st.due<=t) due.push(w);
  });
  due.sort((a,b)=>(S.words[a[0]].box||0)-(S.words[b[0]].box||0));
  const tgt=targetNew();
  const mix=newMix(tgt);
  LASTPLAN=mix.plan;
  return due.slice(0,40).concat(mix.pick);
}
function startSession(){
  const q=buildQueue();
  ses={queue:q,idx:0,flip:false,stat:{know:0,fuzzy:0,no:0},active:true,plan:LASTPLAN};
}
function grade(v){
  const w=ses.queue[ses.idx];
  if(!w) return;
  const st=wstate(w[0]);
  st.seen=(st.seen||0)+1;
  st.last=todayISO();
  if(v==='know'){
    st.box=Math.min((st.box||0)+1,6);
    st.due=addDays(todayISO(),INTERVAL[st.box]);
    ses.stat.know++;
  }else if(v==='fuzzy'){
    st.due=addDays(todayISO(),1);
    ses.stat.fuzzy++;
  }else{
    st.box=0; st.hard=(st.hard||0)+1; st.due=todayISO();
    ses.stat.no++;
    ses.queue.push(w);
  }
  if(v==='know'||v==='fuzzy'){
    const r=dayRec();
    r.wcount=(r.wcount||0)+1;
  }
  save();
  ses.idx++; ses.flip=false;
  render();
}
function gradeAgain(){
  ses.idx=0; ses.flip=false; ses.stat={know:0,fuzzy:0,no:0};
  render();
}

/* ---- 课堂：知识点学习 + 练习 + 间隔复习 ---- */
let LV=null;
function lstate(lid){
  const st=S.learn[lid]||(S.learn[lid]={learned:false,seen:[],right:0,wrong:0,last:null,stage:0,batches:0});
  st.seen=st.seen||[];
  return st;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function masteryOf(lid){
  const st=lstate(lid);
  const n=st.right+st.wrong;
  if(!n) return 0;
  return Math.round(st.right/n*100);
}
const REVIEW_STEPS=[1,3,7,14];
function dueLessons(){
  const today=todayISO();
  return LESSONS.filter(L=>{
    const st=S.learn[L.id];
    if(!st||!st.last||!st.learned) return false;
    const gap=diffDays(st.last,today);
    const need=st.stage<REVIEW_STEPS.length?REVIEW_STEPS[st.stage]:7;
    return gap>=need;
  }).map(L=>L.id);
}
function unlockedTier(lid){
  const st=lstate(lid), m=masteryOf(lid);
  if(st.batches>=4&&m>=60) return 3;
  if(st.batches>=2&&m>=50) return 2;
  return 1;
}
function tierName(d){return d>=3?'冲刺':(d===2?'进阶':'基础');}
function pickItems(lid,n){
  const L=LESSONS.find(x=>x.id===lid), st=lstate(lid);
  const tier=unlockedTier(lid);
  const within=x=>((x.b.d||1)<=tier);
  let pool=L.bank.map((b,i)=>({b,i})).filter(x=>!st.seen.includes(x.i)&&within(x));
  shuffle(pool);
  let sel=pool.slice(0,n).map(x=>({kind:'bank',lid:lid,i:x.i,s:x.b.s,o:x.b.o,a:x.b.a,e:x.b.e,d:x.b.d||1}));
  if(sel.length<n&&GENS[lid]){
    const gen=shuffle(GENS[lid]());
    sel=sel.concat(gen.slice(0,n-sel.length).map(g=>({kind:'gen',lid:lid,s:g.s,o:g.o,a:g.a,e:g.e,d:1})));
  }
  if(sel.length<n){
    const rest=L.bank.map((b,i)=>({b,i})).filter(x=>within(x)&&!sel.some(q=>q.kind==='bank'&&q.i===x.i));
    shuffle(rest);
    sel=sel.concat(rest.slice(0,n-sel.length).map(x=>({kind:'bank',lid:lid,i:x.i,s:x.b.s,o:x.b.o,a:x.b.a,e:x.b.e,d:x.b.d||1,reuse:true})));
  }
  if(sel.length<n){ /* 兜底：解锁层实在不够时才跨层重排 */
    const rest2=L.bank.map((b,i)=>({b,i})).filter(x=>!sel.some(q=>q.kind==='bank'&&q.i===x.i));
    shuffle(rest2);
    sel=sel.concat(rest2.slice(0,n-sel.length).map(x=>({kind:'bank',lid:lid,i:x.i,s:x.b.s,o:x.b.o,a:x.b.a,e:x.b.e,d:x.b.d||1,reuse:true})));
  }
  sel.forEach(q=>{
    const arr=q.o.map((t,k)=>({t:esc(t),ok:k===q.a}));
    shuffle(arr);
    q.opts=arr.map(x=>x.t); q.a2=arr.findIndex(x=>x.ok);
  });
  return sel;
}
function openLesson(lid){LV={mode:'lesson',lid:lid,part:'teach'}; save(); render(); window.scrollTo(0,0);}
function startQuiz(lid){
  lstate(lid).learned=true;

  const items=[];

    got.forEach(q=>{q.src=LESSONS.find(L=>L.id===lid).t; items.push(q);});

  if(LV.picked!==null) return;

function viewLearn(){
  if(!LV) return learnList();

function learnQuiz(){
  const drill=LV.mode==='drill';
  if(LV.qi>=LV.items.length){
    const total=LV.items.length, r=LV.right, pct=Math.round(r/total*100);
    const tierStat={};
    LV.items.forEach(q=>{
      const k=tierName(q.d||1);
      tierStat[k]=tierStat[k]||[0,0];
      tierStat[k][1]++;
      if(!LV.wrongs.includes(q)) tierStat[k][0]++;
    });
    const tierLine=Object.keys(tierStat).map(k=>k+' '+tierStat[k][0]+'/'+tierStat[k][1]).join('　·　');
    const wrongRows=LV.wrongs.map(q=>
      '<div class="witem"><div class="wq">'+esc(q.s.replace('__','<b>____</b>'))+'</div>'+
      '<div class="wa">正确：<b>'+q.opts[q.a2]+'</b></div><div class="we">'+esc(q.e)+'</div></div>').join('');
    const nextDrill=dueLessons().length?'<button class="btn pri" onclick="startReview()">混排复习旧知识点</button>':'';
    return '<div class="vhead"><h1>'+(drill?'混排复习完成':'本批练习完成')+'</h1></div>'+
      '<div class="card"><div class="empty" style="padding:30px 16px;">'+
      '<div style="font-size:34px;font-weight:700;color:'+(pct>=70?'var(--green,#2e7d43)':'var(--amber)')+';">'+r+' / '+total+'</div>'+
      '<div style="margin-top:6px;color:var(--ink-3);">'+(pct>=70?'过关':'还没过关，看错题讲解，再练一批')+'</div>'+
      '<div style="margin-top:10px;font-size:12px;color:var(--ink-3);">分层成绩：'+tierLine+'</div></div>'+
      (LV.wrongs.length?'<h3 style="margin:16px 0 6px;">错题讲解</h3>'+wrongRows:'')+
      '<div style="margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;">'+
      (drill?'<button class="btn" onclick="exitLesson()">返回课堂</button>'
        :'<button class="btn pri" onclick="startQuiz(\''+LV.lid+'\')">再来一批新题</button><button class="btn" onclick="exitLesson()">返回课堂</button>')+
      nextDrill+'</div></div>';
  }
  const q=LV.items[LV.qi];
  const prog=Math.round(LV.qi/LV.items.length*100);
  let opts=q.opts.map((t,k)=>{
    let cls='qopt';
    if(LV.picked!==null){
      if(k===q.a2) cls+=' ok';
      else if(k===LV.picked) cls+=' bad';
    }
    return '<button class="'+cls+'" onclick="quizPick('+k+')">'+String.fromCharCode(65+k)+'. '+t+'</button>';
  }).join('');
  let feedback='';
  if(LV.picked!==null){
    const ok=LV.picked===q.a2;
    feedback='<div class="exp '+(ok?'eok':'ebad')+'"><b>'+(ok?'✓ 答对了':'✗ 答错了，正确答案是 '+q.opts[q.a2])+'</b><br>'+esc(q.e)+'</div>'+
      '<button class="btn pri" style="width:100%;margin-top:10px;" onclick="quizNext()">'+(LV.qi+1>=LV.items.length?'看结果':'下一题')+'</button>';
  }
  return '<div class="vhead"><h1>'+(drill?'混排复习':'练习：'+esc(LESSONS.find(x=>x.id===LV.lid).t))+'</h1></div>'+
    '<div class="card"><div style="display:flex;justify-content:space-between;font-size:11.8px;color:var(--ink-4);margin-bottom:8px;">'+
    '<span>第 '+(LV.qi+1)+' / '+LV.items.length+' 题'+(drill&&q.src?'　来自 '+esc(q.src):'')+'　<b>［'+tierName(q.d)+'题］</b></span>'+
    '<span>本批对 '+LV.right+' 错 '+LV.wrongs.length+'</span></div>'+
    '<div class="bar" style="margin-bottom:16px;"><i style="width:'+prog+'%"></i></div>'+
    '<div class="qtext">'+q.s.replace('__','<span class="blank">____</span>')+'</div>'+
    '<div class="qopts">'+opts+'</div>'+feedback+'</div>';
}

/* 故事里出现的目标词加粗（含词形变化），让人一眼看到「就是它」 */
function hlStory(t, word){
  let out=esc(t);
  const k=esc(word).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ out=out.replace(new RegExp('\\b('+k+'\\w*)','gi'),'<b>$1</b>'); }catch(e){}
  return out;
}
function say(w){
  if(!w) return;
  try{
    if(!('speechSynthesis' in window)) { alert('这个浏览器不支持朗读，换 Edge 或 Chrome 试试'); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(w).replace(/[\/]/g,' '));
    u.lang='en-US'; u.rate=0.8;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function flip(){ses.flip=!ses.flip; render();}
function again(){ses.active=false; ses.queue=[]; startSession(); render();}
function curWord(){const w=ses.queue[ses.idx]; return w?w[0]:null;}
function addMemo(){
  const k=curWord(); if(!k) return;
  const v=prompt('给「'+k+'」编一个记忆钩子（谐音、联想、笑话都行）：', S.memo[k]||'');
  if(v===null) return;
  const t=v.trim();
  if(t){ S.memo[k]=t; } else { delete S.memo[k]; }
  save(); render();
}
function delMemo(){
  const k=curWord(); if(!k) return;
  if(confirm('删除你为「'+k+'」写的记忆？')){ delete S.memo[k]; save(); render(); }
}

function studyFam(){
  const w=ses.queue[ses.idx];
  const mp=w?MORPH[w[0]]:null;
  if(!mp||!mp.f) return;
  let n=0;
  mp.f.forEach(x=>{
    const t=WORDS.find(y=>y[0]===x[0]);
    if(!t) return;
    if(ses.queue.some(y=>y[0]===t[0])) return;
    ses.queue.push(t); n++;
  });
  if(n) alert('已把 '+n+' 个同族词加入本轮队列');
  else alert('同族词已在队列里或不在词库中');
  render();
}

function doImport(){
  const el=document.getElementById('imp');
  if(!el||!el.value.trim()){alert('先粘贴内容');return;}
  const lines=el.value.split('\n');
  let n=0;
  lines.forEach(l=>{
    const p=l.split('|').map(x=>x.trim());
    if(!p[0]) return;
    const exists=WORDS.some(w=>w[0]===p[0]);
    if(exists) return;
    const row=[p[0],p[1]||'',p[2]||'',(p[3]||'C').toUpperCase().slice(0,1)];
    WORDS.push(row);
    S.custom.push(row);
    n++;
  });
  ses.active=false;
  save();
  alert('已导入 '+n+' 条');
  render();
}

    items+='<div class="card" style="margin-top:10px;padding:14px 16px;">'+
      '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-4);margin-bottom:6px;">'+
        '<span>'+esc(s.date)+'</span><span>'+((s.errs||[]).join(' · ')||'未归类')+'</span></div>'+
      '<div style="font-family:Georgia,serif;font-size:14.6px;line-height:1.9;color:var(--ink);margin-bottom:8px;">'+esc(s.en)+'</div>'+
      (s.cut?'<div style="font-size:12.9px;color:var(--ink-3);line-height:1.8;">切分：'+esc(s.cut)+'</div>':'')+
      (s.trunk?'<div style="font-size:12.9px;color:var(--ink-3);line-height:1.8;">主干：'+esc(s.trunk)+'</div>':'')+
      '<div style="font-size:12.9px;color:var(--ink-3);line-height:1.8;">译文：'+esc(s.zh)+'</div>'+
      (s.ref?'<div style="font-size:12.9px;color:var(--teal);line-height:1.8;margin-top:3px;">参考：'+esc(s.ref.zh)+'</div>':'')+
    '</div>';
  });
  if(!shown.length) items='<div class="card"><div class="empty">还没有记录。上面粘一句真题里的话，拆一遍就存进来了。</div></div>';

  return head+enter+stat+adv+filt+items;
}
function setFilter(f){bookFilter=f; render();}

/* ---- 进度 ---- */
function viewProg(){
  const d=dayNum();
  let cells='';
  for(let i=1;i<=70;i++){
    const dt=addDays(S.start,i-1);
    const n=dayDone(dt);
    let cls='';
    if(n>=5) cls='d4'; else if(n>=3) cls='d3'; else if(n>=1) cls='d2';
    if(n===0&&S.days[dt]&&S.days[dt].sent) cls='d1';
    cells+='<div class="'+cls+(i===Math.min(d,70)?' now':'')+'" title="'+dt+' · 完成 '+n+'/5">'+i+'</div>';
  }
  const ws=wordStats();
  let streak=0;
  for(let i=Math.min(d,70);i>=1;i--){
    const dt=addDays(S.start,i-1);
    if(dayDone(dt)>0) streak++; else break;
  }
  const totalDone=Object.keys(S.days).filter(k=>dayDone(k)>0).length;

  let exams='';
  S.exams.forEach((e,i)=>{
    exams+='<tr><td>'+esc(e.date)+'</td><td class="c">'+e.score+'</td><td class="c">'+
      (e.score>=60?'<span class="pill ok">过线</span>':'<span class="pill warn">未过</span>')+'</td>'+
      '<td class="c"><span style="color:#a8324a;cursor:pointer;font-size:12px;" onclick="delExam('+i+')">删除</span></td></tr>';
  });

  let miles='';
  WEEKS.forEach(w=>{
    if(w.w!==2&&w.w!==4&&w.w!==6&&w.w!==8&&w.w!==9&&w.w!==10) return;
    const on=!!S.mile[w.w];
    miles+='<div class="task '+(on?'done':'')+'" onclick="toggleMile('+w.w+')">'+
      '<div class="box">'+(on?'✓':'')+'</div>'+
      '<div class="tx">第 '+w.w+' 周末：'+esc(w.check)+'</div></div>';
  });

  return '<div class="vhead"><h1>进度</h1></div>'+
    '<div class="row3" style="margin-bottom:14px;">'+
      '<div class="stat"><div class="k">连续打卡</div><div class="v">'+streak+'<em>天</em></div></div>'+
      '<div class="stat"><div class="k">累计学习</div><div class="v">'+totalDone+'<em>天</em></div></div>'+
      '<div class="stat"><div class="k">已练句子</div><div class="v">'+S.sentences.length+'<em>句</em></div></div>'+
    '</div>'+
    '<div class="card"><h3>70 天打卡 <span class="sub">颜色越深＝当天完成度越高，橙框是今天</span></h3><div class="cal">'+cells+'</div></div>'+
    '<div class="card"><h3>词库掌握情况</h3>'+
      '<div class="row3">'+
      '<div class="stat" style="border:0;padding:0;"><div class="k">未学</div><div class="v" style="font-size:17px;">'+ws.fresh+'</div></div>'+
      '<div class="stat" style="border:0;padding:0;"><div class="k">学习中</div><div class="v" style="font-size:17px;">'+ws.learning+'</div></div>'+
      '<div class="stat" style="border:0;padding:0;"><div class="k">已掌握</div><div class="v" style="font-size:17px;">'+ws.mastered+'</div></div>'+
      '</div>'+
      '<div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);">'+
      '<div style="font-size:12px;color:var(--ink-3);margin-bottom:8px;"><b>词库维护</b></div>'+
      importBox()+'</div></div>'+
    '<div class="card"><h3>里程碑自检</h3>'+miles+'</div>'+
    '<div class="card"><h3>模考记录</h3>'+
      '<div style="display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">'+
        '<input type="text" id="exdate" placeholder="日期，如 2027-03-01" style="width:170px;">'+
        '<input type="text" id="exscore" placeholder="分数" style="width:90px;">'+
        '<button class="btn sm pri" onclick="addExam()">记一笔</button></div>'+
      (S.exams.length?'<table><thead><tr><th>日期</th><th class="c">分数</th><th class="c">结果</th><th class="c"></th></tr></thead><tbody>'+exams+'</tbody></table>'
        :'<div style="font-size:12.8px;color:var(--ink-4);">还没有模考记录</div>')+
    '</div>'+
    '<div class="card"><h3>计划起始日</h3>'+
      '<div style="display:flex;gap:9px;align-items:center;">'+
      '<input type="text" id="startd" value="'+esc(S.start)+'" style="width:150px;">'+
      '<button class="btn sm" onclick="setStart()">更新</button>'+
      '<span style="font-size:12px;color:var(--ink-4);">格式 2026-11-13。改它会重算天数，打卡记录保留。</span></div></div>';
}
function toggleMile(w){S.mile[w]=S.mile[w]?0:1; save(); render();}
function addExam(){
  const d=document.getElementById('exdate').value.trim()||todayISO();
  const s=parseFloat(document.getElementById('exscore').value);
  if(isNaN(s)){alert('填个分数');return;}
  S.exams.push({date:d,score:s}); save(); render();
}
function delExam(i){S.exams.splice(i,1); save(); render();}
function setStart(){
  const v=document.getElementById('startd').value.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){alert('格式要像 2026-11-13');return;}
  S.start=v; save(); render();
}

/* ---- 计划 ---- */
function viewPlan(){
  let rows='';
  WEEKS.forEach(w=>{
    const on=w.w===weekNum();
    rows+='<tr'+(on?' style="background:#eaf1fa;"':'')+'>'+
      '<td class="c nw">第 '+w.w+' 周'+(on?' <span class="pill">当前</span>':'')+'</td>'+
      '<td>'+esc(w.theme)+'</td>'+
      '<td class="c">'+w.words+'</td>'+
      '<td>'+esc(w.check)+'</td></tr>';
  });
  const flow=TASKS.map(t=>'<tr><td class="nw">'+t.m+' 分钟</td><td>'+(t.k==='t2'?'新词 '+targetNew()+' 个（按词块记）':esc(t.n))+'</td></tr>').join('');

  return '<div class="vhead"><h1>计划</h1></div>'+
    '<div class="card"><h3>10 周作战地图</h3>'+
      '<table><thead><tr><th class="c">周次</th><th>这一周只攻一个主题</th><th class="c">累计目标</th><th>周末验收</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '</div>'+
    '<div class="card"><h3>每天的 100 分钟</h3>'+
      '<table><thead><tr><th class="nw">时间块</th><th>做什么</th></tr></thead><tbody>'+flow+'</tbody></table>'+
    '</div>';
}

/* ---- 速查 ---- */
function viewRef(){
  return '<div class="vhead"><h1>速查</h1></div>'+

  '<div class="card"><h3>阅读四题型：动作与限时</h3>'+
    '<table><thead><tr><th>题型</th><th class="c">占比</th><th>动作</th><th class="c">限时</th></tr></thead><tbody>'+
    '<tr><td>细节题</td><td class="c">60%</td><td>圈题干里的大写词、数字、人名，回原文定位，答案通常是同义替换</td><td class="c">40 秒</td></tr>'+
    '<tr><td>词义句意题</td><td class="c">10%</td><td>只看该词前后一句，找并列(and/or)、转折(but)、解释(that is)</td><td class="c">30 秒</td></tr>'+
    '<tr><td>推理题</td><td class="c">20%</td><td>定位到段落，只做一步推理；要想两步的选项基本是错的</td><td class="c">60 秒</td></tr>'+
    '<tr><td>主旨题</td><td class="c">10%</td><td>只读首段末句 + 各段首句，看重复出现的词</td><td class="c">40 秒</td></tr>'+
    '</tbody></table></div>'+

  '<div class="card"><h3>干扰项四特征</h3><ul class="tight">'+
    '<li><b>偷换概念</b>：原文说 students，选项说 teachers</li>'+
    '<li><b>以偏概全</b>：原文说 some，选项说 all</li>'+
    '<li><b>过度推断</b>：选项比原文多走了一步</li>'+
    '<li><b>正反混淆</b>：把 support 说成 oppose</li>'+
    '<li>选项里出现 <span style="font-family:Georgia,serif;">always / never / all / only / must</span>，九成是错的</li>'+
  '</ul></div>'+

  '<div class="card"><h3>中英差异四条</h3><ul class="tight">'+
    '<li><b>修饰语位置相反</b>：the man who lives next door → 住在隔壁的那个人</li>'+
    '<li><b>英语必须有主语</b>：中文无主句要补 we / people，或改被动</li>'+
    '<li><b>英语靠从句，中文靠短句</b>：一个长句拆成 2–3 个中文短句</li>'+
    '<li><b>英语多名词，中文多动词</b>：the improvement of → 改善</li>'+
  '</ul></div>'+

  '<div class="card"><h3>汉译英保命六句</h3><ul class="tight" style="font-family:Georgia,serif;">'+
    '<li>With the development of…</li>'+
    '<li>It is said / reported that…</li>'+
    '<li>Only in this way can we…</li>'+
    '<li>We should take effective measures to…</li>'+
    '<li>play an important role in…</li>'+
    '<li>be beneficial to / be harmful to…</li>'+
  '</ul></div>'+

  '<div class="card"><h3>语法最高频三块</h3><ul class="tight">'+
    '<li><b>非谓语</b>：to do 表目的；介词后必用 doing；doing 表主动进行、done 表被动完成</li>'+
    '<li><b>从句</b>：that 不作成分无词义、what 作成分；定语从句看先行词，状语从句看逻辑</li>'+
    '<li><b>虚拟</b>：if + had done, would have done；suggest / demand / insist + (should) do</li>'+
  '</ul></div>'+

  '<div class="note warn"><b>60 分拆解：</b>阅读 12–14 · 语法 9–11 · 完形 11–12 · 写作 9–10 · 翻译 7–8 · 词汇 6–7。客观题 70 分是基本盘，主观题 30 分是保险。</div>';
}

/* =========================================================
   路由与启动
   ========================================================= */
function go(v){view=v; if(v==='vocab'&&!ses.active) startSession(); if(v==='learn') LV=null; render(); window.scrollTo(0,0);}
function go_(v){go(v);}
window.say=say; window.go=go; window.flip=flip; window.grade=grade; window.again=again; window.addMemo=addMemo; window.delMemo=delMemo;
window.openLesson=openLesson; window.startQuiz=startQuiz; window.startReview=startReview; window.quizPick=quizPick; window.quizNext=quizNext; window.exitLesson=exitLesson;
window.studyFam=studyFam;
window.toggleTask=toggleTask; window.toggleErr=toggleErr;
window.beginOwn=beginOwn; window.submitOwn=submitOwn; window.saveOwn=saveOwn; window.cancelOwn=cancelOwn;
window.setFilter=setFilter; window.toggleMile=toggleMile; window.addExam=addExam; window.delExam=delExam;
window.setStart=setStart; window.doImport=doImport; window.clearAll=clearAll;

document.getElementById('nav').addEventListener('click',function(e){
  const b=e.target.closest('button');
  if(!b) return;
  go(b.getAttribute('data-v'));
});

initState();
render();
</script>
