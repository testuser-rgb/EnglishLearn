{d:11,k:'d11-1',t:"After the Storm",zh:"一场暴雨让污染成了全国议题，科学家评估损失、设计方案；有人反对、有人造假，但数据说服了大多数人。",w:["with regard to","climate","obvious","severe","lead to","pollution","assess","devise","prior to","demonstrate","waste","specific","classify","confirm","efficient","attribute","contribute to","live up to","object to","deceive","convince","dedicate","positive","adapt to","derive","constitute","environment","typical","energy"],
 p:`With regard to climate change, the evidence is now obvious. A severe storm last summer led to floods in three towns, and the pollution of the river became a national issue. Scientists were asked to assess the damage and to devise a plan.
Prior to the report, few people could demonstrate how much waste a single factory produced. The team spent two years collecting data and used a specific method to classify it. They confirmed that the old plants were less efficient than new ones, and they attributed most of the smoke to coal. One conclusion was hard for the local government to accept: the plan would not live up to its promise unless every family took part.
Some shop owners object to the new rules, and a few tried to deceive the inspectors. But most people were convinced by the figures. Students were encouraged to dedicate one hour a week to cleaning the river bank, and their positive attitude contributed to a real change. A typical day in the city now looks different: the environment is cleaner, and energy from coal is falling. To adapt to the new situation, the city has begun to derive more of its power from the sun. What we do now constitutes the future we get.`,
 q:[
  {s:"What were the scientists asked to do?",o:["Close the factories","Assess the damage and devise a plan","Punish the shop owners","Move the three towns"],a:1,e:"assess the damage and to devise a plan，两个动作并列。devise＝设计、想出。"},
  {s:"According to the report, what would the plan need in order to live up to its promise?",o:["Every family to take part","More money from the government","A second report","A new team of scientists"],a:0,e:"原文 the plan would not live up to its promise unless every family took part，unless＝除非。注意这是对结果的条件判断，不是已经发生的事。"},
  {s:"Which statement is true about the shop owners?",o:["They paid for the report on the river water","Some objected and a few tried to deceive the inspectors","They cleaned the river themselves over one weekend","All of them supported the rules from the first day"],a:1,e:"Some … object to the new rules, and a few tried to deceive the inspectors。but 之后的 most people were convinced 才是主流。"}
 ,{s:"What is the passage mainly about?",o:["How evidence persuaded most people after a storm", "Why storms happen more often in summer", "How to deceive the inspectors", "Why shop owners object to new rules"],a:0,e:"全文线索：暴雨成灾→科学家评估→有人反对造假→But most people were convinced by the figures。A 概括主线；B、C、D 都是细节。"}]},
{d:12,k:'d12-1',t:"Can a Machine Teach?",zh:"教学软件能看懂你的错、给出评估，但它替代不了努力、判断和独立思维；屏幕不能挤掉读书的习惯。",w:["software","theory","make sense of","make a difference","grasp","application","make out","network","make full use of","assessment","make up for","reasonable","criteria","intelligence","minor","independent","robot","dominate","embrace","suitable","disturb","screen","donate","engage","deserve","estimate","unique","negative"],
 p:`Can a machine teach? That is the question behind every new piece of educational software. The theory is simple: if a program can make sense of your mistakes, it can make a difference to your progress.
Some systems are impressive. A student who cannot grasp a rule can watch a short video, and the application will make out which step he missed. The network behind it makes full use of thousands of answers, and the assessment is often more detailed than a teacher's note. But no program can make up for a lack of effort. Nor can it judge whether an answer is reasonable, because the criteria of a good essay are not numbers.
Critics say that intelligence of this kind is a minor skill; what matters is the ability to think independently. A robot may dominate a game of chess, yet it cannot grasp why a poem moves us. Still, the technology is here, and to embrace it seems suitable.
The estimate is that half of the students engage with the software for less than ten minutes a day. They deserve better, and a unique solution is still missing. The negative effect is not the machine itself but our habit. What we must not do is let the screen disturb the hours we donate to reading.`,
 q:[
  {s:"What can the application do according to Paragraph 2?",o:["Judge whether an essay is good","Make out which step the student missed","Replace the teacher completely","Write the student's homework"],a:1,e:"the application will make out which step he missed；同段后半句 Nor can it judge whether an answer is reasonable 说明 A 做不到。"},
  {s:"\"No program can make up for a lack of effort\" means ______.",o:["Effort is not important","A program cannot replace effort","Programs are too expensive","Students should not use programs"],a:1,e:"make up for＝弥补。整句意思是没有程序能弥补不努力，即努力无法被替代。"},
  {s:"What is the writer's main worry?",o:["Robots will beat humans at chess","The screen will take time away from reading","Software is too expensive","Teachers will lose their jobs"],a:1,e:"末句 let the screen disturb the hours we donate to reading 才是作者真正的担心；chess 只是举例。"}
 ,{s:"What is the writer's attitude toward educational software?",o:["Cautious: useful but not a replacement for effort", "Enthusiastic: it will soon replace teachers", "Negative: it should be banned completely", "Indifferent: it makes no difference"],a:0,e:"全文先肯定软件能看懂错误、给出评估，但强调它替代不了努力、判断和独立思维——谨慎态度。B、C 走极端。"}]},
{d:13,k:'d13-1',t:"How a Thesis Is Built",zh:"论文从假设开始：方法、框架、定义缺一不可；教授强调别推得比数据多，研究是慢功夫。",w:["put forward","hypothesis","conclusion","put off","method","framework","formulate","definition","put emphasis on","infer","imply","purpose","fascinate","generate","put aside","carbon","emission","natural","ecosystem","damage","industrious","guarantee","cultivate","put out","fulfill","sustainable","put up with","concept","mainly"],
 p:`Every thesis begins with a question. A student must put forward a hypothesis, test it, and draw a conclusion, and none of these steps can be put off until the last week.
The method matters as much as the idea. A clear framework helps you formulate the question; a strict definition keeps you from guessing. In our lab the professor puts emphasis on evidence. Do not infer more than the data can support, she says. What your results imply is usually less than what you hope.
The purpose of the work is not to fascinate readers but to generate knowledge that lasts. One student studies how to put aside old habits. Another looks at carbon emission and the natural ecosystem, and asks whether the damage can be repaired. Such work is not easy: you must be industrious, you must put up with many failed trials, and nobody can guarantee a result.
Yet the habit is worth cultivating. When you put out a report that is honest about its limits, you fulfill the first duty of a researcher. The concept of enough data is mainly a matter of judgment, and that judgment grows slowly. Sustainable research, like a forest, cannot be rushed.`,
 q:[
  {s:"What does the professor put emphasis on?",o:["A beautiful title","Evidence","A long report","A famous professor"],a:1,e:"puts emphasis on evidence；put emphasis on＝强调。后面 Do not infer more than the data can support 是同一意思的展开。"},
  {s:"\"Do not infer more than the data can support\" means a researcher should ______.",o:["Collect no data","Not go beyond what the data show","Use only old data","Avoid drawing any conclusion"],a:1,e:"infer＝推断。整句要求结论不能超出数据支持的范围，不是不要结论（「不做任何结论」属于过度推断）。"},
  {s:"Why does the writer compare research to a forest?",o:["Both are green after the spring rain","Both grow slowly and cannot be rushed","Both need water and good soil","Both are easy to destroy by carelessness"],a:1,e:"Sustainable research, like a forest, cannot be rushed；上句 grows slowly 已经点明。比喻题要找本体和喻体的共同点。"}
 ,{s:"What is the passage mainly about?",o:["Doing research slowly and honestly from a hypothesis", "Writing a thesis fast before the deadline", "Why professors dislike long theses", "How to find enough data quickly"],a:0,e:"全文讲假设→方法→框架，落点是不推得比数据多、研究是慢功夫。B 与 none of these steps can be put off until the last week 相反。"}]},
{d:14,k:'d14-1',t:"Four Hours a Week in Front of a Screen",zh:"在线学习好用，但设备只是工具：专注力比访问权更重要，一天留一小时不看屏幕。",w:["on the whole","on average","install","enroll","data","on the basis of","digest","imagination","distinguish","on the contrary","on purpose","investigate","on behalf of","device","awareness","require","acquire","devote","diversity","divorce","aware","online","digital","logic","choice","aspect","inspire","integrate","inherit"],
 p:`On the whole, learning online has been good for us, but not for the reasons the advertisements give. On average, a student in our program spends four hours a week in front of a screen.
The technology itself is simple. You install an application, enroll with your student number, and the data begins to collect. On the basis of that data, the platform can show which part you have not digested. It cannot, however, give you imagination, and it cannot distinguish effort from luck.
On the contrary, some students lose the ability to concentrate. They open an app on purpose and then forget why. To investigate this, our teacher asked us to keep a diary, and her conclusion, presented on behalf of the whole class, was that a device is only a tool: awareness matters more than access.
We still require face-to-face contact. We need to acquire the habit of reading a whole chapter, and to devote time to a single idea. Online courses have one obvious aspect: they fit a busy life, and a good digital text can inspire as much as paper. But logic can be taught by a machine while the choice of books cannot. The diversity of ways to learn is a strength; the divorce of study from life is not. Aware of this, many of us now set aside one hour a day without any device at all, and we try to integrate what we inherit from books with what we find online.`,
 q:[
  {s:"What can the platform do with the data?",o:["Give students imagination","Show which part they have not digested","Choose books for them","Replace the teacher"],a:1,e:"the platform can show which part you have not digested；紧接着 后面 It cannot … give you imagination 说明「给想象力」做不到。"},
  {s:"What did the teacher's diary study conclude?",o:["Devices should be banned","Awareness matters more than access","Students study better at night","Online courses are useless"],a:1,e:"a device is only a tool: awareness matters more than access。冒号后的部分就是结论。"},
  {s:"What does the writer suggest at the end?",o:["Giving up online courses","Combining books and online learning","Reading only paper books","Studying without any teacher"],a:1,e:"integrate what we inherit from books with what we find online＝把书上学到的和网上找到的结合起来。"}
 ,{s:"What does the writer think about online learning?",o:["It is a useful tool but not a full replacement for reading habits", "It is worse than paper courses in every way", "It removes the need for face-to-face contact", "It should take more of a student's time"],a:0,e:"文章先肯定在线课程 fit a busy life，再用 But 转向专注力、整章阅读和面对面接触。B 的 every way 绝对化；C 与 We still require face-to-face contact 相反。"}]},
{d:15,k:'d15-1',t:"Thirty Minutes Before the Shift",zh:"医院调查发现员工普遍缺运动、睡不好，于是用\"上班前运动半小时\"替代开药，缺席率下降。",w:["regardless of","survey","staff","fall short of","for the sake of","workforce","by means of","exercise","prescribe","medicine","patient","reward","punishment","disease","treatment","presentation","contrast","labor","health","meet the needs of","raise awareness of","prestige","qualification","fail","adept","adapt","adopt","colleague","vacancy","prejudice"],
 p:`Regardless of age, most workers say they are tired. A survey of two thousand staff in one hospital found that half of them fall short of the exercise they need, and that one in three has trouble sleeping.
The hospital decided to act for the sake of its workforce. By means of a simple program, it now offers thirty minutes of exercise before every shift. Doctors prescribe walking rather than medicine for mild cases, and patients are encouraged to join. Attendance is a kind of reward; there is no punishment for those who cannot come.
The results are easy to see. The number of people absent because of disease has fallen, and the treatment of stress has improved. A presentation by the head of staff compared the figures with last year: by contrast, the old system produced more labor and less health.
None of this meets the needs of every worker, and the program is far from perfect. A colleague points out that there is still a vacancy in the night team, and old prejudice against mental illness remains. But the program raises awareness of a simple truth: prestige and qualification mean little if the body fails. Those who are adept at their jobs are usually those who adapt, and the hospitals that adopt this approach are the ones that keep their people.`,

  {s:"What did the survey find?",o:["Most staff wanted higher pay","Half of the staff did not get enough exercise","One in three had left the hospital","Most patients were unhappy"],a:1,e:"half of them fall short of the exercise they need；fall short of＝达不到。"},
  {s:"What does the hospital give instead of medicine for mild cases?",o:["A warning","Walking","Extra money","A longer holiday"],a:1,e:"Doctors prescribe walking rather than medicine for mild cases，rather than＝而不是。"},
  {s:"What is the writer's attitude toward the program?",o:["Completely negative","Positive but aware of its limits","Completely supportive","Not interested"],a:1,e:"None of this meets the needs of every worker, and the program is far from perfect 是让步；但 raises awareness of a simple truth 是肯定。两个合起来才是态度。"}
 ,{s:"What is the writer's attitude toward the hospital program?",o:["Positive but honest about its limits", "Sure that it solves every problem", "Sure that it has no value", "Worried mainly about its cost"],a:0,e:"末段 None of this meets the needs of every worker... But the program raises awareness of a simple truth——肯定但坦承不完美。"}]},
{d:16,k:'d16-1',t:"What Sleep Buys",zh:"睡眠影响免疫、体重和情绪；公司给弹性早晨和健身补贴，比警告更能激励人。",w:["play a role in","apart from","so far","diet","sleep","immune","considerable","obesity","depression","mental","stress","for instance","rather than","by contrast","considerate","handle","bonus","allowance","motivate","candidate","succeed","applicant","cheat","plagiarize","descendant","decay","virus","processor","wage","pension"],
 p:`Sleep plays a role in almost everything we do. Apart from its effect on memory, it protects the immune system. So far, most studies suggest that a regular diet and enough sleep matter more than any single medicine.
The evidence is considerable. A survey of five thousand office workers found that those who sleep less than six hours are more likely to suffer from obesity and depression. Mental stress, for instance, is often a result of poor sleep rather than a cause of it. By contrast, people who exercise daily report fewer symptoms and a better mood.
What can an employer do? A considerate company can handle the problem by offering a flexible morning. A small bonus for healthy habits, or an allowance for a gym, may motivate more than a warning. A candidate who sleeps well is likely to succeed in an interview; an applicant who is always tired will not.
We should not cheat ourselves with coffee. Nor should we plagiarize the habits of others, because the body of your descendant may be different from yours. A higher wage cannot pay for lost sleep, and no pension can buy back a healthy year. The decay of health is slow, the virus is not the only enemy, and the processor in your laptop can rest while you cannot.`,

  {s:"Which of the following may motivate employees more?",o:["A warning letter","A bonus for healthy habits","A longer meeting","A higher pension"],a:1,e:"A small bonus for healthy habits … may motivate more than a warning，比较结构指向 bonus。"},

 ,{s:"What is the passage mainly about?",o:["Why sleep matters more than people think", "How to drink coffee safely at work", "Why wages should be raised", "How to copy the habits of others"],a:0,e:"全文讲睡眠对免疫、体重、情绪的作用，以及公司用弹性早晨激励员工。C 只是末段一个说法，D 与 Nor should we plagiarize the habits of others 相反。"}]},
{d:17,k:'d17-1',t:"The Launch That Failed",zh:"新产品上线当天服务器崩了，公司让员工加班却不沟通，朋友丢了工作、换了小公司，学到\"别瞒坏消息\"。",w:["to sum up","what is more","depend on","under no circumstances","account for","keep in mind","communicate","mislead","crash","launch","search","insurance","overtime","workload","efficiency","productivity","cooperation","job","career","employee","employer","company","industry","business","define","decision","detail","economical","economic"],
 p:`A friend of mine lost her job last spring. The company had launched a new product, the server crashed on the first day, and the loss was hard to account for. To cut costs the employer asked every employee to work overtime, and the workload doubled.
What is more, nobody communicated. A misleading email told the staff that their jobs were safe, and a search for the truth found nothing. To sum up, the business had made a decision without looking at the details.
Her career changed after that. She moved to a smaller firm in the same industry, where the rules are simple, and where efficiency is defined by output rather than by hours. Productivity depends on cooperation, and cooperation depends on trust. Keep in mind that a cheap plan is not always an economical one; the economic cost of a bad launch can be higher than any saving.
There is no insurance for a bad decision, and no harvest without patience. Under no circumstances should a company hide bad news from its people. That is the lesson she took away, and it is worth more than her old salary.`,
 q:[
  {s:"Why was the loss hard to account for?",o:["The product was never sold","The server crashed on the first day","The staff refused to work","The company had no money"],a:1,e:"the server crashed on the first day, and the loss was hard to account for；account for＝解释、说明。"},
  {s:"What did the misleading email do?",o:["It told the staff their jobs were safe","It explained the crash","It offered overtime pay","It asked for new ideas"],a:0,e:"A misleading email told the staff that their jobs were safe，与事实相反，所以是 misleading。"},
  {s:"What does the writer mean by \"a cheap plan is not always an economical one\"?",o:["Cheap things are always bad","A low cost today may bring a higher cost later","Economy is not important","Plans should be expensive"],a:1,e:"紧接的 the economic cost of a bad launch can be higher than any saving 就是解释：省下的钱可能抵不过后来的损失。"}
 ,{s:"What lesson did the writer's friend learn?",o:["A company should not hide bad news from its people", "Overtime always brings success", "Small companies are always better", "Salary matters more than any lesson"],a:0,e:"末句 Under no circumstances should a company hide bad news from its people. That is the lesson she took away 直接点明。"}]},
{d:18,k:'d18-1',t:"The Village and the Forest",zh:"禁伐令保护老树，但靠林子吃饭的家庭怎么办？政策要给出替代生计，社会得按自己的速度改变。",w:["look forward to","generation","look up to","look after","balance","government","look into","deforestation","monitor","detect","basis","ban","intention","deprive","essence","perspective","sensible","culture","structure","background","sensitive","tolerate","society","migrate","purify","principal","principle","community","population"],
 p:`Every generation looks forward to a better life, and most of us look up to those who look after the land. But the balance between growth and nature is hard to keep. The population of the town has doubled in ten years, and the forest has paid for it.
Last year the government promised to look into the problem of deforestation. A team was sent to monitor the river and to detect any change in the water. On the basis of their report, the province decided to ban the cutting of old trees. The intention was clear, though the policy was not easy to carry out: many families depend on the forest, and a ban can deprive them of work.
The essence of the problem is not the trees but the people. From the perspective of a farmer, a sensible plan must offer another way to earn a living. The local culture, the structure of the village, and the background of each family all matter. A sensitive leader will tolerate slow progress, because a society changes at its own speed.
Some birds migrate, and some fish need clean water to survive. It is our duty to purify what we have polluted. The principal principle is simple: we do not own the community, we only look after it for a while.`,
 q:[
  {s:"Why was the ban hard to carry out?",o:["Nobody agreed with it","Many families depend on the forest","The report was lost","The river was too long"],a:1,e:"a ban can deprive them of work，前句 many families depend on the forest 是原因。deprive sb of sth＝剥夺某人某物。"},
  {s:"What is the essence of the problem according to the writer?",o:["The trees","The people","The report","The government"],a:1,e:"The essence of the problem is not the trees but the people，not … but … 结构，重点在后半句。"},
  {s:"What does the last sentence suggest?",o:["We should leave the village","We are only temporary keepers of the land","The forest belongs to the government","Nobody cares about the community"],a:1,e:"we do not own the community, we only look after it for a while＝我们并不拥有它，只是照看一阵子。"}
 ,{s:"What is the passage mainly about?",o:["Balancing growth and nature takes time and alternatives", "Cutting trees should be banned forever", "Cities should grow as fast as possible", "Birds and fish matter little to a town"],a:0,e:"禁伐令之后的关键是替代生计、社会按自己的速度改变——平衡主题。B 的 forever 绝对化；C 与文意相反；D 与 It is our duty to purify what we have polluted 相反。"}]},
{d:19,k:'d19-1',t:"A Market Becomes a Park",zh:"城市想把老市场改成公园，会上没人来、方案被否；一桩食品安全案把它变成公共讨论，最后靠设计和公平规则才成。",w:["turn out","policy","turn into","public","turn up","turn down","legislate","deliver","respectable","supervise","authority","client","evidence","tendency","urban","rural","poverty","arrest","punish","sue","turn to","duty","equality","agreement","factor","imaginative","phenomenon","forgive","vote","citizen"],
 p:`The new policy did not turn out as planned. The city wanted to turn the old market into a public park, but few citizens turned up at the meeting, and the plan was turned down by the council.
It is easy to legislate and hard to deliver. A respectable officer was sent to supervise the work, and a local authority was asked to look at the evidence. The tendency was clear: in urban areas the problem is noise, and in rural areas it is poverty. Neither can be solved by a single rule.
When a client of the market was arrested for selling unsafe food, the story turned into a public debate. Should the city punish him, or sue the company that supplied the goods? Many people turned to the mayor for an answer. His duty, he said, was to protect equality before the law, and an agreement was reached after three meetings.
Two factors made the difference: an imaginative design and a fair rule. Citizens will vote on the final design next spring. The phenomenon of empty parks is common, but it is not a law of nature. If we forgive small mistakes and supervise the big ones, we may yet turn a market into a place people use.`,

{d:20,k:'d20-1',t:"Two Million Records",zh:"黑客用一个弱密码打开数据库，两百万条记录外泄；公司没放弃，重建系统，也终于公开解释。",w:["recent","major","corporation","sector","give away","hacker","password","database","firm","give up","system","algorithm","give off","essential","server","give rise to","belong","enterprise","locate","remain","complex","appear","give in","venture","potential","significant","rapid","contain"],
 p:`A recent case shows how fragile a company can be. A major corporation in the tech sector gave away more than it knew: a hacker found a weak password, opened the database, and copied the records of two million users.
The firm did not give up. Its engineers rebuilt the system, and the new algorithm gives off far less heat, which is essential in a large server room. But the incident gave rise to a serious question: who does the data belong to? The enterprise is located in a city where the rules remain unclear, and the situation is more complex than it appears.
Some managers wanted to give in and pay quietly. Others refused. A joint venture partner insisted that the potential loss was significant, and that rapid growth had hidden the problem for years. In the end the corporation published a full report, which did not contain a single word of apology but did list every step it would take.
The lesson is simple: a factory can replace a machine, but trust is harder to rebuild. What we should never give up is the duty to explain a failure in plain words. That, more than any product, keeps a business alive.`,

{d:21,k:'d21-1',t:"Sensors in the Dust",zh:"公司在小城开分公司，第一年线被风刮断、信号又弱，靠一款耐热耐尘的芯片活下来；最后立了条规矩：自己不用的传感器不卖。",w:["branch","office","strategy","sensor","commercial","negotiate","meeting","agenda","cable","satellite","signal","suffer","refuse","develop","chip","invention","survive","implement","ensure","compare","explain","decrease","lay","lie","refer","prefer","different","create","consider","pursue"],
 p:`Three years ago the company opened a branch office in a small city. The strategy was simple: build cheap sensors, sell them to farms, and let the data speak.
The first year was hard. The commercial team had to negotiate with local shops, and the meeting agenda was often rewritten at the last minute. A cable was cut by a storm, the satellite signal was weak, and the office began to suffer. But the engineers refused to give up. They developed a new chip, a small invention that could survive both heat and dust, and they implemented it in every device. To ensure the quality, each unit is compared with a standard model before it leaves the factory.
The results are easy to explain. Sales did not decrease; they grew. Costs are far below the first plan, and the problem now lies in training, not in hardware. If you refer to the report, you will see why we prefer this way: it is different from the old one, and it creates jobs.
We must consider one more thing. A company that pursues profit alone will not survive a second storm. What we should lay down first is a rule: never sell a sensor we would not use ourselves.`,

{d:22,k:'d22-1',t:"One Element at a Time",zh:"化学课不从元素表开始，而是一个元素一个元素地问\"它能做什么\"；同样的思路用于保护濒危物种。",w:["insist","semester","propose","focus","element","curriculum","relate","atomic","hydrogen","oxygen","chemical","substance","common","impress","difficult","endure","discipline","foster","tuition","diploma","reserve","expand","extend","important","preserve","endangered","enforce","possible","similar","rely"],
 p:`Professor Wang insists that chemistry should be taught from the first semester. Her proposal is simple: instead of memorizing the periodic table, students should focus on one element at a time and ask what it does.
The curriculum is built on this idea. In the first week, students relate the atomic structure of hydrogen to the water they drink; in the second, they study oxygen and the chemical reactions that keep a city alive. A common mistake is to think that a substance is either safe or dangerous. It is more impressive to see that the same element can heal and harm.
The course is difficult, but students endure it because the discipline it fosters is useful everywhere. Tuition is high and a diploma is not cheap, but the reserve of skills they gain will expand their choices and extend their careers.
The same logic applies to nature. It is important to preserve what is endangered, and necessary to enforce the rules that protect it. Is it possible to do this without hurting farmers? A similar question was asked about the river. If we rely on evidence rather than fear, the answer is usually yes.`,

{d:23,k:'d23-1',t:"Before the Blank Page",zh:"写论文别先有观点再找证据；会读的人对作者有同情、但不放弃判断；真正限制你的是想说得太多。",w:["seminar","essay","thesis","assignment","explore","examine","identify","ignore","curious","sympathy","abandon","attitude","serious","likely","effective","supply","available","certain","demand","certificate","obtain","various","limit","appetite","assign","anxiety","affection","literacy","offer"],
 p:`Every student in the seminar must write an essay before the end of term, and a thesis is only the longer version of the same task. The assignment looks simple: explore one question, examine the evidence, and identify what is still unknown.
Most students ignore the first step. They start with an opinion and then look for facts. A curious reader does the opposite. He reads with sympathy for the writer, but he does not abandon his own judgment. The attitude makes a serious difference: an essay written this way is more likely to be effective.
The library can supply what you need, though not everything is available. Certain journals demand a fee, and a certificate of enrollment is required to obtain them. Various databases offer a free copy, and the library offers training every Friday. A seminar is the best place to ask which one to use.
What limits most writers is not knowledge but appetite: they want to say everything. My advice is to assign yourself one idea per paragraph. Anxiety before a blank page is normal, and affection for your own sentences is dangerous. Cut them, and the paper will breathe. Academic literacy is not a gift; it is a habit.`,

{d:24,k:'d24-1',t:"A Study of Loneliness",zh:"一项研究发现大一孤独感与是否独居无关，而与参与活动的多少有关；作者说大学要能同时评估实验室和感受。",w:["faculty","announce","tutor","observe","occur","participate","measure","permit","persuade","discuss","bachelor","alumni","scholar","argue","species","conservation","value","mention","valuable","proud","ashamed","evaluate","eager","anxious","loneliness","reluctant","intellectual"],
 p:`Last term the faculty announced a study on loneliness among students. The tutor who led it asked two hundred freshmen to measure how often they felt alone, and to observe their own mood for a month.
The results were surprising. Loneliness does occur more often in the first year, but it is not limited to those who live alone. Students who participate in few activities report the same feeling as those who live far from home. Many were reluctant to join at first, and nobody wanted to admit it in public.
We must not permit silence to become a habit, the tutor said. She persuaded the dean to open a weekly meeting where students can discuss what troubles them. Bachelor students, master students and alumni all attend; a scholar from another university comes once a month to argue with them.
The study also looked at nature. A scholar who studies endangered species argues that conservation is not only about animals, but about the value we place on quiet places. Few students mentioned this, yet it is a valuable point. An intellectual habit begins with honesty. We are proud of our laboratories, and sometimes ashamed of our feelings. A university that can evaluate both is a better one. Those who are eager to learn are usually those who are not afraid to say they are anxious.`,

{d:25,k:'d25-1',t:"Compulsory Attendance",zh:"第一周必须到校：到场的人更可能坚持；研究生课的任务模糊、失败正常，而职场只看结果和协作。",w:["attendance","compulsory","requirement","tend","accomplish","postgraduate","task","failure","solve","attempt","fire","feedback","intensive","extensive","employ","workplace","cooperate","assemble","connect","leadership","establish","historic","historical","qualify","teamwork","creativity","undergraduate","threaten","expect","consist","comprise"],
 p:`At this university, attendance at the first week is compulsory. The requirement is not popular, and low attendance can threaten a course, but the teachers expect the rule to stay. Students who come tend to stay, and those who stay tend to accomplish more.
A postgraduate program is a good test of this. A good program consists of small tasks, and a final report may comprise three parts. The task you are given is vague, the deadline is short, and failure is normal. You must learn to solve a problem that nobody has solved before, or at least to attempt it honestly. The staff will not fire you for a wrong answer; they will ask what you learned from it. Feedback comes in writing, and an intensive course may require an extensive report.
What employers expect is different. In the workplace, results are what count. A team must cooperate, and a project team is usually assembled from people with different skills. The best ones are not always the most creative; they are the ones who can connect one idea to another and who have the leadership to keep a group together.
The university was established in 1902, and its historic buildings remind us of a historical truth: no single ability is enough. A degree qualifies you for a job, but only teamwork and creativity keep it. An undergraduate who learns this early will suffer less later.`,

{d:26,k:'d26-1',t:"Eight Hundred Questionnaires",zh:"问卷能测出人说了什么，测不出人做了什么；六成学生考前有压力，三分之一学期中生病。",w:["describe","maintain","questionnaire","finding","admit","deny","statistics","figure","pressure","illness","sickness","ailment","wound","suggest","program","apply","encourage","operate","confidential","confident","continual","continuous","hardware","outline","react","express","allow","score","memorize"],
 p:`The team wanted to describe how students maintain their health. They wrote a questionnaire, and the findings were clear: most students admit that they sleep badly, and few deny it.
The statistics are easy to figure out. Of the eight hundred students, sixty percent report pressure before an exam, and a third describe an illness during the term. They express the same worry in different words: some say sickness, some say ailment, and a few mention a wound from sport. All of them say the same thing about the health center — it is too far.
We suggest a simple program. It should allow students to apply for a later start, encourage them to operate the gym in turn, and offer a confidential line for those who feel confident enough to speak. Continual small changes are better than one continuous effort. The hardware is already there, and the outline of a plan exists.
What the survey cannot show is the reason. A questionnaire measures what people say, not what they do. Nobody is allowed to memorize the answers, and a high score does not prove good health. To see the truth, you must react to what you observe, not to what you are told.`,

{d:27,k:'d27-1',t:"The First Chapter",zh:"写文章先想作者的处境；第三章之前别下判断，读者要宽容也要有标准；问题不是\"完美吗\"而是\"清楚吗\"。",w:["analyze","imagine","judge","justify","prove","chapter","deadline","schedule","vocabulary","grammar","guilty","generous","selfish","motive","comprehensive","familiar","impose","otherwise","moreover","import","immigrant","appropriate","whereas","while","however","therefore","grade","tired","character"],
 p:`Before you analyze a text, imagine the writer's situation. A judge does the same: he must justify his decision, and he must prove that the evidence is enough.
The first chapter of any essay is the hardest. You have a deadline, a schedule, and a vocabulary that is still small. Grammar mistakes are common, and many students feel guilty about them. However, a generous reader will forgive a wrong tense; a selfish one will not. Motive matters as much as accuracy: why did the writer choose this example?
A comprehensive plan is familiar to most teachers: read, outline, write, revise. Do not impose your own view too early. Otherwise the essay will be a list of opinions rather than an argument. Moreover, do not import ideas you cannot explain, and do not judge an immigrant's English by the standard of a native speaker.
Therefore, the appropriate question is not whether it is perfect, but whether it is clear. Whereas a perfect sentence may say nothing, a simple one can carry a whole argument. Your grade depends less on talent than on habit. A tired writer makes the same mistake twice, and character shows in the third draft. While we wait for the perfect writer, we can become a clearer one.`,

{d:28,k:'d28-1',t:"Cure When Possible",zh:"诊所的目标不是开药而是看对病；剂量错比病更伤，隐私和自由要尊重，小步改进胜过一次大改。",w:["goal","cure","heal","objective","prescription","diagnosis","dose","rarely","hardly","scarcely","predict","prepare","privacy","freedom","present","tradition","behavior","meanwhile","transmit","transport","thus","instead","diagnose","effort"],
 p:`The goal of the clinic is simple: cure when possible, heal always. Its objective is not to sell a prescription but to reach a diagnosis that is right.
A dose of the wrong medicine can do more harm than the illness. Doctors therefore rarely prescribe without a test, and a good nurse hardly ever guesses. Scarcely a week passes without a case that could have been prevented. We can predict some of them, and we prepare for the rest.
The clinic also tries to respect privacy and freedom. A patient may refuse a treatment; the staff will present the facts and let him choose. Tradition is strong here, and behavior changes slowly. Meanwhile, a new system transmits the results to the city hospital, and a small van transports samples every morning. Thus a diagnosis that once took a week now takes a day.
These changes are not a cure for everything. But they show what effort can do. Instead of waiting for a perfect plan, the clinic chose one small step at a time. Those steps, added together, are the reason a patient can now be diagnosed before the disease is serious.`,

{d:29,k:'d29-1',t:"Two Seconds",zh:"一款语法检查工具的核心不是聪明而是快：两秒内给答案。团队差点散伙，最后靠\"有耐心\"重做。",w:["version","feature","accurate","aim","chance","come across","come up with","basic","diligent","come down to","break down","break in","break out","break up","ingredient","intelligent","come true","competition","income","comfort","comment","fluent","function","cope","status","infect"],
 p:`The new version of the app has one feature the team is proud of: it can tell you whether your sentence is accurate. The aim was not to replace a teacher but to give a student a chance to check his own work.
The story behind it is simple. One engineer came across an old report on how children learn grammar. She came up with a basic rule: a learner needs an answer within two seconds. The team was diligent, and in the end it all came down to speed.
Their first design broke down under pressure. When the number of users rose, the system broke in and the screen froze. A small argument broke out in the meeting, and for a week the group almost broke up. But they found the weak ingredient: the program was intelligent but not patient. They rebuilt it, and the old dream came true.
Competition in this market is strong, and income is not yet enough to comfort the team. Users in every status of life need to cope with new words, and a bad habit can infect a whole class. One user wrote a comment that they keep on the wall: I am not fluent, but I am no longer afraid. That, they say, is the real function of the product.`,

{d:30,k:'d30-1',t:"The Pill Is Not the Answer",zh:"一位外科护士写道：药能治感染、疫苗能预防，但抗生素治不好坏习惯；医生的角色不是消除所有疼痛。",w:["headline","pill","author","article","surgery","drug","vaccine","antibiotic","take for granted","run into","trouble","run out of","quality","operation","service","rule","source","sample","personnel","get along with","get over","take after","take off","role","get rid of","identity","get used to","issue","headquarters","headache"],
 p:`A headline in a medical magazine caught my eye last week: The pill is not the answer. The author of the article is a nurse who has worked in surgery for twenty years.
Her point is simple. A drug can end an infection, and a vaccine can prevent one, but an antibiotic cannot cure a bad habit. Patients who take their health for granted often run into trouble later. They run out of patience with a long treatment and stop halfway. The quality of a hospital, she writes, is not only in its operation rooms.
The service at her clinic has one rule: the doctor explains the source of the pain before writing anything. A small sample of blood is enough to show whether the trouble is serious. The personnel are trained to get along with anxious families, and they never say that ageing is something to get over.
I must add a comment of my own. We cannot get rid of every headache, and the headquarters of the hospital has issued a new guide on this issue. A young doctor sometimes takes after his teacher in style but not in patience. After the plane took off, I read the last line twice: our role is not to remove every pain, but to help a person get used to a new identity. That sentence stayed with me longer than any prescription.`,

{d:31,k:'d31-1',t:"One Portable Monitor",zh:"外科医生在缺床的情况下推动每个病房配一台便携监护仪；改变没牺牲安全，\"带走责任、留下功劳\"。",w:["surgeon","clinic","bring about","in light of","ward","portable","carry out","at present","sufficient","physician","bring up","bring forward","in accordance with","nurse","carry on","slight","mild","at the expense of","wireless","security","artificial","as a result of","ambulance","quantity","scarcity","as well as","carry away","bankrupt","flexible","abundant"],
 p:`A surgeon at the city clinic has brought about a quiet change. In light of a shortage of beds, she proposed that every ward should have one portable monitor, and the plan was carried out in three months.
At present the hospital has sufficient space but not enough nurses. The physician in charge brought the problem up at a meeting and brought the plan forward by a year. In accordance with the new rule, a nurse can now carry on a check without waking the patient. A slight change in a mild case can prevent a serious one.
The change was not made at the expense of safety. Every device is wireless and tested for security, and the artificial light in the corridor is softer at night. As a result of the new system, the ambulance team can send a patient's data before the car arrives. The quantity of paper used has fallen, and the scarcity of old machines is no longer a problem, because they have been replaced. A flexible plan saved the hospital from going bankrupt, and the supply of clean water is abundant.
The surgeon herself is careful about credit. She brings her students up to speak first, and she carries the blame away with her when something fails. As well as being a good doctor, she is a good teacher.`,

{d:32,k:'d32-1',t:"Before the First Case",zh:"传染病不是现代病：古城的公共浴场就是卫生防线；防它靠日常习惯和提前建好的系统，不靠警报。",w:["epidemic","modern","ancient","hygiene","germ","pandemic","result from","result in","bacteria","infection","along with","keep pace with","set up","routine","set aside","gradual","frequent","fade","catch up with","set off"],
 p:`An epidemic is not a modern problem. Ancient cities were built with public baths for a reason: hygiene was a matter of life and death. A germ does not need a crowd; it needs a habit.
A pandemic is different only in scale. It results from a virus that travels faster than our rules, and it can result in millions of lost workdays. Bacteria and infection spread along with people. To keep pace with them, a city must set up a system before the first case appears, not after.
The routine is less exciting than the emergency. Wash your hands, open the window, and set aside ten minutes a day for exercise. A gradual change in the habit of a family is worth more than a frequent warning. Old rules fade slowly, and the new ones take time to catch up with daily life.
When the alarm was set off in March, the hospital was ready. It had been set up for a different disease, but the plan worked. What we learned is simple: preparation is not a cost; it is the cheapest medicine we have.`,

{d:33,k:'d33-1',t:"Two Weeks at Home",zh:"疫情来了先隔离：过敏像感冒、慢性咳嗽未必是病毒，别太早下结论；法规要稳、要能长期执行。",w:["outbreak","quarantine","instruction","fever","cough","allergy","chronic","draw a conclusion","subjective","reliable","vaccination","behave","regulation","stable","toxic","disposal","harmful","patent","storage","eventually","collaborate","sustainability","retirement","reason","attain","authentic","conclude","property","regulate","expression"],
 p:`When an outbreak began in the northern province, the first rule was quarantine. The instruction was simple: stay home for two weeks, and report any fever or cough.
Not every case was easy to read. An allergy can look like a cold, and a chronic cough may have nothing to do with the virus. A doctor must not draw a conclusion too early, and a subjective feeling is not evidence. The reliable sign was a test, and the vaccination rate told us how the city would behave in the next month.
The regulation that followed was strict but stable. Factories that produce toxic waste had to follow a new rule on disposal, and a chemical that is harmful to water could no longer be stored near a river. A patent for a new storage method was registered by a small team, and they eventually began to collaborate with a university. From these figures we can conclude that the rule worked, though no single property was protected for free.
Sustainability is not only an environmental question. A worker in retirement still needs a reason to get up, and a society that ignores this cannot attain a healthy balance. To regulate a market is harder than to close it, and freedom of expression is part of the balance. An authentic plan, in short, is one that a community can keep without being told.`,

{d:34,k:'d34-1',t:"A Small Accident",zh:"楼梯上摔了一下：脚踝肿、背钝痛、有淤青但没出血，医生说热敷休息一周；躺在床上看街区变化，才明白速度不等于进步。",w:["pain","ache","swell","accident","bruise","bleed","sore","heat","neighborhood","stream","convert","solar","operational","foundation","dioxide","spread","tropical","polar","global","fertile","equal","organic","custom","responsibility","welfare","dream","convey","cease","reaction","speed"],
 p:`Last month I had a small accident on the stairs. My ankle began to swell, and there was a dull ache in my back that would not go away. I found a bruise but saw no cut, and nothing bled. The doctor said the pain was not serious, but the muscle was sore. "Heat helps," she said. "Take it easy for a week."

I stayed at home, and the neighborhood kept moving outside my window. A stream that once carried waste had been converted into a small park. The solar panels on the school roof were now operational, paid for by a foundation whose aim was to reduce carbon dioxide. People said the air felt cooler there.

Lying still, I began to see that the change was not only local. A tropical storm can spread in days; the polar ice is a global problem, not a distant one. Fertile land is not equal to endless land, and organic farming cannot feed a city alone. But a custom can change: if every family takes responsibility for its own waste, the welfare of the whole street improves. Speed is not the same as progress. A dream of clean air, conveyed in a child's drawing on the wall, is worth more than a report. The noise did not cease at night, but the reaction of the residents slowly changed.`,

{d:35,k:'d35-1',t:"The Clinic on the Corner",zh:"大医院没时间管的病人都在街角诊所：糖尿病、癌症、无家可归的老人；合并带来的钱和人不算成功，有人回来说声\"你好\"才算。",w:["scar","disability","diabetes","acute","liver","cancer","lung","majority","elderly","homeless","minority","average","exactly","guess","tiny","massive","solution","merger","manufacture","link","worldwide","offline","exciting","preparation","whatever","feeling","alone","overweight","lonely","success"],
 p:`The clinic on the corner treats the patients that a big hospital has no time for. Some have a scar from an old operation; some live with a disability. A man in his sixties has diabetes and an acute pain in his liver; a woman of forty has cancer of the lung and no family nearby.
The majority of them are elderly, and a large minority are homeless. The average age is sixty-eight. Exactly how many they see in a year is hard to guess, but the number is not tiny: a massive effort is needed just to keep the door open.
The solution was a merger. A local firm that manufactures medical beds linked with a charity, and the link brought both money and volunteers. Worldwide, the same model is used offline as well: a printed list on the wall, a phone number, a person who listens.
What makes the work exciting is not success but preparation. Whatever the illness, the feeling of being alone is often worse than the disease. A patient who is overweight and lonely may need a walk more than a pill. We cannot cure everyone, but we can make sure nobody is left alone with a plain question and no answer. Success, in her view, is a patient who comes back to say hello.`,

{d:36,k:'d36-1',t:"The Body Is a City",zh:"身体像城市：肾净水、肌肉运货、骨头撑墙；城市留下的也是记忆——传统歌曲、文化习惯、法律就是它的骨头；最后写到病房里护士的真诚。",w:["kidney","muscle","bone","blood","cell","narrow","infrastructure","dangerous","organ","construction","region","memory","traditional","cultural","legal","formal","expertise","practical","law","personal","grateful","loyal","faithful","sincere","crowded","pronunciation"],
 p:`A doctor once told me that the body is a city. The kidney cleans the water, the muscle moves the goods, the bone holds the walls, the blood carries the messages, and every cell has a job.

The comparison is not exact, but it is useful. A city with narrow roads and old infrastructure is dangerous in an emergency. The same is true of a body: a small blockage can stop an organ, and the construction of a new line in our region began only after an accident nobody expected.

What a city keeps is also what a body keeps: memory. A traditional song, a cultural habit, a legal rule — these are the bones of a society. A formal education gives you expertise; a practical one gives you judgment. The law is not a wall but a frame, and a personal habit is stronger than a public warning.

I am grateful to the nurses who were loyal to their work and faithful to their patients. Their sincerity was quiet. A crowded ward is a hard place to be kind in, yet they were. The pronunciation of a word may be wrong, but the meaning of a gesture is never mistaken.`,

{d:37,k:'d37-1',t:"The Body Is Not a Machine",zh:"外国研究发现临街噪音与心脏病相关，且影响是长期的；健康不只是多运动，还要家里住得舒服。",w:["tissue","nerve","breathe","digestion","metabolism","nowadays","national","foreign","noisy","temporary","permanent","usual","certainly","comfortable","local","private","occasional","instant","somewhere","famous","order","infectious","everywhere","everyday","anyway","fit","bright","spend","terrible","native"],
 p:`The body is not a machine, though we often treat it like one. Tissue and nerve work together, and every breath feeds a process that we never notice. Digestion and metabolism depend on what we eat and when we sleep.
Nowadays, health is a national topic. A foreign study found that people who live in a noisy street have a higher risk of heart disease than those who live in a quiet one. The noise was terrible, and a native speaker of the city's old dialect told me it was once quiet. The difference is not temporary; it can be permanent. The usual advice — exercise more, sit less — is certainly right, but it is not enough. A person must also feel comfortable at home.
In our city, the local government has opened a few private clinics that stay open at night. The service is not free, but a worker with an occasional headache can walk in and get an instant answer. Somewhere in the suburbs, a famous doctor runs a small class for young parents. Her order is simple: sleep first, food second.
An infectious disease can spread everywhere in a week, and an everyday habit can stop it. Anyway, the point is not to be fit for a race but to be bright enough to notice when something is wrong. A healthy person spends less on medicine than a sick one, and that, in the end, is the best private investment.`,

{d:38,k:'d38-1',t:"A Ritual, Not a Holiday",zh:"节日不只是放假：祭祖的仪式把一家绑在一起，遗产是每年重复的习惯；护鸟、护湿地缺的是钱；手机成瘾同理，靠仪式不靠法律。",w:["ceremony","ritual","ancestor","heritage","media","broadcast","publish","journal","ecology","migration","conserve","main","financial","battery","pollute","illegal","environmental","prevention","human","addict","fatigue","mood","extra","medical","harm","download","upload","nervous","festival","pollutant"],
 p:`A festival is not only a holiday. In my grandparents' town, the ceremony begins before sunrise: the family stands together, and a ritual of thanks is offered to the ancestors. Heritage, people say, is not a museum object; it is a habit repeated every year.

The media has begun to notice. A local journal published a report, and a radio station broadcast it to the whole province. The subject was ecology: the migration of birds along the coast, and what it costs to conserve the wetland where they stop.

The main problem is financial. Solar power needs a battery that costs more than a family can pay; a factory that pollutes the river may be illegal, yet it still employs half the town. Environmental prevention is cheaper than repair, but nobody wants to pay for it first. The same rule holds for a human being: the phone is an addict's tool, and extra hours of screen time bring fatigue, a low mood and medical harm. We download an app, upload a photo, and feel nervous when the battery is low.

The cure is not a law but a ritual: put the phone in another room and let the evening be quiet. Pollutant by pollutant, habit by habit, that is how a town changes.`,

{d:39,k:'d39-1',t:"A Week of Weather and a Second Question",zh:"飓风、干旱、地震、洪水一周内扎堆，报道只热七天；编辑只问一句\"证据呢\"——温室效应不是信念而是测量；能问第二个问题的记者更值钱。",w:["hurricane","drought","earthquake","flood","coverage","journalist","rare","strange","unusual","opposite","normal","reporter","editor","audience","resident","position","belief","greenhouse","warming","moral","facility","suburb","downtown","passage","race","gender","faith","ethnic","capable","viewer"],
 p:`In one week last summer, the country had a hurricane in the south, a drought in the north, an earthquake in the west, and a flood in the east. The coverage was heavy for seven days; then it stopped. Such a week is rare and looks strange, but the opposite of unusual is not always normal.

A journalist sent the story to her editor, who asked one question: on what evidence? The audience had seen the pictures, and the residents had given their position. But a belief is not a measurement. The greenhouse effect is not a belief; it is a measurement, and warming is what the numbers show.

The moral is not about one storm. A new facility in a suburb and a closed school downtown tell the same story: some places are protected and some are not. The passage of a law can change a race or a gender rule on paper; it cannot change faith, or the way one ethnic group is described. A reporter who is capable of asking a second question is worth more than one who is certain of the first. The viewer at home deserves that second question too.`,
 q:[
  {s:"What did the editor want to know?",o:["Who wrote the story","On what evidence the claim was based","How long the story was","Who paid for it"],a:1,e:"第二段 her editor, who asked one question: on what evidence？说明编辑只认证据，不接受\"反常\"这个结论。"},
  {s:"How does the writer describe the greenhouse effect?",o:["A belief","A moral question","A measurement","A political idea"],a:2,e:"The greenhouse effect is not a belief; it is a measurement。分号后面才是作者给它的定性。"},
  {s:"What kind of reporter is worth more, according to the passage?",o:["One who is certain of the first answer","One who asks a second question","One who writes fast","One who has a large audience"],a:1,e:"末句 A reporter who is capable of asking a second question is worth more than one who is certain of the first。记者要问第二遍：证据呢？"}
 ,{s:"What kind of reporter does the writer value?",o:["One who asks for evidence and keeps asking questions", "One who covers big news for seven days", "One who believes the greenhouse effect", "One who writes about strange weeks"],a:0,e:"编辑只问 on what evidence，末段说能问第二个问题的记者更值钱。B 与 coverage was heavy for seven days; then it stopped（暗含批评）相反；C 与 not a belief but a measurement 相反。"}]},
{d:40,k:'d40-1',t:"A Joke at Dinner",zh:"晚餐上一句关于口音的玩笑，说的人无意、听的人受伤；刻板印象形式温和、效果粗暴；新闻也一样：对事实严格、对人温和。",w:["etiquette","rude","offend","unable","stereotype","gentle","privilege","justice","willing","able","desert","disaster","soil","habitat","wildlife","budget","catastrophe","trade","cost","loss","economy","viral","celebrity","reputation","channel","subscriber","finance","strict","ethic","fame"],
 p:`A joke at dinner can cost more than a dinner. Last month a guest told a joke about the way a colleague spoke English. The words were rude, and they did offend the man's wife, who was unable to laugh. Nobody said anything. Good etiquette would have been to change the subject; instead, the table went quiet.

A joke like that rests on a stereotype. It is gentle in form and violent in effect, because it tells a group that their place is fixed. Justice begins with small privileges refused: the privilege of laughing at someone who is not in the room. A person who is willing and able to say "not funny" does more for the table than one who laughs.

We use the same carelessness when we talk about the natural world. A desert is not a disaster; it is an ecosystem with its own soil, habitat and wildlife. A budget that treats a catastrophe as a cost, and a trade that treats a loss as economy, will fail in the end.

The media lives inside the same budget. A clip goes viral because it is funny, a celebrity adds fame to it, and a reputation is damaged before the channel checks. Subscribers and finance decide what is published; a strict ethic of facts would decide otherwise. Be strict with facts and gentle with people: that is the only rule that survives both.`,
 q:[
  {s:"Why was the joke at dinner a problem?",o:["It was too long and nobody followed it","It was rude and offended the man's wife","It was about the food on the table","Nobody laughed except the man himself"],a:1,e:"the words were rude, and they did offend the man's wife。"},
  {s:"What does the writer say about a desert?",o:["It is a disaster for the farmers","It is an ecosystem with its own habitat","It should be turned into a field for crops","It has no wildlife worth studying"],a:1,e:"A desert is not a disaster; it is an ecosystem。分号后进一步说明 soil 和 wildlife。"},
  {s:"What is the main ethic of the media?",o:["To avoid politics and stay neutral","To be strict with facts and gentle with people","To get more subscribers than other papers","To be first with the news of the day"],a:1,e:"be strict with facts and gentle with people，末句直接给出。"}
 ,{s:"What does the writer think about jokes and the media?",o:["Both need strict facts and gentle manners", "Jokes at dinner are always harmless", "Media should chase viral clips for money", "Celebrities should never appear on channels"],a:0,e:"从晚餐玩笑到媒体：对事实要严格、对人要温和（a strict ethic of facts would decide otherwise）。B 与 they did offend 相反；C 与媒体伦理的批评相反。"}]},
{d:41,k:'d41-1',t:"The Camp at the Edge",zh:"难民营不敌对也不友好，只是拥挤；等级、义务、志愿者的水，孩子从屏幕上的森林学会什么是危险。",w:["refugee","hostile","friendly","constant","volunteer","charity","hierarchy","rank","obligation","aggressive","violent","peaceful","forest","predator","prey","evolution","extinction","biodiversity","image","browse","website","blog","bias","censor","tax","investment","capital","fund","loan","debt"],
 p:`The refugee camp on the edge of the city was not a hostile place, but it was not friendly either. It was simply crowded. A constant flow of volunteers worked there, and a charity paid for the water.
The hierarchy was clear. At the top was a small office with a rank for each officer; below it, a long list of obligations. Nobody was aggressive, and there had never been a violent incident, but the place was not peaceful.
The camp also ran a small school. A teacher showed the children a forest on a screen and asked what a predator was. One boy said it was a wolf; another said it was the government. She laughed, then explained evolution, extinction and biodiversity in simple words. A wolf without prey would not survive a winter. The lesson was about nature, but the image stayed with me: a child who has seen a wolf knows what danger is.
That evening I browsed a website and read a blog about the camp. The writer complained about bias in the news and about a censor who had removed a photo. She was right. But a tax on a rich city, or a small investment of capital, would do more than any article. A fund with one loan can turn a debt into a business.`,
 q:[
  {s:"How does the writer describe the camp?",o:["Empty and quiet in the early morning","Neither friendly nor hostile, simply crowded","Peaceful and rich in a strange way","Hostile and violent after the first night"],a:1,e:"not a hostile place, but it was not friendly either. It was simply crowded。三句连读才准确。"},
  {s:"What did the second boy say a predator was?",o:["A wolf","The government","A teacher","A river"],a:1,e:"One boy said it was a wolf; another said it was the government。题干问 the second boy，对应 another 那一个，所以是 the government；the wolf 是第一个男孩的答案，属于干扰项。"},
  {s:"What does the writer think would help more than an article?",o:["Another photo","A tax or a small investment","A new website","A bigger school"],a:1,e:"a tax on a rich city, or a small investment of capital, would do more than any article。"}
 ,{s:"What does the writer imply about helping the camp?",o:["Material help matters more than words on a website", "Articles are useless in every situation", "The camp is friendly to all visitors", "Children should not browse websites"],a:0,e:"a tax on a rich city, or a small investment of capital, would do more than any article——物质投入比文章更有用。B 的 in every case 绝对化（作者承认博主 She was right）。"}]},
{d:42,k:'d42-1',t:"More Than a Count",zh:"人口普查告诉城市有多少老人和年轻人；第一份报告讲交通：公交比四十辆车省路；第二份讲土地与生态；最后说统计之外的东西。",w:["census","household","aging","relative","youth","importance","symbol","pedestrian","safety","passenger","consumer","vehicle","traffic","route","coast","wetland","grassland","ocean","marine","jungle","competitor","monopoly","credit","purchase","customer","destination","danger","secondary","offspring","extremely"],
 p:`A census is more than a count. It tells a city how many households care for an aging relative and how many are full of youth. Its importance is easy to forget until a bus route is cut: then the numbers become a symbol of who matters.

The first report is about movement. A pedestrian and a passenger are not the same user of a street, and safety is not the same for both. A customer who buys a car is not the same as a consumer who buys a ticket. A vehicle that carries forty people uses less road than forty cars, and the traffic on the main route falls by a third. In one town the bus company became a monopoly, and the price of a purchase rose.

The second report is about land. Along the coast, a wetland and a grassland protect the shore better than a wall. In the ocean, a marine biologist studies a jungle and a coral reef and finds the same rule: both are crowded markets, where every species is a competitor. What looks like a danger to one is a destination for another.

Secondary numbers matter too. The destination of a family is decided less by effort than by a loan. The credit of a family, the offspring who leave and never return, the extremely small sum that decides whether a village keeps its school — none of these appear in a total. A census counts people; it cannot count what a person is worth.`,
 q:[
  {s:"Why is a bus a symbol in the report?",o:["It is driven by the city and paid for by taxes","It carries many people with less road and reduces traffic","It is the only vehicle allowed in the centre","It is expensive for the people who use it"],a:1,e:"A vehicle that carries forty people uses less road than forty cars, and the traffic on the main route falls by a third。"},
  {s:"What does the marine biologist compare a jungle and a reef to?",o:["A single family living in one house","Crowded markets where every species competes","An empty ocean with no fish left","Two deserts with nothing alive in them"],a:1,e:"第三段 studies a jungle and a coral reef and finds the same rule: both are crowded markets, where every species is a competitor。"},
  {s:"What decides the destination of a family, according to the report?",o:["Effort alone","A loan more than effort","The weather","The size of the house"],a:1,e:"The destination of a family is decided less by effort than by a loan，less by A than by B＝B 影响更大。"}
 ,{s:"What is the passage mainly about?",o:["What a census can and cannot measure", "How to cut a bus route fairly", "Why jungles and reefs matter", "Why loans decide family futures"],a:0,e:"标题 More Than a Count 即主旨：普查能数人头，但信用、离家的孩子、决定学校去留的小钱——这些数不到的东西也重要。B、C、D 都是文中的例子。"}]},
{d:43,k:'d43-1',t:"A Field Is a Marriage",zh:"祖母说婚姻靠体谅和\"对误会记性短\"；山谷为保住风景拒绝采矿；农活急不得，还得靠铁路公路把货运进城。",w:["marriage","bond","empathy","misunderstanding","spouse","burden","island","shore","valley","landscape","scenery","mineral","wealth","journey","commute","subway","railway","highway","parking","brand","discount","warranty","package","shipment","crop","agriculture","farming","livestock","pesticide","fertilizer"],
 p:`My grandmother said that a field is a marriage. Both need a bond that is not built in a day: empathy, and a short memory for misunderstanding. A spouse who keeps a list of old quarrels will lose the harvest, and a marriage carries a burden that a single person does not. She said this on the shore of the island where she was born, looking across at the valley.

The valley has the most beautiful landscape in the province, and its scenery is the reason people come. A company once wanted to dig for mineral there; the village refused. The wealth was real, but so was the view, and the village chose the view.

Farming is the same bargain. A crop does not hurry. Agriculture here is small: a little farming on the hillside, some livestock, and no pesticide or fertilizer that the soil cannot take. Getting the food to market is another journey. The old railway is gone; the commute is now by subway and highway, and parking downtown costs more than the vegetables.

Even the package has a story. A brand with a discount and a two-year warranty, a shipment that arrives late — the farmer pays for all of it. A field is a marriage: you cannot rush it, and you cannot cheat it for long.`,
 q:[
  {s:"What did the grandmother say kept the marriage?",o:["A big house with room for everyone","Empathy and a short memory for misunderstanding","Living on an island away from the family","Money and travel to new places each year"],a:1,e:"she said: empathy, and a short memory for misunderstanding。"},
  {s:"Why did the village refuse the mining company?",o:["The mineral was poor","They wanted to keep the valley","The company paid too much","The government refused"],a:1,e:"A company once wanted to dig for mineral there; the village refused，上文说 valley 的 landscape 是全胜最美，拒绝的理由就在这。"},
  {s:"What does \"a field is a marriage\" mean?",o:["Farming needs a partner","You cannot rush it or cheat it for long","Fields are expensive","Marriage is like weather"],a:1,e:"you cannot rush it, and you cannot cheat it for long，这是比喻的解释句。"}
 ,{s:"What does the grandmother's comparison teach?",o:["Farming needs patience and honesty over time", "Mining is always profitable for a village", "Marriage needs a written contract", "Harvests come quickly to honest people"],a:0,e:"A field is a marriage: you cannot rush it, and you cannot cheat it for long——急不得也骗不得。B 与村庄拒绝采矿相反；C 无据；D 与 cannot rush it 相反。"}]},
{d:44,k:'d44-1',t:"What the Street Became",zh:"十年间街道变成小城：垃圾、填埋场、化石燃料；邻居医生说基因测不出习惯，生活方式不是能买来的东西，讲话的方式也不会改变谁。",w:["witness","civilization","urbanization","landfill","garbage","fossil","fuel","coal","consumption","neighbor","genetic","gene","calorie","protein","vitamin","fat","habit","lifestyle","norm","manner","polite","healthy","topic","bargain","partner","code","user","gadget","democracy","affordable"],
 p:`I have witnessed a change in my own street. Ten years ago it was a quiet place; today it is a small city. Urbanization brought shops, a clinic and a bus, but it also brought garbage and noise.

A civilization is judged by how it handles waste. Our landfill is full, and the garbage of one district is now sent to another. Fossil fuel is still the main source, and coal is cheaper than the sun. Consumption grows faster than any rule. A democracy is not only a vote; it is an affordable bus and a clean street.

My neighbor is a doctor, and she talks about a second kind of waste. A genetic test can tell you about a gene, but not about a habit. A calorie is not a diet, and a protein bar is not a meal. Vitamin pills cannot replace vegetables, and a low-fat label can hide sugar. A healthy lifestyle is a norm, not a purchase.

We should be polite about this. A manner that sounds like a lecture will not change anyone. The best partner in a bargain is a person who feels respected. Every user of a gadget knows the code of the app better than the code of his own body. That is the topic I would put on every screen: what did you do today that your body will thank you for tomorrow?`,
 q:[
  {s:"How is a civilization judged, according to the writer?",o:["By its buildings","By how it handles waste","By its population","By its cars"],a:1,e:"A civilization is judged by how it handles waste。"},
  {s:"What does the doctor say a genetic test cannot tell you?",o:["Your genes","Your habit","Your age","Your weight"],a:1,e:"a genetic test can tell you about a gene, but not about a habit。but 之后是重点。"},
  {s:"What does the writer think will not change anyone?",o:["A law that nobody has explained to them","A manner that sounds like a lecture","A screen that repeats the same warning","A doctor who gives orders and no reasons"],a:1,e:"A manner that sounds like a lecture will not change anyone。"}
 ,{s:"What does the doctor think about genetic tests?",o:["They cannot measure habits or lifestyle", "They can predict every future disease", "They are cheaper than regular clinics", "They have changed the whole street"],a:0,e:"基因测不出习惯——生活方式不是基因能告诉你的。B 绝对化；C、D 无据。"}]},
{d:45,k:'d45-1',t:"A Walk Along the River",zh:"河边散步看到三层污染：水里的垃圾污水、空气里的人群、饮食里的糖盐；姐妹在实验室说\"安全\"是最危险的形容词，因为它藏着条件。",w:["trash","litter","sewage","filter","altitude","atmosphere","crowd","campaign","sugar","salt","tobacco","alcohol","caffeine","fiber","optional","sibling","chain","discovery","meaning","sentence","adjective","blind","deaf","fake","nuclear","cattle","planet","access","tolerance","illiterate"],
 p:`A walk along the river is now a lesson in waste. Trash floats near the bank, litter covers the path, and the sewage from an old pipe still reaches the water. A filter would cost less than the damage.

Higher up, at this altitude, the air is thin and the atmosphere holds less oxygen. In the city the same problem takes another form: a crowd can make the air heavy, and a campaign against sugar and salt has begun. A warning on tobacco and alcohol is now required. Caffeine is not a nutrient, and fiber is not optional for a healthy diet.

My sibling works in a laboratory. She studies a chain of reactions that begins with a single cell, and she says a discovery in one field can change the meaning of a sentence in another. Her favourite example is the adjective "safe": it is the most dangerous word in science, because it hides a condition.

We are not blind to the problem, and we are not deaf to the warning. Clean water should be free to access, and tolerance for waste means being illiterate in a new way. One person can produce less trash. One family can stop buying a fake product. A nuclear plant is not the only answer, and a cattle farm is not the only source of food. The planet does not need a hero; it needs a habit.`,
 q:[
  {s:"Why does the writer say a filter would be cheaper?",o:["It is small","It costs less than the damage","It is easy to buy","It needs no water"],a:1,e:"A filter would cost less than the damage，damage 指前面 trash、litter、sewage 造成的后果。"},
  {s:"Why is \"safe\" the most dangerous adjective in science?",o:["It is too long","It hides a condition","It is not in the dictionary","Nobody uses it"],a:1,e:"it hides a condition，因为\"安全\"总有前提条件，说成绝对就会误导。"},
  {s:"What does the last sentence mean?",o:["We need a famous person","We need one small habit repeated","We need a new planet","We need a nuclear plant"],a:1,e:"The planet does not need a hero; it needs a habit。分号后是答案，habit 指向\"小的、重复的\"。"}
 ,{s:"What is the passage mainly about?",o:["Pollution hides in water, air and food, and each person can produce less", "The river should be closed to swimmers", "Nuclear plants are the main danger", "Filters are too expensive to install"],a:0,e:"全文写河边散步看到的三层污染（水里、空气里、饮食里），落点 One person can produce less trash。B、C 偏离；D 与 A filter would cost less than the damage 相反。"}]},
{d:46,k:'d46-1',t:"A Thin Shield",zh:"臭氧层很薄，太阳辐射很强；一头牛的甲烷比一辆车还多；素食、零食、甜味都藏着代价；暖冬不是温柔，是季节失了序。",w:["ozone","radiation","circumstance","powerful","reveal","nature","naturally","vegetarian","snack","flavor","sweet","soft","taste","hunger","starvation","total","hire","grow","split","attend","warn","shallow","warm"],
 p:`The ozone layer is a thin shield. Radiation from the sun is powerful, and under different circumstances it could do more harm. A report on methane released last month revealed that a single cow produces more gas than a car in a year.

Nature does not work in a straight line. A vegetarian diet is not naturally better for the planet if the vegetables travel by plane. A snack with a sweet flavor can hide a large amount of sugar, and a soft drink can taste light while carrying a heavy cost. Hunger and starvation are not the same problem: one is a shortage of food, the other a failure of distribution.

The total effect is easy to see but hard to measure. Farmers were hired to grow a new crop, and the village was split between those who attend the meeting and those who do not. The report does not warn us; it simply shows a shallow lake that was once deep.

What it reveals is not a catastrophe but a choice. A warm winter is not a soft one; it is a season out of order. The taste of a fruit depends on the soil, and the future depends on a habit. We do not need a powerful solution. We need a small one, repeated.`,
 q:[
  {s:"What did the report on methane reveal?",o:["The ozone layer is not as important as we think","A single cow produces more gas than a car in a year","Radiation from the sun is harmless at this level","Cars produce no gas that affects the climate"],a:1,e:"A report on methane revealed that a single cow produces more gas than a car in a year。"},
  {s:"Why is a vegetarian diet not always better for the planet?",o:["Vegetables are unhealthy","The vegetables may travel by plane","It is too expensive","Nobody likes it"],a:1,e:"not naturally better for the planet if the vegetables travel by plane，条件从句是关键。"},
  {s:"What does the writer mean by \"a warm winter is not a soft one\"?",o:["Winter has become more comfortable for everyone","A warm winter means the season is out of order","We should not wear heavy coats any more","Winter is shorter than it used to be"],a:1,e:"it is a season out of order，分号后就是解释。soft 在这里是\"温和舒适\"的意思。"}
 ,{s:"What does the writer suggest about solving environmental problems?",o:["Small actions repeated matter more than one big fix", "One powerful solution is badly needed", "Warm winters are harmless changes", "Cows cause all the pollution"],a:0,e:"末句 We do not need a powerful solution. We need a small one, repeated. 直接点明。B 相反；C 与 a warm winter is not a soft one; it is a season out of order 相反；D 把甲烷例子绝对化。"}]},
