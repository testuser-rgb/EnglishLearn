<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学位英语 · 55天冲刺台</title>
<style>
.rw{border-bottom:2px solid #b9d3f2;font-weight:700;color:#1d3f6e;cursor:help;}
.rdgp{font-family:Georgia,serif;font-size:14.2px;line-height:2.05;color:var(--ink-2);}
.czblank{display:inline-block;min-width:76px;text-align:center;border-bottom:1.5px solid var(--line);color:var(--ink-4);font-weight:700;margin:0 2px;padding:0 4px;}
.czblank.on{color:var(--blue);border-bottom-color:var(--blue);}
.czblank.ok{color:var(--ok);border-bottom-color:var(--ok);}
.czblank.no{color:var(--rose);border-bottom-color:var(--rose);}
.czrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);}
.czno{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue-2);font-size:11.8px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--blue);}
.czopts{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap;}
.czopt{font:inherit;font-size:12.6px;padding:5px 10px;border:1px solid var(--line-2);background:var(--card);border-radius:7px;cursor:pointer;color:var(--ink-2);}
.czopt:hover{border-color:var(--blue-3);}
.czopt.sel{border-color:var(--blue);background:var(--blue-2);color:var(--blue);font-weight:700;}
.czopt.ok{border-color:var(--ok);background:var(--ok-2);color:var(--ok);font-weight:700;}
.czopt.no{border-color:var(--rose);background:var(--rose-2);color:var(--rose);text-decoration:line-through;}
.czexp{flex-basis:100%;font-size:12.2px;color:var(--ink-3);line-height:1.8;padding-left:34px;}
.czgl{font-size:10.8px;color:var(--ink-4);margin-left:5px;font-weight:400;}

.rdgp p{margin:0 0 11px;}
.rdgq{margin-bottom:14px;}
.rdgq .qs{font-size:13.4px;font-weight:700;line-height:1.7;margin-bottom:8px;}
.rdgq .qs em{font-style:normal;color:var(--ink-4);font-weight:400;font-size:12px;}
.ropt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;margin-bottom:6px;font-size:13px;line-height:1.6;cursor:pointer;font-family:inherit;color:var(--ink-2);}
.ropt:hover{border-color:#9fc2ea;background:#f7fbff;}
.ropt.ok{border-color:#4f9d6b;background:#eff9f2;color:#256b41;font-weight:700;}
.ropt.no{border-color:#c05a5a;background:#fdf0f0;color:#a53b3b;}
.ropt:disabled{cursor:default;}
.rexp{font-size:12.2px;line-height:1.85;color:var(--ink-3);background:#fafbfd;border-left:3px solid #c9d9ec;padding:8px 11px;border-radius:0 8px 8px 0;margin-top:2px;}
</style>
<style>
  :root{
    --ink:#16202e; --ink-2:#3d4c60; --ink-3:#77869a; --ink-4:#9aa8ba;
    --line:#e4eaf3; --line-2:#eff3f9;
    --bg:#f4f7fb; --card:#ffffff;
    --blue:#14539a; --blue-2:#eaf1fa; --blue-3:#d6e4f5;
    --teal:#0f766e; --teal-2:#e6f4f1;
    --amber:#b45309; --amber-2:#fdf3e4;
    --rose:#a8324a; --rose-2:#fbeef1;
    --ok:#2f8f5b; --ok-2:#e7f4ec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
    font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .app{display:grid; grid-template-columns:198px 1fr; min-height:100vh;}

  /* ===== 侧栏 ===== */
  .side{background:#fff; border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column;}
  .brand{font-size:13px; font-weight:700; color:var(--blue); letter-spacing:.04em; padding:4px 10px 14px; border-bottom:1px solid var(--line-2); margin-bottom:12px;}
  .brand span{display:block; font-size:11px; color:var(--ink-4); font-weight:400; letter-spacing:.02em; margin-top:3px;}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav button{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:9px 11px; border-radius:8px; border:0; background:transparent;
    font-size:13.3px; color:var(--ink-2); cursor:pointer; font-family:inherit; transition:background .12s;
  }
  .nav button:hover{background:#f5f8fc;}
  .nav button.on{background:var(--blue-2); color:var(--blue); font-weight:700;}
  .nav button .ic{width:16px; text-align:center; font-size:13px; opacity:.85;}
  .navgrp{font-size:10.6px;color:var(--ink-4);letter-spacing:.05em;padding:11px 11px 3px;font-weight:700;}
  .nav button.locked{opacity:.48;}
  .nav .due{margin-left:auto;font-size:10.4px;color:var(--ink-4);font-weight:400;}
  .side-foot{margin-top:auto; padding:12px 10px 4px; border-top:1px solid var(--line-2); font-size:11.6px; color:var(--ink-4);}
  .side-foot b{color:var(--blue); font-size:15px;}

  /* ===== 主区 ===== */
  main{padding:26px 32px 70px; max-width:940px; width:100%;}
  .vhead{margin-bottom:22px;}
  .vhead h1{font-size:22px; margin:0 0 5px; letter-spacing:-.01em;}
  .vhead p{margin:0; font-size:12.8px; color:var(--ink-3);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:18px 20px;}
  .card + .card{margin-top:14px;}
  .card h3{font-size:13.6px; margin:0 0 12px; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .card h3 .sub{font-weight:400; color:var(--ink-4); font-size:11.8px;}

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 16px;}
  .stat .k{font-size:11.4px; color:var(--ink-4); letter-spacing:.03em;}
  .stat .v{font-size:21px; font-weight:700; color:var(--blue); line-height:1.35; margin-top:1px;}
  .stat .v em{font-size:11.5px; font-weight:500; color:var(--ink-4); font-style:normal; margin-left:3px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 16px; border-radius:9px; border:1px solid var(--line);
    background:#fff; color:var(--ink-2); font-size:13.2px; font-family:inherit;
    cursor:pointer; transition:all .12s; font-weight:600;
  }
  .btn:hover{border-color:var(--blue-3); background:#f8fbff;}
  .btn.pri{background:var(--blue); border-color:var(--blue); color:#fff;}
  .btn.pri:hover{background:#0f4580; border-color:#0f4580;}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-3); font-weight:400;}
  .btn.sm{padding:6px 12px; font-size:12.5px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* 任务清单 */
  .task{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--line-2); cursor:pointer;}
  .task:last-child{border-bottom:none;}
  /* 今日页的任务条只读：状态由各学习页顶部的完成按钮决定，此处不再接收点击 */
  .task.ro{cursor:default;}
  .task.ro .box{cursor:default;}
  .task .box{
    flex:none; width:19px; height:19px; border-radius:5px; border:1.6px solid #c9d5e6;
    margin-top:2px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; transition:all .15s;
  }
  .task.done .box{background:var(--ok); border-color:var(--ok);}
  .task.done .tx{color:var(--ink-4); text-decoration:line-through;}
  .task .tx{font-size:13.4px; color:var(--ink); line-height:1.6;}
  .task .min{margin-left:auto; flex:none; font-size:11.8px; color:var(--ink-4); padding-top:2px;}
  .taskmeta{font-size:10.9px; color:var(--ink-4); font-weight:400; margin-top:2px; text-decoration:none;}
  .task.done .taskmeta{text-decoration:none;}

  /* 完成条：每个学习页顶部，和今日页共用同一份按天完成记录 */
  .taskbar{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.97);
    border:1px solid var(--line); border-radius:12px; padding:9px 14px; margin:0 0 18px;
    box-shadow:0 3px 14px rgba(22,32,46,.06);}
  .taskbar .tbrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:6px 0;}
  .taskbar .tbrow + .tbrow{border-top:1px dashed var(--line-2);}
  .taskbar .tbname{flex:none; min-width:118px; font-size:12.8px; font-weight:700; color:var(--ink-2);}
  .taskbar .tbinfo{flex:1; min-width:200px; font-size:11.9px; color:var(--ink-3); line-height:1.65;}
  .taskbar .tb-btn{flex:none; padding:7px 14px; border-radius:8px; border:1.5px solid var(--blue-3);
    background:#fff; color:var(--blue); font-size:12.6px; font-weight:700; font-family:inherit;
    cursor:pointer; transition:all .12s;}
  .taskbar .tb-btn:hover{background:var(--blue-2);}
  .taskbar .tb-btn.on{background:var(--ok); border-color:var(--ok); color:#fff;}
  .taskbar .tb-btn.on:hover{background:#25764a;}
  .tb-ok{display:inline-block; font-size:10.8px; font-weight:700; color:var(--ok);
    background:var(--ok-2); padding:1px 7px; border-radius:5px; margin-right:6px;}
  .tb-no{display:inline-block; font-size:10.8px; font-weight:700; color:var(--amber);
    background:var(--amber-2); padding:1px 7px; border-radius:5px; margin-right:6px;}
  .tbsrc{display:block; font-size:10.8px; color:var(--ink-4); margin-top:1px;}
  .tbfoot{font-size:11.2px; color:var(--ink-4); border-top:1px dashed var(--line-2);
    padding-top:7px; margin-top:4px; line-height:1.7;}
  @media print{.taskbar{display:none;}}

  .bar{height:7px; border-radius:99px; background:#e9eef6; overflow:hidden;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,#2d7bd0,#14539a); border-radius:99px; transition:width .4s;}

  /* 词卡 */
  .flash{
    min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:14px; background:#fff; padding:30px;
    cursor:pointer; text-align:center; position:relative; transition:border-color .15s;
  }
  .flash:hover{border-color:var(--blue-3);}
  .flash .w{font-family:Georgia,"Times New Roman",serif; font-size:38px; color:var(--ink); letter-spacing:.01em; line-height:1.3;}
  .flash .pt{font-size:12.6px; color:var(--ink-4); margin-top:10px;}
  .flash .zh{font-size:19px; color:var(--blue); font-weight:600; margin-bottom:8px;}
  .flash .use{font-size:13.4px; color:var(--ink-2); margin-top:6px; font-family:Georgia,serif; line-height:1.85;}
  .flash .poslegend{font-size:11px; color:var(--ink-4); margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); line-height:1.7;}
  .flash .bkrow{display:flex; align-items:flex-start; gap:9px; margin-top:10px; width:100%; text-align:left;}
  .flash .btag{flex:none; font-size:11px; font-weight:700; padding:2.5px 8px; border-radius:6px; margin-top:1.5px; letter-spacing:.04em;}
  .flash .t-tip{background:var(--blue-2); color:var(--blue);}
  .flash .t-cmp{background:#f1ecfb; color:#6b4fbf;}
  .flash .t-read{background:#e7f2ea; color:#2f7d4f;}
  .flash .readsen i{display:block; font-style:normal; font-family:Georgia,serif; font-size:12.9px; line-height:1.72; color:var(--ink-2);}
  .flash .readsen b{display:block; font-weight:400; font-size:11.8px; color:var(--ink-3); margin-top:3px;}
  .layerbadge.lr{background:#e7f2ea; color:#2f7d4f;}
  .tline{display:flex; gap:10px; padding:9px 0; border-top:1px dashed var(--line);}
  .tline:first-of-type{border-top:none;}
  .tline .tn{flex:none; width:18px; font-size:11px; color:var(--ink-4); padding-top:3px;}
  .tline .ten{font-family:Georgia,serif; font-size:13.4px; line-height:1.72; color:var(--ink-1);}
  .tline .tzh{font-size:11.8px; color:var(--ink-3); margin-top:2px; line-height:1.65;}
  .flash .saybar{font-size:11.5px; color:var(--blue); background:var(--blue-2); display:inline-block; padding:4px 11px; border-radius:20px; margin-top:9px; cursor:pointer;}
  .flash .saymini{cursor:pointer; font-size:13px; opacity:.65; margin-left:4px;}
  .flash .saymini:hover{opacity:1;}
  .flash .t-use{background:#ecf7ef; color:#2e7d43;}
  .flash .t-ext{background:#f2edfa; color:#7452b0;}
  .flash .t-fun{background:var(--amber-2); color:var(--amber);}
  .flash .t-mine{background:var(--rose-2); color:var(--rose);}
  .flash .bval{font-size:13px; color:var(--ink-2); line-height:1.8;}
  .flash .bval .tipnone{font-style:normal; color:var(--amber);}
  .flash .fam-inline{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .flash .medit{font-size:11.4px; color:var(--rose); cursor:pointer; text-decoration:underline; margin-left:4px;}
  .flash .bkadd{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); width:100%;
    font-size:12.4px; color:var(--blue); cursor:pointer; font-weight:600; text-align:left;}
  .flash .bkadd:hover{color:#0d3f77;}
  .flash .bkadd .bkadd-s{font-weight:400; font-size:11px; color:var(--ink-4); margin-left:8px;}
  /* 课堂 */
  .lesson .lh{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .lesson .lt{font-size:14.6px; font-weight:700; color:var(--ink);}
  .lesson .wk{font-size:10.8px; font-weight:600; color:var(--blue); background:var(--blue-2); padding:2px 8px; border-radius:6px; margin-left:6px; vertical-align:2px;}
  .lesson .ls{font-size:12px; color:var(--ink-3); margin-top:5px; line-height:1.6;}
  .lesson .lbtns{display:flex; gap:8px; margin-top:12px;}
  .lesson .pill{margin-left:auto; flex:none;}
  .lsec{margin-bottom:16px;}
  .lsec h4{font-size:13.6px; margin:0 0 7px; color:var(--blue);}
  .lsec .lbody{font-size:13.2px; line-height:2.0; color:var(--ink-2);}
  .lsec .lbody b{color:var(--ink);}
  .qtext{font-size:15.4px; font-weight:600; line-height:1.9; color:var(--ink); margin-bottom:14px;}
  .qtext .blank{color:var(--blue); border-bottom:2px solid var(--blue-3); padding:0 6px;}
  .qopts{display:grid; gap:9px;}
  .qopt{text-align:left; padding:11px 14px; border:1px solid var(--line); border-radius:10px; background:#fff;
    font-size:13.6px; color:var(--ink-2); cursor:pointer; font-family:inherit; line-height:1.6; transition:border-color .12s, background .12s;}
  .qopt:hover{border-color:var(--blue-3); background:#f8fbff;}
  .qopt.ok{border-color:#2e7d43; background:#ecf7ef; color:#1e5c30; font-weight:600;}
  .qopt.bad{border-color:var(--rose); background:var(--rose-2); color:var(--rose); font-weight:600;}
  .qopt:disabled{cursor:default;}
  .exp{margin-top:14px; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.9;}
  .exp.eok{background:#ecf7ef; border:1px solid #cde8d4; color:#1e5c30;}
  .exp.ebad{background:var(--amber-2); border:1px solid #f3dfc0; color:var(--amber);}
  .witem{padding:10px 0; border-bottom:1px solid var(--line-2);}
  .witem .wq{font-size:13.4px; font-weight:600; color:var(--ink);}
  .witem .wa{font-size:12.8px; color:#1e5c30; margin-top:4px;}
  .witem .we{font-size:12.6px; color:var(--ink-3); margin-top:3px; line-height:1.8;}
  .pill{display:inline-block; font-size:11px; font-weight:700; padding:2.5px 9px; border-radius:6px; background:var(--line-2); color:var(--ink-3);}
  .pill.ok{background:#ecf7ef; color:#1e5c30;}
  .pill.warn{background:var(--amber-2); color:var(--amber);}
  .flash .hint{position:absolute; bottom:14px; font-size:11.6px; color:var(--ink-4);}
  .layerbadge{position:absolute; top:14px; left:16px; font-size:11px; font-weight:700; padding:1px 9px; border-radius:99px;}
  .la{background:var(--rose-2); color:var(--rose);}
  .lb{background:var(--amber-2); color:var(--amber);}
  .lc{background:var(--blue-2); color:var(--blue);}
  .ld{background:var(--teal-2); color:var(--teal);}

  /* 直读词卡：一次摊开，不再翻面 */
  .flash.wcard{cursor:default; min-height:0; padding:18px 22px 20px; align-items:stretch; justify-content:flex-start; text-align:left;}
  .flash.wcard:hover{border-color:var(--line);}
  .gband{display:inline-block; font-size:11.4px; font-weight:700; color:#2b5c8a; background:#eaf1fa; border-radius:99px; padding:2px 10px; margin-bottom:9px;}
  .gcard h3{font-size:15.5px; margin:0 0 6px;}
  .gnote{font-size:12.6px; color:var(--ink-3); line-height:1.75; margin:0 0 12px;}
  .glist{display:grid; grid-template-columns:1fr 1fr; gap:0 16px;}
  .grow{display:flex; gap:8px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--line-2); font-size:12.6px; min-width:0;}
  .grow b{font-family:Georgia,"Times New Roman",serif; font-size:14.4px; font-weight:600; flex:0 0 auto;}
  .grow span{color:var(--ink-3); font-size:12px; overflow:hidden; text-overflow:ellipsis;}
  .gbar{margin-top:14px; text-align:right;}
  .gend{margin-top:14px; font-size:12.2px; color:var(--ink-3); line-height:1.8;}
  .wcard .wtop{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .wcard .layerbadge{position:static;}
  .wcard .widx{font-size:11.4px; color:var(--ink-4); margin-left:auto;}
  .wcard .whead{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .wcard .w{font-family:Georgia,"Times New Roman",serif; font-size:33px; color:var(--ink); letter-spacing:.01em; line-height:1.25;}
  .wcard .saybtn{font-family:inherit; font-size:11.6px; font-weight:600; color:var(--blue); background:var(--blue-2);
    border:0; padding:4px 11px; border-radius:99px; cursor:pointer; margin-top:4px;}
  .wcard .saybtn:hover{background:var(--blue-3);}
  .wcard .zh{font-size:17px; color:var(--blue); font-weight:600; margin-top:6px; line-height:1.7;}
  .wcard .story{margin-top:14px; padding:12px 16px 13px; border-left:3px solid #dda23a;
    background:linear-gradient(180deg,#fffbf2,#fdf6e8); border-radius:0 10px 10px 0; position:relative;}
  .wcard .story .stag{display:inline-block; font-size:10.6px; font-weight:700; letter-spacing:.06em;
    color:#96600f; background:#f7e3bf; padding:1px 8px; border-radius:99px;}
  .wcard .story .q{position:absolute; right:13px; top:0; font-family:Georgia,serif; font-size:40px;
    color:#eed9b4; line-height:1; user-select:none;}
  .wcard .story p{margin:7px 0 0; font-size:14.2px; line-height:1.95; color:#5b3f16;}
  .wcard .story p b{color:#8a4a06;}
  .wcard .story.none{background:#fafbfd; border-left-color:var(--line);}
  .wcard .story.none p{color:var(--ink-3); font-size:13px;}
  .wcard .story.none .stag{color:var(--ink-4); background:var(--line-2);}
  .wcard .story.none .q{display:none;}
  .wcard .bkrow{margin-top:9px;}
  .wcard .bkadd{margin-top:14px;}

  .gradebar{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:14px;}
  .gradebar .btn{padding:12px 0; font-size:13.6px;}

  /* 词根词缀层 */
  .mnote{background:#fff; border-left:3px solid var(--teal); border-radius:0 8px 8px 0;
    padding:11px 15px; font-size:12.6px; color:var(--ink-2); line-height:1.75; margin-bottom:14px;}
  .mnote b{color:var(--ink);}
  .flash{align-items:stretch; justify-content:flex-start; padding:26px 24px 34px;}
  .flash .inner{display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; flex:1;}
  .roothint{font-size:12.2px; color:var(--ink-3); margin-bottom:14px; display:flex; align-items:center; gap:7px;}
  .roothint .rh{background:var(--teal-2); color:var(--teal); font-size:10.8px; font-weight:700;
    padding:1px 7px; border-radius:99px;}
  .morph{margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); text-align:left; width:100%;}
  .morph .mt{font-size:13.2px; color:var(--ink); line-height:1.85;}

let S=null;

function initState(){

  if(!S.start) S.start=todayISO();
  if(S.custom.length){

  }
  /* 选项位置均衡改造：旧存档里完形／模考记录存的是「原始选项下标」，新版展示顺序
     已确定性重排，这里一次性换算成新的展示位置，已作答的结果不会丢或变错。只跑一次。 */
  if(S._optv!==2){
    try{
      CLOZE.forEach(function(C){
        const r=S.clz&&S.clz[C.k||('c'+C.d)];
        if(!r||!r.a) return;
        Object.keys(r.a).forEach(function(qi){
          const old=r.a[qi]; if(old==null||!C.g[+qi]) return;
          const np=cv(C,+qi).idx.indexOf(old);
          if(np>=0) r.a[qi]=np;
        });
      });
      const E=S.exam;
      if(E&&E.ans){
        const CZ=CLOZE[E.cz];
        if(CZ) Object.keys(E.ans.c||{}).forEach(function(qi){
          const old=E.ans.c[qi]; if(old==null||!CZ.g[+qi]) return;
          const np=cv(CZ,+qi).idx.indexOf(old);
          if(np>=0) E.ans.c[qi]=np;
        });
        Object.keys(E.ans.g||{}).forEach(function(qi){
          const ref=E.gq&&E.gq[+qi], old=E.ans.g[qi];
          if(old==null||!ref) return;
          const np=gv(ref,+qi).idx.indexOf(old);
          if(np>=0) E.ans.g[qi]=np;
        });
      }
      S._optv=2; save();
    }catch(e){ S._optv=2; }
  }
}

function dayNum(){

/* 每日新词量不再是固定值：先看今天欠了多少复习。
   欠账越多，新词越少；连续 3 天还不清，当天只还账不背新词。 */
function dueCount(){
  const t=todayISO();
  let n=0;
  WORDS.forEach(w=>{
    const st=S.words[w[0]];
    if(st&&st.seen&&!st.done&&st.due<=t) n++;
  });
  return n;
}
function checkLoad(){
  const t=todayISO();
  if(S.loadDay===t) return S.loadN||0;
  const n=dueCount();
  S.loadDay=t; S.loadN=n;
  S.overStreak=(n>CAP)?(S.overStreak||0)+1:0;
  save();
  return n;
}
function targetNew(){
  const remain=freshLeft();
  if(!remain) return 0;
  if(weekNum()>=WK) return Math.min(22,remain);   /* 最后一周不再铺新面，把词库尾巴清完 */

  const dn=checkLoad();
  /* 前 3 天渐进：零基础一上来 30 个词必然崩，20 → 24 → 28 → 第 4 天起 30 */
  const d0=dayNum();
  let base=d0<=1?20:(d0===2?24:(d0===3?28:30));
  if(dn>110) base=Math.min(base,22);
  else if(dn>80) base=Math.min(base,26);
  if((S.overStreak||0)>=3) base=0;   /* 连欠 3 天：今天只回炉 */
  return Math.min(base,remain);
}

function wstate(word){
  if(!S.words[word]) S.words[word]={box:0,due:todayISO(),hard:0,seen:0};
  return S.words[word];

/* ---- 练习错题回写词状态 ----
   背词页判对不代表在句子里认得出。阅读/快练/完形/实战答错时，
   把该题关联的词 hard+1、box 降一档、due 拉回今天，第二天队列自动再考。 */
function markWeak(keys, src){
  const t=todayISO(); let n=0; const uniq={};
  (keys||[]).forEach(function(k){
    k=String(k||'').toLowerCase().trim();
    if(!k||uniq[k]||!WDEF[k]) return;
    uniq[k]=1;
    const st=S.words[k];
    if(!st||!st.seen) return;               /* 没学过的词不建记录 */
    if(st.done){ st.done=0; st.box=0; }     /* 已归档的认知词复活 */
    else st.box=Math.max(0,(st.box||0)-1);
    st.hard=(st.hard||0)+1;
    st.due=t;                               /* 今天起回到到期队列 */
    st.weakSrc=src; st.weakLast=t;
    S.weak=S.weak||{n:0,by:{},day:{},words:{}};
    S.weak.n++; S.weak.by[src]=(S.weak.by[src]||0)+1;
    S.weak.day[t]=(S.weak.day[t]||0)+1;
    S.weak.words[k]=(S.weak.words[k]||0)+1;
    n++;
  });
  if(n) save();
  return n;
}
/* 一道阅读题在考哪些词：从题干、正确选项、解析里的英文引文找本篇目标词 */
function qWords(R,qi){
  const q=R.q[qi]; if(!q) return [];
  const txt=[q.s,q.o[q.a],q.e].join(' ');
  return (R.w||[]).filter(function(w){ const re=mkRe([w],'i'); return re&&re.test(txt); });
}
/* 完形某个空关联哪些词：正确答案/误选项里在词库的 + 空位所在句子里的已学复现词 */
function clzWords(C,qi,pick){
  const g=C.g[qi], V=cv(C,qi), keys=[];
  const k=String(g.o[g.a]).toLowerCase().trim(); if(WDEF[k]) keys.push(k);
  /* pick 是页面上的展示位置，换算回题库里的原始下标再取误选项 */
  if(pick!=null&&pick!==V.a){ const p=String(g.o[V.idx[pick]]||'').toLowerCase().trim(); if(WDEF[p]) keys.push(p); }
  const tag='{{'+(qi+1)+'}}';
  const para=String(C.p).split(/\n+/).filter(Boolean).join(' ');
  const idx=para.indexOf(tag);
  if(idx>=0){
    const st=para.lastIndexOf('.',idx), en=para.indexOf('.',idx);
    const sent=para.slice(st+1, en>0?en+1:para.length);
    (C.w||[]).forEach(function(w){ const re=mkRe([w],'i'); if(re&&re.test(sent)) keys.push(w); });
  }
  return keys.filter(function(x){ return WDEF[x]; });
}
function weakStat(){

  return {total:w.n||0, today:(w.day||{})[todayISO()]||0,

function readingStats(){

function wordStats(){

let ses={queue:[],idx:0,flip:false,stat:{know:0,fuzzy:0,no:0},active:false};

let LASTPLAN=null;
let LASTDUE=0;
let LASTGROUPS=[], LASTGMETA={};
function freshPool(){
  const fr={R:[],A:[],B:[],C:[],D:[]};
  WORDS.forEach(w=>{
    const st=S.words[w[0]];
    if(!(st&&st.seen)) fr[w[3]||'C'].push(w);
  });
  return fr;
}
/* 新词配比：阅读核心词优先（直接决定能不能读懂文章），
   D 认知词是读文章的主体（只要求认得，不要求会写），
   其次复用词（会拼会搭，换词汇题的分），主题词补充，连接词最少。
   某一层学完会自动顺延到下一层，不会卡住不动。 */
const MIXW={R:0.20,D:0.44,C:0.20,B:0.13,A:0.03};
const LAYERS=['R','D','C','B','A'];
function newMix(tgt){
  const fr=freshPool();
  const layOf={};
  LAYERS.forEach(function(k){ fr[k].forEach(function(w){ layOf[w[0]]=w[3]||k; }); });
  /* 候选：还有没学的词的组。part>0 说明这组上次学了一半，今天先收尾 */
  const cands=[];
  CLU.forEach(function(c,ci){
    const mem=[], lay={R:0,D:0,C:0,B:0,A:0};
    c[3].forEach(function(n){
      if(layOf[n]==null) return;
      const w=WOF[n]; if(!w) return;
      mem.push(w); lay[layOf[n]]++;
    });
    if(!mem.length) return;
    cands.push({ci:ci,c:c,mem:mem,lay:lay,part:c[3].length-mem.length});
  });
  const want={};
  let sum=0;
  LAYERS.forEach(function(k){ want[k]=Math.round(tgt*MIXW[k]); sum+=want[k]; });
  want.R+=tgt-sum;
  const got={R:0,D:0,C:0,B:0,A:0};
  const pick=[], plan={R:0,D:0,C:0,B:0,A:0}, groups=[], usedCi={}, usedBase={};
  let total=0;
  while(total<tgt){
    let best=null, bs=-1e9;
    cands.forEach(function(o){
      if(usedCi[o.ci]) return;
      let s=0;
      if(tgt-total<3 && o.mem.length>4){ return; }   /* 快满额了就别再拉大组进来 */
      const base=o.c[1].replace(/ · 第\d+组$/,'').replace(/（\d+\/\d+）$/,'');
      if(usedBase[base]) s-=40;            /* 同一天不堆两组同名家族，re- 一次只学一组 */
      if(o.part>0) s+=80;                 /* 半截组优先收尾，不把一个组劈到两天 */
      if(o.c[0]==='辨') s+=26;
      else if(o.c[0]==='根') s+=20;
      else if(o.c[0]==='块') s+=16;
      else s+=8;
      LAYERS.forEach(function(k){
        const need=want[k]-got[k];
        if(o.lay[k]>0) s += (need>0 ? Math.min(need,o.lay[k])*7 : -o.lay[k]*4);
      });
      s+=o.mem.length;                    /* 同分时优先大组，少切一个边界 */
      s += (o.mem.length<=tgt-total) ? 8 : -12;   /* 快满额时，别为了塞满硬拉一个 8 词组 */
      if(s>bs){ bs=s; best=o; }
    });
    if(!best) break;
    usedCi[best.ci]=1;
    usedBase[best.c[1].replace(/ · 第\d+组$/,'').replace(/（\d+\/\d+）$/,'')]=1;
    best.mem.forEach(function(w){ pick.push(w); got[layOf[w[0]]]++; total++; });
    groups.push(best.ci);
  }
  pick.forEach(function(w){ plan[layOf[w[0]]]++; });
  return {pick:pick,plan:plan,groups:groups};
}
function freshLeft(){
  const fr=freshPool();
  return LAYERS.reduce((a,k)=>a+fr[k].length,0);
}
/* 到期复习的取法：box 0–1 的（马上要忘）全取，剩下名额给高 box 里到期最早的。
   以前是一刀切只取 35 张，结果一半以上的到期卡永远排不上队。 */
function buildQueue(){
  const t=todayISO();
  checkLoad();
  const due=[];
  WORDS.forEach(w=>{
    const st=S.words[w[0]];
    if(st&&st.seen&&!st.done&&st.due<=t) due.push(w);
  });
  const low=[],high=[];
  due.forEach(w=>{ ((S.words[w[0]].box||0)<=1?low:high).push(w); });
  const byDue=(a,b)=>{
    const x=S.words[a[0]].due, y=S.words[b[0]].due;
    return x<y?-1:(x>y?1:0);
  };
  low.sort(byDue);
  high.sort((a,b)=>((S.words[a[0]].box||0)-(S.words[b[0]].box||0))||byDue(a,b));
  let take=low.slice(0,CAP);
  if(take.length<CAP) take=take.concat(high.slice(0,CAP-take.length));
  shuffle(take);
  const tgt=targetNew();
  const mix=newMix(tgt);
  LASTPLAN=mix.plan;
  LASTDUE=take.length;
  /* 新词整组连着出现，组尾插一张「本组回看」 */
  const seq=[], gmeta={}, order=[];
  mix.groups.forEach(function(ci){
    const mem=mix.pick.filter(function(w){ return cluIdx(w[0])===ci; });
    if(!mem.length) return;
    mem.forEach(function(w,ix){
      gmeta[w[0]]={ci:ci,pos:ix+1,tot:mem.length};
      seq.push(w);
    });
    seq.push({g:ci});
    order.push(ci);
  });
  mix.pick.forEach(function(w){ if(!gmeta[w[0]]) seq.push(w); });
  LASTGROUPS=order; LASTGMETA=gmeta;
  return take.concat(seq);
}
function startSession(){
  const q=buildQueue();
  const nn=q.filter(function(x){ return x&&x[0]; }).length-LASTDUE;
  ses={queue:q,idx:0,flip:false,stat:{know:0,fuzzy:0,no:0},active:true,plan:LASTPLAN,
       due:LASTDUE,newN:nn,groups:LASTGROUPS,gmeta:LASTGMETA};
  ses.tomorrow=dueOn(addDays(todayISO(),1));
}
/* 某一天会到期的旧词有多少张（含过期没还的） */
function dueOn(d){
  let n=0;
  WORDS.forEach(w=>{
    const st=S.words[w[0]];
    if(st&&st.seen&&!st.done&&st.due<=d) n++;
  });
  return n;
}
function grade(v){
  const w=ses.queue[ses.idx];
  if(!w) return;
  const st=wstate(w[0]);
  st.seen=(st.seen||0)+1;
  st.last=todayISO();
  markToday(w[0], st.seen===1);
  if(v==='know'){
    const isD=(w[3]==='D');
    const maxBox=isD?2:5;
    st.box=Math.min((st.box||0)+1,maxBox);
    if(isD&&st.box>=2){ st.done=1; st.due='2099-01-01'; }   /* D 层认满 2 次归档 */
    else st.due=addDays(todayISO(),nextGap(w,st.box));
    ses.stat.know++;
  }else if(v==='fuzzy'){
    st.due=addDays(todayISO(),1);
    ses.stat.fuzzy++;
  }else{
    st.box=0; st.hard=(st.hard||0)+1; st.due=todayISO();
    ses.stat.no++;
    const td=todayISO();
    if(st.repDay!==td){ st.repDay=td; st.rep=0; }
    if((st.rep||0)<1){ st.rep++; ses.queue.push(w); }   /* 当天最多再出现一次，不然队列会滚雪球 */
  }
  if(v==='know'||v==='fuzzy'){
    const r=dayRec();
    r.wcount=(r.wcount||0)+1;
  }
  save();
  ses.idx++; ses.flip=false; ses.ans=null; ses.opts=null;
  render();
}
function gradeAgain(){
  ses.idx=0; ses.flip=false; ses.ans=null; ses.opts=null; ses.stat={know:0,fuzzy:0,no:0};
  render();
}

let LV=null;
function lstate(lid){
  const st=S.learn[lid]||(S.learn[lid]={learned:false,seen:[],right:0,wrong:0,last:null,stage:0,batches:0});
  st.seen=st.seen||[];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---- 选项位置均衡：杜绝「全选 A / 按 ABCD 顺序蒙」 ----
   每 4 题一组，正确答案在 A/B/C/D 各占一次；组内顺序与干扰项次序都由题目标识
   确定性打乱，同一题每次打开顺序一致，但全选同一项（或按 ABCD 循环选）只能拿 25%。
   只重排展示顺序，题目文字、正确选项内容、答案下标在题库里一字未动。 */
function h32(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function perm4(seed){const a=[0,1,2,3];let s=(seed>>>0)||1;for(let i=3;i>0;i--){s=(Math.imul(s,1103515245)+12345)>>>0;const j=s%(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const OVIEW={};
function qview(key,seq,o,a,salt){
  const k=key+'|'+seq+'|'+(salt||'');
  if(OVIEW[k]) return OVIEW[k];
  const block=Math.floor(seq/4), sd=salt||key;
  let p=perm4(h32('BLK#'+sd+'#'+block));
  /* 相邻两组交界处也不重复同一个字母，避免「连着选同一项」的次生规律 */
  if(block>0 && p[0]===perm4(h32('BLK#'+sd+'#'+(block-1)))[3]) p=[p[1],p[2],p[3],p[0]];
  const pos=p[seq%4];
  let s=h32(key+'@'+seq)||1;
  const dis=[0,1,2,3].filter(x=>x!==a);
  for(let i=dis.length-1;i>0;i--){s=(Math.imul(s,1103515245)+12345)>>>0;const j=s%(i+1);const t=dis[i];dis[i]=dis[j];dis[j]=t;}
  const idx=[]; let n=0;
  for(let i=0;i<4;i++) idx[i]=(i===pos?a:dis[n++]);
  return (OVIEW[k]={o:idx.map(x=>o[x]),a:pos,idx:idx});
}
/* 完形、模考词汇语法统一走这里；key 用题库坐标，练习页与模考页顺序一致 */
function cv(C,qi){const g=C.g[qi],salt='c'+(C.k||C.d);return qview('c'+(C.k||C.d)+'#'+qi,qi,g.o,g.a,salt);}
function gv(ref,qi){const q=LESSONS[ref.l].bank[ref.q];return qview('g'+ref.l+'_'+ref.q,qi,q.o,q.a,'examG');}
function masteryOf(lid){

  if(!n) return 0;

    if(!st||!st.last||!st.learned) return false;
    const gap=diffDays(st.last,today);
    const need=st.stage<REVIEW_STEPS.length?REVIEW_STEPS[st.stage]:7;
    return gap>=need;
  }).map(L=>L.id);
}
function unlockedTier(lid){
  const st=lstate(lid), m=masteryOf(lid);
  if(st.batches>=4&&m>=60) return 3;
  if(st.batches>=2&&m>=50) return 2;
  return 1;
}
function tierName(d){return d>=3?'冲刺':(d===2?'进阶':'基础');}
function pickItems(lid,n){
  const L=LESSONS.find(x=>x.id===lid), st=lstate(lid);
  const tier=unlockedTier(lid);
  const within=x=>((x.b.d||1)<=tier);
  let pool=L.bank.map((b,i)=>({b,i})).filter(x=>!st.seen.includes(x.i)&&within(x));
  shuffle(pool);
  let sel=pool.slice(0,n).map(x=>({kind:'bank',lid:lid,i:x.i,s:x.b.s,o:x.b.o,a:x.b.a,e:x.b.e,d:x.b.d||1}));
  if(sel.length<n&&GENS[lid]){
    const gen=shuffle(GENS[lid]());
    sel=sel.concat(gen.slice(0,n-sel.length).map(g=>({kind:'gen',lid:lid,s:g.s,o:g.o,a:g.a,e:g.e,d:1})));
  }
  if(sel.length<n){
    const rest=L.bank.map((b,i)=>({b,i})).filter(x=>within(x)&&!sel.some(q=>q.kind==='bank'&&q.i===x.i));
    shuffle(rest);
    sel=sel.concat(rest.slice(0,n-sel.length).map(x=>({kind:'bank',lid:lid,i:x.i,s:x.b.s,o:x.b.o,a:x.b.a,e:x.b.e,d:x.b.d||1,reuse:true})));
  }
  if(sel.length<n){ /* 兜底：解锁层实在不够时才跨层重排 */
    const rest2=L.bank.map((b,i)=>({b,i})).filter(x=>!sel.some(q=>q.kind==='bank'&&q.i===x.i));
    shuffle(rest2);
    sel=sel.concat(rest2.slice(0,n-sel.length).map(x=>({kind:'bank',lid:lid,i:x.i,s:x.b.s,o:x.b.o,a:x.b.a,e:x.b.e,d:x.b.d||1,reuse:true})));
  }
  sel.forEach(q=>{
    const arr=q.o.map((t,k)=>({t:esc(t),ok:k===q.a}));
    shuffle(arr);
    q.opts=arr.map(x=>x.t); q.a2=arr.findIndex(x=>x.ok);
  });
  return sel;
}
function openLesson(lid){ view='learn'; LV={mode:'lesson',lid:lid,part:'teach'}; save(); render(); window.scrollTo(0,0);}
function startQuiz(lid){
  lstate(lid).learned=true;
  LV={mode:'lesson',lid:lid,part:'quiz',items:pickItems(lid,10),qi:0,right:0,wrongs:[],picked:null};
  save(); render(); window.scrollTo(0,0);
}
function startReview(){
  const due=dueLessons();
  if(!due.length){alert('今天没有到期的复习。旧知识点会在学完第 1、3、7、14 天自动回来找你。');return;}
  const items=[];
  due.forEach(lid=>{
    const got=pickItems(lid,Math.ceil(8/due.length));
    got.forEach(q=>{q.src=LESSONS.find(L=>L.id===lid).t; items.push(q);});
  });
  shuffle(items);
  LV={mode:'drill',items:items.slice(0,8),qi:0,right:0,wrongs:[],picked:null,lids:due};
  save(); render(); window.scrollTo(0,0);
}
function quizPick(k){
  if(LV.picked!==null) return;
  LV.picked=k;
  const q=LV.items[LV.qi];
  const ok=k===q.a2;
  if(ok) LV.right++;
  else LV.wrongs.push(q);
  const st=lstate(q.lid);
  if(ok) st.right++; else st.wrong++;
  if(q.kind==='bank'&&!st.seen.includes(q.i)) st.seen.push(q.i);
  save(); render();
}
function quizNext(){
  LV.picked=null;
  LV.qi++;
  if(LV.qi>=LV.items.length) finishQuiz();
  render(); window.scrollTo(0,0);
}
function finishQuiz(){
  const today=todayISO();
  (LV.lids||[LV.lid]).forEach(lid=>{
    const st=lstate(lid);
    st.last=today;
    st.stage=Math.min(st.stage+1,REVIEW_STEPS.length);
    st.batches++;
  });
  save();
}
function exitLesson(){LV=null; render(); window.scrollTo(0,0);}

function learnQuiz(){
  const drill=LV.mode==='drill';
  if(LV.qi>=LV.items.length){
    const total=LV.items.length, r=LV.right, pct=Math.round(r/total*100);
    const tierStat={};
    LV.items.forEach(q=>{
      const k=tierName(q.d||1);
      tierStat[k]=tierStat[k]||[0,0];
      tierStat[k][1]++;
      if(!LV.wrongs.includes(q)) tierStat[k][0]++;
    });
    const tierLine=Object.keys(tierStat).map(k=>k+' '+tierStat[k][0]+'/'+tierStat[k][1]).join('　·　');
    const wrongRows=LV.wrongs.map(q=>
      '<div class="witem"><div class="wq">'+esc(q.s.replace('__','<b>____</b>'))+'</div>'+
      '<div class="wa">正确：<b>'+q.opts[q.a2]+'</b></div><div class="we">'+esc(q.e)+'</div></div>').join('');
    const nextDrill=dueLessons().length?'<button class="btn pri" onclick="startReview()">混排复习旧知识点</button>':'';
    return '<div class="vhead"><h1>'+(drill?'混排复习完成':'本批练习完成')+'</h1></div>'+
      '<div class="card"><div class="empty" style="padding:30px 16px;">'+
      '<div style="font-size:34px;font-weight:700;color:'+(pct>=70?'var(--green,#2e7d43)':'var(--amber)')+';">'+r+' / '+total+'</div>'+
      '<div style="margin-top:6px;color:var(--ink-3);">'+(pct>=70?'过关':'还没过关，看错题讲解，再练一批')+'</div>'+
      '<div style="margin-top:10px;font-size:12px;color:var(--ink-3);">分层成绩：'+tierLine+'</div></div>'+
      (LV.wrongs.length?'<h3 style="margin:16px 0 6px;">错题讲解</h3>'+wrongRows:'')+
      '<div style="margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;">'+
      (drill?'<button class="btn" onclick="exitLesson()">返回课堂</button>'
        :'<button class="btn pri" onclick="startQuiz(\''+LV.lid+'\')">再来一批新题</button><button class="btn" onclick="exitLesson()">返回课堂</button>')+
      nextDrill+'</div></div>';
  }
  const q=LV.items[LV.qi];
  const prog=Math.round(LV.qi/LV.items.length*100);
  let opts=q.opts.map((t,k)=>{
    let cls='qopt';
    if(LV.picked!==null){
      if(k===q.a2) cls+=' ok';
      else if(k===LV.picked) cls+=' bad';
    }
    return '<button class="'+cls+'" onclick="quizPick('+k+')">'+String.fromCharCode(65+k)+'. '+t+'</button>';
  }).join('');
  let feedback='';
  if(LV.picked!==null){
    const ok=LV.picked===q.a2;
    feedback='<div class="exp '+(ok?'eok':'ebad')+'"><b>'+(ok?'✓ 答对了':'✗ 答错了，正确答案是 '+q.opts[q.a2])+'</b><br>'+esc(q.e)+'</div>'+
      '<button class="btn pri" style="width:100%;margin-top:10px;" onclick="quizNext()">'+(LV.qi+1>=LV.items.length?'看结果':'下一题')+'</button>';
  }
  return '<div class="vhead"><h1>'+(drill?'混排复习':'练习：'+esc(LESSONS.find(x=>x.id===LV.lid).t))+'</h1></div>'+
    '<div class="card"><div style="display:flex;justify-content:space-between;font-size:11.8px;color:var(--ink-4);margin-bottom:8px;">'+
    '<span>第 '+(LV.qi+1)+' / '+LV.items.length+' 题'+(drill&&q.src?'　来自 '+esc(q.src):'')+'　<b>［'+tierName(q.d)+'题］</b></span>'+
    '<span>本批对 '+LV.right+' 错 '+LV.wrongs.length+'</span></div>'+
    '<div class="bar" style="margin-bottom:16px;"><i style="width:'+prog+'%"></i></div>'+
    '<div class="qtext">'+q.s.replace('__','<span class="blank">____</span>')+'</div>'+
    '<div class="qopts">'+opts+'</div>'+feedback+'</div>';
}

/* 数据已移至 data/07_rules.js ：IRR（题目/答案在此，勿在页面里改） */
function wpat(w){
  return w.split(/\s+/).map(function(x,idx){
    const lx=x.toLowerCase();
    if(lx==='doing') return '\\w+ing';
    if(lx==='do') return '\\w+';
    if(idx===0&&lx==='be') return '(?:be|is|am|are|was|were|been|being)';
    const alt=[x].concat(IRR[lx]||[]).map(function(y){ return y.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });
    const st=x.replace(/(e|y)$/,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    if(st.length>=4) alt.push(st+'\\w{0,4}');
    return '(?:'+alt.join('|')+')(?:s|es|ed|d|ing|ly)?';
  }).join('(?:\\s+\\w+){0,2}\\s+');

/* 选项顺序按题号确定性洗牌：同一道题每次顺序一致，但正确答案不会总在同一位置 */
function rq(R,qi){
  const q=R.q[qi];
  if(q._o) return q;
  let s=(R.d*37+qi*11+7)%2147483647;
  const idx=[0,1,2,3];
  for(let i=3;i>0;i--){
    s=(s*1103515245+12345)%2147483647;
    const j=s%(i+1);
    const t=idx[i]; idx[i]=idx[j]; idx[j]=t;
  }
  q._o=idx.map(function(k){ return q.o[k]; });
  q._a=idx.indexOf(q.a);

  if(R.dv!=null) return R.dv;

  const wc=t.split(' ').filter(Boolean).length||1;
  const sn=(t.match(/[.!?]+(?=\s|$)/g)||[]).length||1;
  const avg=wc/sn;
  const wn=(R.w?R.w.length:0);
  let s=100*Math.pow(wc/420,0.9)+1.0*(avg-11)+0.4*(wn-18);
  s=Math.max(8,Math.min(100,Math.round(s)));
  return (R.dv=s);
}

  pool.sort(function(a,b){ return a.dist-b.dist; });

  top.forEach(function(x){ x.wgt=1/(1+x.dist/4); });  /* 再在这 15 篇里加权随机 */
  const tot=top.reduce(function(s,x){ return s+x.wgt; },0);
  let r=Math.random()*tot;
  for(let i=0;i<top.length;i++){ r-=top[i].wgt; if(r<=0) return top[i].i; }
  return top[top.length-1].i;
}

/* ================= 快练：题量没有上限 =================
   三个题型轮流出，全部用"你已经学过的词"现算生成：
   1) 句中选词——从你解锁的文章里取真实句子，挖掉一个已学词
   2) 词→义   3) 义→词
   不落库、不占配额，一轮接一轮，想练多久练多久。 */
let DR=null;
function drillPool(){
  const out=[];
  WORDS.forEach(function(w){ const st=S.words[w[0]]; if(st&&st.seen&&WDEF[w[0]]) out.push(w); });
  return out;
}
function shuffleArr(a){
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function posOf(w){ return String(WDEF[w]||'').split(/[.\s]/)[0]||''; }
function drillDistract(pool, exceptKey, k){
  const pos=posOf(exceptKey), same=[], any=[];
  pool.forEach(function(w){
    if(w[0]===exceptKey||!w[1]||!WDEF[w[0]]) return;
    if(WDEF[w[0]]===WDEF[exceptKey]) return;   /* 释义和正确答案一样，不能当干扰项 */
    (posOf(w[0])===pos?same:any).push(w);
  });
  const out=[], seen={};
  shuffleArr(same).concat(shuffleArr(any)).forEach(function(w){
    if(out.length>=k||seen[WDEF[w[0]]]) return;
    seen[WDEF[w[0]]]=1; out.push(w);
  });
  return out;
}
/* 从已解锁文章里取"含 1-2 个已学词"的句子 */
function drillSents(pool){
  const d=dayNum(), arr=[];
  RDG.forEach(function(R){
    if(R.d>d) return;
    (String(R.p).match(/[^.!?]+[.!?]+/g)||[]).forEach(function(raw){
      const s=raw.trim();
      if(s.split(/\s+/).length<9) return;
      const hits=pool.filter(function(w){ const re=mkRe([w[0]],'i'); return re&&re.test(s); });
      if(hits.length===1||hits.length===2) arr.push({s:s,hits:hits,R:R});
    });
  });
  return arr;
}
function mkItem(pool, w, type, sent){
  let opts, q, a;
  if(type==='w2m'){
    opts=shuffleArr([w].concat(drillDistract(pool,w[0],3)));
    q=w[0]+(w[1]?'  ('+String(w[1]).split(/[.\s]/)[0]+')':'');
    opts=opts.map(function(x){ return WDEF[x[0]]; });
    a=opts.indexOf(WDEF[w[0]]);
  }else{
    opts=shuffleArr([w].concat(drillDistract(pool,w[0],3)));
    opts=opts.map(function(x){ return x[0]; });
    a=opts.indexOf(w[0]);
    q=(type==='gap'?(sent&&sent.s):WDEF[w[0]]);
  }
  if(a<0||opts.length<4) return null;
  return {t:type,q:q,opts:opts,a:a,w:w[0],def:WDEF[w[0]],src:sent&&type==='gap'?('第 '+sent.R.d+' 天《'+sent.R.t+'》'):''};
}
function makeDrill(n){
  const pool=drillPool();
  if(pool.length<10) return null;
  const sents=shuffleArr(drillSents(pool)), words=shuffleArr(pool);
  const used={}, items=[];
  let si=0, wi=0;
  for(let k=0;k<n;k++){
    const type=['gap','w2m','m2w'][k%3];
    let it=null;
    if(type==='gap'){
      while(si<sents.length){
        const o=sents[si++];
        const cand=o.hits.filter(function(w){ return !used[w[0]]&&WDEF[w[0]]; });
        if(!cand.length) continue;
        const w=cand[0], m=mkRe([w[0]],'i').exec(o.s);
        if(!m) continue;
        const blank=o.s.slice(0,m.index)+' ______ '+o.s.slice(m.index+m[0].length);
        it=mkItem(pool,w,'gap',{s:blank,R:o.R});
        if(it){ used[w[0]]=1; break; }
      }
    }
    if(!it){
      let w=null;
      while(wi<words.length){ const c=words[wi++]; if(!used[c[0]]){ w=c; break; } }
      if(!w) break;
      used[w[0]]=1;
      it=mkItem(pool,w,type==='m2w'?'m2w':'w2m',null);
    }
    if(it) items.push(it);
  }
  if(!items.length) return null;
  return {items:items, ans:{}, i:0};
}
function drillAns(oi){
  if(!DR||DR.ans[DR.i]!=null) return;
  DR.ans[DR.i]=oi;
  const it=DR.items[DR.i];
  S.drill=S.drill||{n:0,ok:0};
  S.drill.n++; if(oi===it.a) S.drill.ok++;
  else it.wn=markWeak([it.w],'drill')||0;
  save(); render();
}
function drillNext(){ if(DR&&DR.i<DR.items.length-1){ DR.i++; render(); window.scrollTo(0,0); } }
function drillNew(n){ DR=makeDrill(n||10); render(); window.scrollTo(0,0); }
/* ---------- 整卷实战：词汇语法 30 + 完形 20 + 阅读 20 = 70 分 · 90 分钟 ---------- */
function examPool(){
  const out=[];
  LESSONS.forEach(function(L,i){ (L.bank||[]).forEach(function(q,qi){ out.push({l:i,q:qi}); }); });
  return out;
}
function examStart(){
  if(dayNum()<53) return;              /* 第 53 天前不组卷：内容先放着，等前面学完 */
  /* 组卷：20 词汇语法 + 1 完形 + 2 阅读 */
  const pool=examPool(), gq=[], used={};
  let guard=0;
  while(gq.length<20 && guard++<pool.length*3){
    const k=Math.floor(Math.random()*pool.length);
    if(used[k]) continue;
    used[k]=1; gq.push(pool[k]);
  }
  const d=dayNum(), t=targetDiff();
  const czPool=CLOZE.map(function(C,i){ return i; }).filter(function(i){ return CLOZE[i].d<=d; });
  const cz=czPool.length?czPool[Math.floor(Math.random()*czPool.length)]:0;
  const rp=RDG.map(function(R,i){ return i; }).filter(function(i){ return RDG[i].d<=d; })
    .sort(function(a,b){ return Math.abs(diffOf(RDG[a])-t)-Math.abs(diffOf(RDG[b])-t); });
  const topN=rp.slice(0,Math.min(10,rp.length));
  const r1=topN[Math.floor(Math.random()*topN.length)]||0;
  let r2=r1;
  for(let k=0;k<20 && r2===r1;k++){ r2=rp[Math.floor(Math.random()*rp.length)]||0; }
  S.exam={t0:Date.now(), gq:gq, cz:cz, rd:[r1,r2], ans:{g:{},c:{},r:{}}, done:0};
  save(); go('exam');
}

function examSubmit(){
  const E=S.exam; if(!E||E.done) return;
  const left=20-Object.keys(E.ans.g).length, lc=CLOZE[E.cz].g.length-Object.keys(E.ans.c).length,
        lr=8-Object.keys(E.ans.r).length;
  const total=left+lc+lr;
  if(total>0 && typeof confirm==='function' && !confirm('还有 '+total+' 题没答，现在交卷吗？')) return;
  /* 算分 */
  let g=0,c=0,r=0;
  E.gq.forEach(function(ref,qi){ if(E.ans.g[qi]===gv(ref,qi).a) g++; });
  CLOZE[E.cz].g.forEach(function(x,qi){ if(E.ans.c[qi]===cv(CLOZE[E.cz],qi).a) c++; });
  E.rd.forEach(function(ri,di){
    const R=RDG[ri];
    R.q.forEach(function(q,qi){ if(E.ans.r[di+':'+qi]===rq(R,qi)._a) r++; });
  });
  /* 交卷时把答错的空/题关联的词拉回背词队列（只标记一次，重做不重复累加） */
  E.wk=E.wk||{}; let wn=0;
  const CZ=CLOZE[E.cz];
  CZ.g.forEach(function(x,qi){
    const pick=E.ans.c[qi], tag='c'+qi;
    if(pick==null||pick===cv(CZ,qi).a||E.wk[tag]) return;
    E.wk[tag]=markWeak(clzWords(CZ,qi,pick),'exam')||0; wn+=E.wk[tag];
  });
  E.rd.forEach(function(ri,di){
    const R=RDG[ri];
    R.q.forEach(function(q,qi){
      const pick=E.ans.r[di+':'+qi], tag='r'+di+'_'+qi;
      if(pick==null||pick===rq(R,qi)._a||E.wk[tag]) return;
      E.wk[tag]=markWeak(qWords(R,qi),'exam')||0; wn+=E.wk[tag];
    });
  });
  E.wn=wn;
  E.done=1; E.fin=Date.now();
  E.score={gq:g, gz:+(g*1.5).toFixed(1), cq:c, cs:c, rq:r, rs:+(r*2.5).toFixed(1), tot:+(g*1.5+c+r*2.5).toFixed(1)};
  S.exams=S.exams||[];
  S.exams.push({t0:E.t0, fin:E.fin, tot:E.score.tot, gz:E.score.gz, cs:E.score.cs, rs:E.score.rs});
  if(S.exams.length>20) S.exams=S.exams.slice(-20);
  save(); render(); window.scrollTo(0,0);
}

      '第 43 天写作会开放，写完 4 篇再进整卷。</div></div>'+
      '<div class="card"><h3>第 53 天会开放什么 <span class="sub">内容已备好，现在不看</span></h3>'+
      '<div style="font-size:12.8px;color:var(--ink-3);line-height:1.9;">'+
      '随机组卷：词汇语法 20 题（30 分）+ 完形 1 套 20 空（20 分）+ 阅读 2 篇 8 题（20 分）＝ 70 分客观卷；'+
      '90 分钟倒计时、到时自动交卷、分段成绩、全卷错题解析、最近 20 卷历史。</div></div>';
  }
  const head='<div class="vhead"><h1>整卷实战 <span class="sub">词汇语法 30 分 + 完形 20 分 + 阅读 20 分 · 90 分钟</span></h1></div>';
  const note='<div class="note" style="margin-top:0;"><b>模拟考试节奏，客观题 70 分。</b>'+
    '全卷客观部分：词汇语法 20 题（每题 1.5 分）、完形 20 空（每空 1 分）、阅读 8 题（每题 2.5 分）。'+
    '翻译 15 分和写作 15 分是主观题，在「写作」和每日任务的句子里练，不计入这里。'+

  if(!E){
    const hist=(S.exams||[]).slice().reverse().map(function(x,i){
      return '<div style="display:flex;gap:12px;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:12.8px;">'+
        '<b style="flex:none;width:56px;color:var(--ink-1);">'+x.tot+' 分</b>'+
        '<span style="color:var(--ink-3);">词汇 '+x.gz+' / 完形 '+x.cs+' / 阅读 '+x.rs+'</span></div>';
    }).join('');
    return head+note+
      '<div class="card"><h3>开始一卷</h3>'+
        '<div style="font-size:12.8px;color:var(--ink-3);line-height:1.9;">随机组卷：词汇语法从 11 课的 '+examPool().length+' 道题里抽 20 道，'+
        '完形从已解锁的套里抽 1 套，阅读挑两篇难度贴近你当前水平的。计时 90 分钟，中途可以离开（进度保留），交卷后自动算分。</div>'+
        '<div style="margin-top:14px;"><button class="btn pri" style="padding:11px 24px;font-size:13.8px;" onclick="examStart()">▶ 开始 90 分钟实战</button></div></div>'+

  /* —— 进行中 —— */

  const mm=Math.floor(left/60000), ss=Math.floor(left%60000/1000);
  if(!_examTimer && !E.done){ _examTimer=setInterval(examTick,1000); }

  const bar='<div class="card" style="border-left:3px solid var(--blue);display:flex;align-items:center;gap:16px;flex-wrap:wrap;">'+
    '<div><div style="font-size:11.8px;color:var(--ink-4);">剩余时间</div>'+
    '<div id="examTimer" style="font-size:26px;font-weight:800;font-family:Georgia,serif;color:var(--ink-1);">'+mm+':'+(ss<10?'0':'')+ss+'</div></div>'+
    '<div style="flex:1;min-width:180px;font-size:12.4px;color:var(--ink-3);">答完的题会自动保存。时间到自动交卷。</div>'+

  /* 词汇语法 */
  const gDone=Object.keys(E.ans.g).length;
  const gHtml=E.gq.map(function(ref,qi){
    const q=LESSONS[ref.l].bank[ref.q], V=gv(ref,qi), pick=E.ans.g[qi];

      return '<button class="'+cls+'" onclick="examAnsG('+qi+','+oi+')"'+(E.done?' disabled':'')+'>'+'ABCD'[oi]+'. '+esc(o)+'</button>';
    }).join('');
    return '<div class="rdgq"><div class="qs">'+(qi+1)+'. '+esc(q.s)+'</div>'+opts+
      (E.done?'<div class="rexp">'+(pick===V.a?'✓ 对　':'✗ 错　')+esc(q.e)+'</div>':'')+'</div>';
  }).join('');

  /* 完形 */
  const C=CLOZE[E.cz], cDone=Object.keys(E.ans.c).length;
  const cBody=String(C.p).split('\n').filter(function(x){ return x.trim(); }).map(function(par){
    let h=esc(par.trim());
    h=h.replace(/\{\{(\d+)\}\}/g,function(m,n){
      const qi=+n-1, pick=E.ans.c[qi], V=cv(C,qi);
      if(pick==null) return '<span class="czblank">'+n+' ______</span>';
      const cls=E.done?('czblank '+(pick===V.a?'ok':'no')):'czblank on';
      return '<span class="'+cls+'">'+n+' '+esc(V.o[pick])+'</span>';
    });
    return '<p>'+h+'</p>';
  }).join('');
  const cRows=C.g.map(function(g,qi){
    const pick=E.ans.c[qi], V=cv(C,qi);
    const opts=V.o.map(function(o,oi){
      let cls='czopt';
      if(pick===oi) cls+=' sel';
      if(E.done){ if(oi===V.a) cls+=' ok'; else if(pick===oi) cls+=' no'; }

      (E.done?'<div class="czexp">'+(pick===V.a?'<span style="color:var(--ok);">✓</span>':'<span style="color:var(--rose);">✗</span>')+' '+esc(g.e)+'</div>':'')+'</div>';
  }).join('');

  /* 阅读 */
  const rHtml=E.rd.map(function(ri,di){
    const R=RDG[ri];
    const body=R.p.split('\n').filter(function(x){ return x.trim(); })
      .map(function(pp){ return '<p>'+hlText(pp.trim(),R.w)+'</p>'; }).join('');
    const qs=R.q.map(function(q,qi){
      const Q=rq(R,qi), pick=E.ans.r[di+':'+qi];
      const opts=Q._o.map(function(o,oi){
        let cls='ropt';
        if(E.done){ if(oi===Q._a) cls+=' ok'; else if(pick===oi) cls+=' no'; }
        return '<button class="'+cls+'" onclick="examAnsR('+di+','+qi+','+oi+')"'+(E.done?' disabled':'')+'>'+'ABCD'[oi]+'. '+esc(o)+'</button>';
      }).join('');
      return '<div class="rdgq"><div class="qs">'+(qi+1)+'. '+esc(q.s)+'</div>'+opts+
        (E.done?'<div class="rexp">'+(pick===Q._a?'✓ 对　':'✗ 错　')+esc(q.e)+'</div>':'')+'</div>';
    }).join('');
    return '<div class="card"><h3>阅读 '+ (di+1) +'：'+esc(R.t)+' <span class="sub">4 题 · 每题 2.5 分</span></h3>'+
      '<div class="rdgp">'+body+'</div></div>'+
      '<div class="card"><h3>阅读 '+(di+1)+' 题目</h3>'+qs+'</div>';
  }).join('');

  const prog='<div class="stat" style="margin-bottom:14px;"><div class="k">进度</div>'+
    '<div class="v">'+(gDone+cDone+Object.keys(E.ans.r).length)+'<em>/ 48 题</em></div>'+
    '<div style="font-size:12.4px;color:var(--ink-3);margin-top:4px;">词汇语法 '+gDone+'/20 · 完形 '+cDone+'/'+C.g.length+' · 阅读 '+Object.keys(E.ans.r).length+'/8</div></div>';

  if(E.done){
    const sc=E.score;
    const grade=sc.tot>=56?'已过线（60 分及格线下的客观题版）':(sc.tot>=42?'接近过线，继续按计划走':'基础阶段，正常');
    const summary='<div class="card"><h3>成绩 <span class="sub">'+grade+'</span></h3>'+
      '<div class="stat"><div class="k">客观题总分</div><div class="v">'+sc.tot+'<em>/ 70 分</em></div>'+
      '<div class="bar" style="margin-top:8px;"><i style="width:'+Math.round(sc.tot/70*100)+'%"></i></div></div>'+
      '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px;">'+
        '<span>词汇语法 <b>'+sc.gq+'/20 对 · '+sc.gz+' 分</b></span>'+
        '<span>完形 <b>'+sc.cq+'/'+C.g.length+' 对 · '+sc.cs+' 分</b></span>'+
        '<span>阅读 <b>'+sc.rq+'/8 对 · '+sc.rs+' 分</b></span></div>'+
      (E.wn?'<div class="note warn" style="margin:10px 0 0;"><b>'+E.wn+' 个词次已回炉。</b>'+
        '交卷时答错的空和题关联的词已写回 S.words，明天背词队列自动再考一次。</div>':'')+
      '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">'+
        '<button class="btn pri" style="padding:9px 18px;" onclick="examStart()">再来一卷</button>'+
        '<button class="btn" style="padding:9px 16px;" onclick="examLeave()">关闭</button></div></div>';
    return head+summary+
      '<div class="card"><h3>词汇语法</h3>'+gHtml+'</div>'+
      '<div class="card"><h3>完形：'+esc(C.t)+' <span class="sub">'+C.g.length+' 空 · 对 '+sc.cq+'</span></h3><div class="rdgp">'+cBody+'</div>'+
        '<div style="margin-top:10px;">'+cRows+'</div></div>'+
      rHtml;
  }

  return head+bar+prog+
    '<div class="card"><h3>第一部分 · 词汇语法 <span class="sub">20 题 · 每题 1.5 分 · 建议 20 分钟 · 已答 '+gDone+'</span></h3>'+gHtml+'</div>'+
    '<div class="card"><h3>第二部分 · 完形填空：'+esc(C.t)+' <span class="sub">'+C.g.length+' 空 · 每空 1 分 · 建议 15 分钟 · 已答 '+cDone+'</span></h3>'+
      '<div class="rdgp">'+cBody+'</div>'+
      '<div style="margin-top:10px;font-size:12.3px;color:var(--ink-4);">第 1 题对应正文 (1)，依次类推。</div>'+cRows+'</div>'+
    rHtml+
    '<div style="margin-bottom:24px;display:flex;gap:8px;"><button class="btn pri" style="padding:11px 26px;font-size:13.6px;" onclick="examSubmit()">交卷算分</button></div>';
}

/* ---------- 完形填空：篇章 10/20 空，官方规格 20 空 20 分 ---------- */
let CLZV=null;                        /* null = 跟随进度推荐 */
function clzIdx(){
  if(CLZV!=null) return Math.max(0,Math.min(CLOZE.length-1,CLZV));
  const d=dayNum();
  let best=0;
  CLOZE.forEach(function(C,i){ if(C.d<=d) best=i; });
  return best;
}
function clzRec(C){
  S.clz=S.clz||{};
  const k=C.k||('c'+C.d);
  let v=S.clz[k];
  if(!v||typeof v!=='object') v=S.clz[k]={a:{}};
  v.a=v.a||{};
  return v;
}
function clzRight(C,r){
  return Object.keys(r.a).filter(function(k){ return C.g[+k] && r.a[k]===cv(C,+k).a; }).length;
}
function clzStat(){
  let all=0, full=0, qs=0, ok=0;
  CLOZE.forEach(function(C){
    const r=clzRec(C), n=Object.keys(r.a).length;
    if(n){ all++; qs+=C.g.length; ok+=clzRight(C,r); }
    if(r.done && clzRight(C,r)>=C.g.length) full++;
  });
  return {all:all,full:full,qs:qs,ok:ok};
}
function clzPick(qi,oi){
  const C=CLOZE[clzIdx()], r=clzRec(C);
  if(r.done) return;
  r.a[qi]=oi; save(); render();
}
function clzSubmit(){
  const C=CLOZE[clzIdx()], r=clzRec(C);
  const left=C.g.length-Object.keys(r.a).length;
  if(left>0 && typeof confirm==='function' && !confirm('还有 '+left+' 空没选，现在交卷吗？交卷后本套不能再改。')) return;
  r.done=1;
  r.wk=r.wk||{}; let wn=0;
  C.g.forEach(function(g,qi){
    const pick=r.a[qi];
    if(pick==null||pick===cv(C,qi).a||r.wk[qi]) return;
    r.wk[qi]=markWeak(clzWords(C,qi,pick),'cloze')||0;
    wn+=r.wk[qi];
  });
  r.wn=wn;
  save(); render(); window.scrollTo(0,0);
}
function clzRedo(){ const C=CLOZE[clzIdx()], r=clzRec(C); r.a={}; r.done=0; save(); render(); }
function clzOpen(i){ CLZV=i; go('cloze'); }
function clzNext(){
  const d=dayNum(), cur=clzIdx(), n=CLOZE.length;
  for(let k=1;k<=n;k++){
    const i=(cur+k)%n;
    if(CLOZE[i].d<=d){ CLZV=i; render(); window.scrollTo(0,0); return; }
  }
  const nx=CLOZE.find(function(x){ return x.d>d; });
  alert(nx?('目前解锁的完形套题都在这里了，第 '+nx.d+' 天会开放下一套。'):'全部完形套题都解锁了，可以用「换一套」回头重做。');
}
function clzGloss(C){
  const txt=(C.p+' '+C.g.map(function(g){return g.o.join(' ');}).join(' ')).toLowerCase();
  const rows=[];
  Object.keys(CGLOSS).forEach(function(w){
    if(WDEF[w]) return;
    const esc_w=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+');
    let re;
    try{ re=new RegExp('(^|[^a-z])'+esc_w+'(s|es)?(?=[^a-z]|$)','i'); }catch(e){ return; }
    if(re.test(txt)) rows.push([w,CGLOSS[w]]);
  });
  rows.sort(function(x,y){ return x[0].localeCompare(y[0]); });
  return rows;
}
function optHint(o){
  const k=String(o).toLowerCase().trim();
  if(WDEF[k]||!CGLOSS[k]) return '';
  return '<span class="czgl">'+esc(CGLOSS[k])+'</span>';
}
function clzBody(C,r){
  return String(C.p).split('\n').filter(function(x){ return x.trim(); }).map(function(par){
    let h=esc(par.trim());
    h=h.replace(/\{\{(\d+)\}\}/g,function(m,n){
      const qi=+n-1, g=C.g[qi]; if(!g) return esc(m);
      const pick=r.a[qi], V=cv(C,qi);
      if(pick==null) return '<span class="czblank">'+n+' ______</span>';
      const cls=r.done?('czblank '+(pick===V.a?'ok':'no')):'czblank on';
      return '<span class="'+cls+'">'+n+' '+esc(V.o[pick])+'</span>';
    });
    return '<p>'+h+'</p>';
  }).join('');
}
function viewCloze(){
  const i=clzIdx(), C=CLOZE[i], r=clzRec(C), d=dayNum();
  const n=C.g.length, done=Object.keys(r.a).length, right=clzRight(C,r);
  const wc=String(C.p).replace(/\{\{\d+\}\}/g,' ').replace(/\s+/g,' ').split(' ').filter(Boolean).length;
  const st=clzStat();
  const unlock=CLOZE.filter(function(x){ return x.d<=d; }).length;

  const head='<div class="vhead"><h1>完形填空 <span class="pill">第 '+C.d+' 天</span>'+
    '<span class="sub">'+n+' 空 · '+wc+' 词 · 建议 '+(n>=20?'15':'8')+' 分钟 · 每空 1 分</span></h1></div>';

  const note='<div class="note" style="margin-top:0;"><b>先通读全文，再动手填。</b>'+
    '完形考的不是单个词的意思，而是上下文：逻辑关系、固定搭配、词义辨析、前后指代。'+
    '这套用到第 '+C.d+' 天之前学过的 <b>'+(C.w||[]).length+' 个词</b>（见下方「本篇复现词」）；'+

    '<span style="font-size:12.4px;color:var(--ink-4);">大意：'+esc(C.zh||'')+'</span>'+
    (d<C.d?'<br><b style="color:var(--amber);">这套还没解锁</b>（第 '+C.d+' 天开放），可以先看正文和选项，正式做的话按进度来。':'')+'</div>';

  const gl=clzGloss(C);
  const glossCard=gl.length?('<div class="card"><h3>本篇生词提示 <span class="sub">'+gl.length+' 个 · 卡住再展开</span></h3>'+
    '<div style="font-size:12.5px;color:var(--ink-3);line-height:1.85;">正文里有少量不在考纲词库里的场景词——真实考试的完形也会这样。'+
    '<b>先靠上下文猜</b>，实在卡住再看下面。这些不是今天要背的词，也不影响判断答案。</div>'+
    '<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12.4px;color:var(--blue);font-weight:700;">展开中英对照</summary>'+
    '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px;">'+gl.map(function(x){
      return '<span style="font-size:12.5px;white-space:nowrap;"><b style="color:var(--ink-1);">'+esc(x[0])+'</b> <span style="color:var(--ink-4);">'+esc(x[1])+'</span></span>';
    }).join('')+'</div></details></div>'):'';

  const body='<div class="card"><h3>'+esc(C.t)+' <span class="sub">'+n+' 空</span></h3>'+
    '<div class="rdgp">'+clzBody(C,r)+'</div></div>';

  const rowHtml=C.g.map(function(g,qi){
    const pick=r.a[qi], V=cv(C,qi);
    const opts=V.o.map(function(o,oi){
      let cls='czopt';
      if(pick===oi) cls+=' sel';
      if(r.done){ if(oi===V.a) cls+=' ok'; else if(pick===oi) cls+=' no'; }
      return '<button class="'+cls+'" onclick="clzPick('+qi+','+oi+')"'+(r.done?' disabled':'')+'>'+
        'ABCD'[oi]+'. '+esc(o)+optHint(o)+'</button>';
    }).join('');
    const tag=(pick==null?'':(pick===V.a?'<span style="color:var(--ok);">✓</span>':'<span style="color:var(--rose);">✗</span>'));
    return '<div class="czrow"><div class="czno">'+(qi+1)+'</div><div class="czopts">'+opts+'</div>'+
      (r.done?'<div class="czexp">'+tag+' '+esc(g.e)+'</div>':'')+'</div>';
  }).join('');

  const score=r.done?Math.round(right/n*100):0;
  const summary=r.done
    ?'<div class="note '+(right===n?'good':'warn')+'" style="margin:10px 0 0;"><b>得分 '+right+' / '+n+'（'+right+' 分）</b>　正确率 '+score+'%。'+
      (right===n?'全对——这套完形的衔接和搭配你都抓住了。':(right>=Math.ceil(n*0.8)?'错 '+(n-right)+' 空，对照下面的解析看是哪类考点丢的。':'错 '+(n-right)+' 空，先把错空的搭配抄进错词本，再重做一遍。'))+
      (r.wn?'<br><b style="color:var(--amber);">'+r.wn+' 个词次已回炉：</b>box 降一档、到期日拉回今天，明天背词队列会再考。':'')+'</div>'
    :'<div style="font-size:12.4px;color:var(--ink-4);margin-top:10px;">已选 '+done+' / '+n+' 空'+
      (done?'　<span style="color:var(--blue);font-weight:700;">答完点下面交卷判分</span>':'')+'</div>';

  const acts=r.done
    ?'<button class="btn pri" style="padding:9px 18px;" onclick="clzRedo()">重做这套</button>'+
     '<button class="btn" style="padding:9px 16px;" onclick="clzNext()">↻ 下一套</button>'
    :'<button class="btn pri" style="padding:9px 18px;" onclick="clzSubmit()">交卷判分</button>'+
     (done?'<button class="btn" style="padding:9px 16px;" onclick="clzRedo()">清空重做</button>':'');

  const locked=CLOZE.filter(function(x){ return x.d>d; });
  const list='<div class="card"><h3>完形套题 <span class="sub">已解锁 '+unlock+' / '+CLOZE.length+' 套 · 累计做 '+st.all+' 套、对 '+st.ok+' 空</span></h3>'+
    CLOZE.map(function(x,xi){
      const rr=clzRec(x), g2=Object.keys(rr.a).length, rt=clzRight(x,rr);
      const lk=x.d>d;
      let t='';
      if(lk) t='<span style="color:var(--ink-4);">第 '+x.d+' 天开放</span>';
      else if(rr.done) t='<span style="color:'+(rt>=x.g.length?'var(--ok)':'var(--amber)')+';font-weight:700;">'+rt+'/'+x.g.length+'</span>';

  if(done>=total){

    }).join('')+'</div>'):'，全对。';

      '<div class="card"><h3>这一轮结束 <span class="sub">对 '+right+' / '+total+'</span></h3>'+

        '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">'+
          '<button class="btn pri" style="padding:9px 18px;" onclick="drillNew(10)">↻ 再来一轮 10 题</button>'+

          '<button class="btn" style="padding:9px 16px;" onclick="go(\'read\')">去读文章</button></div></div>';
  }

  const it=items[DR.i], pick=DR.ans[DR.i];

  }).join('');
  const exp=pick!=null?('<div class="rexp">'+(pick===it.a?'✓ 对　':'✗ 错　')+esc(it.w)+'：'+esc(it.def)+
    (it.src?'　<span style="color:var(--ink-4);">出自'+esc(it.src)+'</span>':'')+
    (pick!==it.a&&it.wn?'<br><b style="color:var(--amber);">已回炉，明天队列自动再考</b>':'')+'</div>'):'';
  return head+bar+
    '<div class="card"><h3>第 '+(DR.i+1)+' / '+total+' 题 <span class="sub">'+tag+(it.src?' · '+esc(it.src):'')+'</span></h3>'+
      '<div class="rdgq" style="border-top:none;padding-top:0;"><div class="qs" style="font-size:14px;">'+qHtml+'</div>'+opts+exp+'</div>'+
      (pick!=null?'<div style="margin-top:12px;"><button class="btn pri" style="padding:9px 18px;" onclick="drillNext()">'+
        (DR.i+1>=total?'看结果':'下一题 →')+'</button>'+
        '<button class="btn" style="margin-left:8px;padding:9px 16px;" onclick="drillNew(10)">换一轮</button></div>':'')+
      '<div style="margin-top:12px;font-size:11.8px;color:var(--ink-4);line-height:1.8;">'+
      '题型三种轮着来：句中选词（从你解锁的文章里取真实句子）、词→义、义→词。'+
      '答错不要紧，词会再出现在后面的轮次里。</div></div>';

  for(let i=1;i<=TOTAL;i++){
    const dt=addDays(S.start,i-1);
    const n=dayDone(dt);
    const tot=tasksOf(weekOf(dt),i).length;
    let cls='';
    if(n>=tot) cls='d4'; else if(n>=Math.ceil(tot*0.6)) cls='d3'; else if(n>=1) cls='d2';
    if(n===0&&S.days[dt]&&S.days[dt].sent) cls='d1';
    cells+='<div class="'+cls+(i===Math.min(d,TOTAL)?' now':'')+'" title="'+dt+' · 完成 '+n+'/'+tasksOf(weekOf(dt),i).length+'">'+i+'</div>';
  }
  const ws=wordStats();
  let streak=0;
  for(let i=Math.min(d,TOTAL);i>=1;i--){
    const dt=addDays(S.start,i-1);
    if(dayDone(dt)>0) streak++; else break;
  }
  const totalDone=Object.keys(S.days).filter(k=>dayDone(k)>0).length;

  let exams='';
  S.exams.forEach((e,i)=>{
    exams+='<tr><td>'+esc(e.date)+'</td><td class="c">'+e.score+'</td><td class="c">'+
      (e.score>=60?'<span class="pill ok">过线</span>':'<span class="pill warn">未过</span>')+'</td>'+
      '<td class="c"><span style="color:#a8324a;cursor:pointer;font-size:12px;" onclick="delExam('+i+')">删除</span></td></tr>';
  });

  let miles='';
  WEEKS.forEach(w=>{
    if(w.w!==2&&w.w!==4&&w.w!==6&&w.w!==8) return;
    const on=!!S.mile[w.w];
    miles+='<div class="task '+(on?'done':'')+'" onclick="toggleMile('+w.w+')">'+
      '<div class="box">'+(on?'✓':'')+'</div>'+
      '<div class="tx">第 '+w.w+' 周末：'+esc(w.check)+'</div></div>';
  });

  return '<div class="vhead"><h1>进度</h1></div>'+
    '<div class="row3" style="margin-bottom:14px;">'+
      '<div class="stat"><div class="k">连续打卡</div><div class="v">'+streak+'<em>天</em></div></div>'+
      '<div class="stat"><div class="k">累计学习</div><div class="v">'+totalDone+'<em>天</em></div></div>'+
      '<div class="stat"><div class="k">已练句子</div><div class="v">'+S.sentences.length+'<em>句</em></div></div>'+
    '</div>'+
    '<div class="card"><h3>'+TOTAL+' 天打卡 <span class="sub">颜色越深＝当天完成度越高，橙框是今天</span></h3><div class="cal">'+cells+'</div></div>'+
    '<div class="card"><h3>词库掌握情况</h3>'+
      '<div class="row3">'+
      '<div class="stat" style="border:0;padding:0;"><div class="k">未学</div><div class="v" style="font-size:17px;">'+ws.fresh+'</div></div>'+
      '<div class="stat" style="border:0;padding:0;"><div class="k">学习中</div><div class="v" style="font-size:17px;">'+ws.learning+'</div></div>'+
      '<div class="stat" style="border:0;padding:0;"><div class="k">已掌握</div><div class="v" style="font-size:17px;">'+ws.mastered+'</div></div>'+
      '</div>'+
      '<div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);">'+
      '<div style="font-size:12px;color:var(--ink-3);margin-bottom:8px;"><b>词库维护</b></div>'+
      importBox()+'</div></div>'+
    (function(){
      const w=weakStat();
      const names={read:'每日一读',drill:'快练',cloze:'完形',exam:'整卷实战'};
      const src=Object.keys(w.by).map(function(k){ return (names[k]||k)+' '+(w.by[k]||0); }).join(' · ');
      const top=w.words.slice(0,12).map(function(k){
        return '<span style="display:inline-block;margin:0 8px 6px 0;padding:3px 8px;background:var(--amber-2);color:var(--amber);border-radius:6px;font-size:12px;">'+
          esc(k)+' ×'+(S.weak.words[k]||0)+'</span>';
      }).join('');
      return '<div class="card"><h3>练习回炉 <span class="sub">错题自动写回背词队列</span></h3>'+
        '<div class="row3">'+
          '<div class="stat" style="border:0;padding:0;"><div class="k">今天回炉</div><div class="v" style="font-size:17px;">'+w.today+'</div></div>'+
          '<div class="stat" style="border:0;padding:0;"><div class="k">累计回炉</div><div class="v" style="font-size:17px;">'+w.total+'</div></div>'+
          '<div class="stat" style="border:0;padding:0;"><div class="k">涉及词</div><div class="v" style="font-size:17px;">'+w.words.length+'</div></div>'+
        '</div>'+
        '<div style="font-size:12.3px;color:var(--ink-3);line-height:1.8;margin-top:10px;">'+
          '在阅读、快练、完形或整卷实战里答错 → 该题关联的词 <b>hard+1、box 降一档、due 拉回今天</b>，'+
          '第二天背词队列自动再考。这样"卡片上认得、句子里认不出"的词会被抓回来。'+
          (src?'<br>来源：'+esc(src):'')+(top?'<div style="margin-top:9px;">'+top+'</div>':'')+
        '</div></div>';
    })()+
    planMap()+
    (function(){
      let all=0, full=0, qs=0, ok=0;
      RDG.forEach(function(R){
        const r=recOf(R);
        if(r&&Object.keys(r.a).length){ all++; qs+=R.q.length; ok+=(r.n||0); if((r.n||0)>=R.q.length) full++; }
      });
      return '<div class="card"><h3>每日一读 <span class="sub">'+all+' / '+RDG.length+' 篇做过 · 全对 '+full+' 篇</span></h3>'+
        (qs?'<div class="bar" style="margin-bottom:9px;"><i style="width:'+Math.round(full/RDG.length*100)+'%;background:#4f9d6b;"></i></div>'+
          '<div style="font-size:12.2px;color:var(--ink-3);line-height:1.8;">累计答题 '+qs+' 道，答对 '+ok+' 道（'+Math.round(ok/Math.max(1,qs)*100)+'%）。'+
          '低于 85% 的词去背词页加练；没做过的篇目随时可以补，翻页在阅读页底部。</div>'
        :'<div style="font-size:12.4px;color:var(--ink-4);line-height:1.8;">还没读过。左侧导航第二项「每日一读」，或「今日」页任务卡下方的蓝色卡片——学完当天的词就读一篇，检验"看到词能不能反应出意思"。</div>')+
        '</div>';
    })()+
    '<div class="card"><h3>里程碑自检</h3>'+miles+'</div>'+
    '<div class="card"><h3>模考记录</h3>'+
      '<div style="display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">'+
        '<input type="text" id="exdate" placeholder="日期，如 2027-03-01" style="width:170px;">'+
        '<input type="text" id="exscore" placeholder="分数" style="width:90px;">'+
        '<button class="btn sm pri" onclick="addExam()">记一笔</button></div>'+
      (S.exams.length?'<table><thead><tr><th>日期</th><th class="c">分数</th><th class="c">结果</th><th class="c"></th></tr></thead><tbody>'+exams+'</tbody></table>'
        :'<div style="font-size:12.8px;color:var(--ink-4);">还没有模考记录</div>')+
    '</div>'+
    '<div class="card"><h3>计划起始日</h3>'+
      '<div style="display:flex;gap:9px;align-items:center;">'+
      '<input type="text" id="startd" value="'+esc(S.start)+'" style="width:150px;">'+
      '<button class="btn sm" onclick="setStart()">更新</button>'+
      '<span style="font-size:12px;color:var(--ink-4);">格式 2026-11-13。改它会重算天数，打卡记录保留。</span></div></div>'+
    '<div class="card" style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">'+
      '<b style="font-size:13.5px;">考前速查</b>'+
      '<button class="btn" style="padding:6px 14px;" onclick="go(\'ref\')">打开</button></div>';
}
function toggleMile(w){S.mile[w]=S.mile[w]?0:1; save(); render();}
function addExam(){
  const d=document.getElementById('exdate').value.trim()||todayISO();
  const s=parseFloat(document.getElementById('exscore').value);
  if(isNaN(s)){alert('填个分数');return;}
  S.exams.push({date:d,score:s}); save(); render();
}
function delExam(i){S.exams.splice(i,1); save(); render();}
function setStart(){
  const v=document.getElementById('startd').value.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){alert('格式要像 2026-11-13');return;}
  S.start=v; save(); render();
}

/* ---- 8 周地图（并进进度页） ---- */
function planMap(){
  let rows='';
  WEEKS.forEach(w=>{
    const on=w.w===weekNum();
    rows+='<tr'+(on?' style="background:#eaf1fa;"':'')+'>'+
      '<td class="c nw">'+w.w+'</td>'+
      '<td>'+esc(w.theme)+'</td>'+
      '<td class="c">'+w.words+'</td>'+
      '<td>'+esc(w.check)+'</td></tr>';
  });
  return '<div class="card"><h3>'+WK+' 周地图 <span class="sub">第 '+weekNum()+' 周（共 '+TOTAL+' 天）</span></h3>'+
    '<table><thead><tr><th class="c">周</th><th>这一周只攻一个主题</th><th class="c">累计词量</th><th>周末验收</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div style="margin-top:12px;font-size:12px;color:var(--ink-4);">第 1–6 周每天 '+TASKS.reduce((a,t)=>a+t.m,0)+' 分钟：'+TASKS.map(t=>t.m+'′ '+t.n.replace(/（.*?）/g,'')).join('　')+'</div>'+
    '<div style="margin-top:6px;font-size:12px;color:var(--ink-4);">第 7–8 周每天 '+TASKS_END.reduce((a,t)=>a+t.m,0)+' 分钟：'+TASKS_END.map(t=>t.m+'′ '+t.n.replace(/（.*?）/g,'')).join('　')+'</div></div>';
}

/* ---- 速查 ---- */
function viewRef(){
  return '<div class="vhead"><h1>速查</h1></div>'+

  '<div class="card"><h3>整卷结构 <span class="sub">100 分 · 90 分钟 · 54 题</span></h3>'+
    '<table><thead><tr><th>部分</th><th class="c">题量</th><th class="c">每题</th><th class="c">小计</th><th class="c">限时</th></tr></thead><tbody>'+
    '<tr><td>Ⅰ 词汇和语法</td><td class="c">20</td><td class="c">1.5</td><td class="c">30</td><td class="c">20′</td></tr>'+
    '<tr><td>Ⅱ 完形填空</td><td class="c">20</td><td class="c">1</td><td class="c">20</td><td class="c">15′</td></tr>'+
    '<tr><td>Ⅲ 阅读理解</td><td class="c">8</td><td class="c">2.5</td><td class="c">20</td><td class="c">20′</td></tr>'+
    '<tr><td>Ⅳ 句子汉译英</td><td class="c">5</td><td class="c">3</td><td class="c">15</td><td class="c">15′</td></tr>'+
    '<tr><td>Ⅴ 短文写作</td><td class="c">1</td><td class="c">15</td><td class="c">15</td><td class="c">20′</td></tr>'+
    '</tbody></table>'+
    '<div style="margin-top:10px;font-size:12px;color:var(--ink-4);">阅读 2 篇共约 650 词，8 题每题 2.5 分——全卷单题最值钱，一题顶词汇题一题半。作文不低于 120 词。</div></div>'+

  '<div class="card"><h3>阅读四题型：动作与限时 <span class="sub">占比为历年经验值，非官方公布</span></h3>'+
    '<table><thead><tr><th>题型</th><th class="c">占比</th><th>动作</th><th class="c">限时</th></tr></thead><tbody>'+
    '<tr><td>细节题</td><td class="c">60%</td><td>圈题干里的大写词、数字、人名，回原文定位，答案通常是同义替换</td><td class="c">40 秒</td></tr>'+
    '<tr><td>词义句意题</td><td class="c">10%</td><td>只看该词前后一句，找并列(and/or)、转折(but)、解释(that is)</td><td class="c">30 秒</td></tr>'+
    '<tr><td>推理题</td><td class="c">20%</td><td>定位到段落，只做一步推理；要想两步的选项基本是错的</td><td class="c">60 秒</td></tr>'+
    '<tr><td>主旨题</td><td class="c">10%</td><td>只读首段末句 + 各段首句，看重复出现的词</td><td class="c">40 秒</td></tr>'+
    '</tbody></table></div>'+

  '<div class="card"><h3>干扰项四特征</h3><ul class="tight">'+
    '<li><b>偷换概念</b>：原文说 students，选项说 teachers</li>'+
    '<li><b>以偏概全</b>：原文说 some，选项说 all</li>'+
    '<li><b>过度推断</b>：选项比原文多走了一步</li>'+
    '<li><b>正反混淆</b>：把 support 说成 oppose</li>'+
    '<li>选项里出现 <span style="font-family:Georgia,serif;">always / never / all / only / must</span> 这类绝对词时要特别警惕——原文只说 some 就选 all，几乎必错</li>'+
  '</ul></div>'+

  '<div class="card"><h3>中英差异四条</h3><ul class="tight">'+
    '<li><b>修饰语位置相反</b>：the man who lives next door → 住在隔壁的那个人</li>'+
    '<li><b>英语必须有主语</b>：中文无主句要补 we / people，或改被动</li>'+
    '<li><b>英语靠从句，中文靠短句</b>：一个长句拆成 2–3 个中文短句</li>'+
    '<li><b>英语多名词，中文多动词</b>：the improvement of → 改善</li>'+
  '</ul></div>'+

  '<div class="card"><h3>汉译英保命六句</h3><ul class="tight" style="font-family:Georgia,serif;">'+
    '<li>With the development of…</li>'+
    '<li>It is said / reported that…</li>'+
    '<li>Only in this way can we…</li>'+
    '<li>We should take effective measures to…</li>'+
    '<li>play an important role in…</li>'+
    '<li>be beneficial to / be harmful to…</li>'+
  '</ul></div>'+

  '<div class="card"><h3>语法最高频三块</h3><ul class="tight">'+
    '<li><b>非谓语</b>：to do 表目的；介词后必用 doing；doing 表主动进行、done 表被动完成</li>'+
    '<li><b>从句</b>：that 不作成分无词义、what 作成分；定语从句看先行词，状语从句看逻辑</li>'+
    '<li><b>虚拟</b>：if + had done, would have done；suggest / demand / insist + (should) do</li>'+
  '</ul></div>'+

  '<div class="note warn"><b>60 分怎么凑（按"对几题"算）：</b>词汇语法 30 分拿 18（20 题对 12）· 完形 20 分拿 11（20 题对 11）· 阅读 20 分拿 12.5（8 题对 5）· 汉译英 15 分拿 8（5 句里 2 句半写对）· 写作 15 分拿 10 —— 合计 59.5，差的那半分靠阅读多对一题补齐。翻译和作文只要不空着，这 15 分里保底 4 分。</div>';
}

/* =========================================================
   路由与启动
   ========================================================= */
function go(v,keepRdg){
  view=v;
  if(v==='read'&&!keepRdg) RDGV=null;   /* 导航进入=回今日推荐；openRead 传 keepRdg 保留指定篇目 */
  if(v==='vocab'&&!ses.active) startSession();
  if(v==='learn') LV=null;
  render(); window.scrollTo(0,0);
}
function go_(v){go(v);}
window.say=say; window.answer=answer; window.go=go; window.flip=flip; window.grade=grade; window.again=again; window.addMemo=addMemo; window.delMemo=delMemo;
window.openLesson=openLesson; window.startQuiz=startQuiz; window.startReview=startReview; window.quizPick=quizPick; window.quizNext=quizNext; window.exitLesson=exitLesson;
window.studyFam=studyFam;
window.toggleTask=toggleTask; window.toggleErr=toggleErr;
window.beginOwn=beginOwn; window.submitOwn=submitOwn; window.saveOwn=saveOwn; window.cancelOwn=cancelOwn;
window.setFilter=setFilter; window.toggleMile=toggleMile; window.addExam=addExam; window.delExam=delExam;
window.setStart=setStart; window.doImport=doImport; window.clearAll=clearAll;
window.saveWF=saveWF; window.saveWD=saveWD; window.toggleChk=toggleChk; window.readAns=readAns; window.openRead=openRead;

document.getElementById('nav').addEventListener('click',function(e){
  const b=e.target.closest('button');
  if(!b) return;
  go(b.getAttribute('data-v'));
});

initState();
render();
</script>
