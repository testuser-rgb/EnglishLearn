/* 第 1 句取当周课本里的长难句（和这周语法点对应），第 2 句取一个阅读例句。
   两句都按天往后轮，一周之内不重样，同一句隔周还会再撞上。 */
/* 今日输出的题源三条线：
   ① 当周长难句（贴本周语法点，来自 SENTS）
   ② 今天刚背的 C/B 层词（来自 SQ，复用词优先）
   ③ 今天回炉的 C/B 层旧词（来自 SQ）
   另加 1 句仿写（IMIT）。共 8 句。 */
function lcg(seed){ let s=seed%2147483647; if(s<=0) s+=2147483646;
  return function(){ s=s*16807%2147483647; return (s-1)/2147483646; }; }
function pickBySeed(pool,n,seed,used){
  const rnd=lcg(seed*7919+13), arr=pool.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  const out=[];
  for(const x of arr){ if(out.length>=n) break; if(!used.has(x[0])){ out.push(x); used.add(x[0]); } }
  return out;
}
function listOf(box){ const t=todayISO(); return (box&&box.d===t)?box.list:[]; }
function recentWords(days){
  const t=todayISO(), out=[];
  WORDS.forEach(w=>{
    const st=S.words[w[0]];
    if(st&&st.seen&&st.last&&diffDays(st.last,t)<=days) out.push(w);
  });
  return out;
}
function sqWordsOf(words){
  const arr=words.filter(w=>SQIDX[w[0]]);
  arr.sort((a,b)=>{ const ra=(a[3]==='C'?0:(a[3]==='B'?1:9)), rb=(b[3]==='C'?0:(b[3]==='B'?1:9)); return ra-rb; });
  return arr;
}
function sqItem(tag,w){ const it=SQIDX[w[0]]; return {tag:tag,zh:it[1],en:it[2],pt:it[3]}; }
function todayOut(){
  const d=Math.max(0,dayNum()-1), wk=weekNum(), seed=dayNum();
  const items=[], used=new Set();
  /* ① 2 句当周长难句 */
  const ss=SENTS.filter(x=>x.zh&&x.en);
  const weekArr=ss.slice((wk-1)*4, wk*4);
  const carr=weekArr.length?weekArr:ss;
  [0,1].forEach(off=>{
    const s=carr[(d+off)%carr.length];
    if(s) items.push({tag:'课程句',zh:s.zh,en:s.en,pt:s.pt||''});
  });
  /* ② 3 句今天新学的词（今天还没背词时，退回最近 3 天学过的词） */
  const nnList=listOf(S.tn);
  const nn=sqWordsOf(WORDS.filter(w=>nnList.indexOf(w[0])>=0)).map(w=>({w:w,tag:'今天新词'}))
    .concat(sqWordsOf(recentWords(3).filter(w=>nnList.indexOf(w[0])<0)).map(w=>({w:w,tag:'最近学过'})));
  nn.filter(x=>!used.has(x.w[0])).slice(0,3).forEach(x=>{ items.push(sqItem(x.tag,x.w)); used.add(x.w[0]); });
  /* ③ 2 句今天回炉的旧词（没有到期词时，退回最近 7 天碰过的词） */
  const rrList=listOf(S.tr);
  const rr=sqWordsOf(WORDS.filter(w=>rrList.indexOf(w[0])>=0)).map(w=>({w:w,tag:'今天复习'}))
    .concat(sqWordsOf(recentWords(7).filter(w=>rrList.indexOf(w[0])<0)).map(w=>({w:w,tag:'最近学过'})));
  rr.filter(x=>!used.has(x.w[0])).slice(0,2).forEach(x=>{ items.push(sqItem(x.tag,x.w)); used.add(x.w[0]); });
  /* 不足的用题库补（按日固定抽样，当天不变、隔天换） */
  const need=7-items.length;
  if(need>0){
    const pool=SQ.filter(x=>!used.has(x[0]));
    pickBySeed(pool,need,seed,used).forEach(x=>{
      items.push({tag:'加练',zh:x[1],en:x[2],pt:x[3]});
    });
  }
  /* ④ 1 句仿写 */
  const imArr=IMIT.filter(x=>x.w===wk);
  const im=imArr.length?imArr[d%imArr.length]:IMIT[IMIT.length-1];
  items.push({tag:'仿写 · '+im.pat,zh:im.zh,en:im.ref,pt:''});
  return {items:items,im:im};
}

They chose the third and signed the contract. The plan included one condition: every individual team had to report its use of power each month. A year later the company used a third less power, and the numbers indicate that the fall was not an accident. The result was consistent with the plan.

The manager keeps the first report as a reference. It reminds him that the cleanest energy is the energy you never use.`,

{d:2,k:'d2-4',t:'The Bottle Bank',
 zh:'小镇哈洛有两个问题：街上塞满汽车，河里被小厂的废水污染，预算又有限。一群学生提了个简单实验：在广场放十个大箱子，请大家回收瓶子和纸。第一个月失败了——箱子里全是垃圾；第二个月加了块牌子、在本地报纸上写了封短信，情况才好起来。到冬天收了四十吨玻璃，卖废品的收入买了两辆新公交，市中心的汽车少了，小厂被要求净化排水，鱼回来了。教训不在钱：在这个语境里，是习惯——箱子近、规矩清楚，人就愿意分类。',
 p:`In 2019 the town of Harlow had a problem. Its streets were congested with cars, and its river was contaminated by waste from a small factory. The council had a limited budget and no clear answer.

A student group offered a simple experiment. They put ten large boxes in the main square and asked people to recycle bottles and paper. The first month was a failure: the boxes were full of rubbish. The second month was better: the plan included a sign and a short letter in the local paper, and the number of boxes increased from ten to twenty. By winter the work involved two hundred families.

By winter the town had collected forty tonnes of glass. The revenue from selling it paid for two new buses, which reduced the number of cars in the centre. The factory had to register every litre of water it released, and the fish came back. The result was consistent with the group's report: less waste, fewer cars, cleaner water.

The lesson was not about money. In this context, it was about a habit: people recycle when the box is close and the rule is clear.`,
 w:['congest','contaminate','recycle','revenue','context','increase','include','involve','register','consistent','result'],
 q:[
  {s:"What two problems did Harlow have?",o:["Congested streets and a contaminated river","Too many schools and too few teachers","High taxes and empty shops","A dry river and no buses"],a:0,e:"Its streets were congested with cars, and its river was contaminated by waste——街上塞车、河里被污染。"},
  {s:"Why did the first month fail?",o:["The boxes were full of rubbish","People refused to take part","The boxes were stolen","The council stopped the plan"],a:0,e:"The first month was a failure: the boxes were full of rubbish——箱子里全是垃圾。"},
  {s:"What did the town do with the money from the glass?",o:["It paid for two new buses","It built a new factory","It lowered the price of water","It bought more boxes"],a:0,e:"The revenue from selling it paid for two new buses——卖玻璃的收入买了两辆公交。"}
 ,{s:"What can be inferred from the Harlow experiment?",o:["People recycle when it is easy and clear", "Expensive equipment is the key to recycling", "Factories cannot be cleaned up", "Newspapers waste money"],a:0,e:"末段直接说 people recycle when the box is close and the rule is clear——箱子近、规矩清楚，人就愿意分类。B、C 与文意相反，D 无据。"}]},
{d:3,k:'d3-3',t:'Learning a Skill',
 zh:'没人天生会游泳。学游泳和学语言一样：开始很差，然后没那么差，最后不用想就会。书上的知识有用，但技能住在身体里，身体需要练。好老师做三件事：注意学生已经做得好的地方（信心也是课的一部分）、一次只训练一个小环节（呼吸、手臂、转身）、给一个说真话的测试而不是让人舒服的测试。期末考不是目的——因为考试压力，很多学生学一周、一个月就忘；而训练过的游泳者一辈子都会。重视练习，别重视那张纸。',
 p:`Nobody is born knowing how to swim. You learn it the way you learn a language: badly at first, then less badly, and finally without thinking. The knowledge in a book can help, but the skill lives in the body, and the body needs practice.

A good teacher does three things. First, she pays attention to what the student already does well, because confidence is part of the lesson. Second, she trains one small part at a time: the breath, then the arm, then the turn. Third, she gives a test that shows the truth, not a test that makes the student feel good.

The exam at the end is not the point. Due to the pressure of exams, many students study for a week and forget in a month, and the fear can affect the result. A trained swimmer, by contrast, keeps the skill for life.

Attach importance to the practice, not to the paper. That is the whole method.`,
 w:['learn','knowledge','skill','teach','train','pay attention to','exam','due to','study','affect'],
 q:[
  {s:"According to the writer, where does a skill live?",o:["In the body, which needs practice","In a good book","In the exam paper","In the teacher's notes"],a:0,e:"the skill lives in the body, and the body needs practice——技能住在身体里，身体需要练。"},
  {s:"What is the second thing a good teacher does?",o:["She trains one small part at a time","She gives a long exam every week","She teaches the whole skill in one day","She compares students with each other"],a:0,e:"she trains one small part at a time: the breath, then the arm, then the turn——一次只练一个小环节。"},
  {s:"What happens to many students because of exam pressure?",o:["They study for a week and forget in a month","They swim better than trained people","They stop reading books","They teach themselves"],a:0,e:"Due to the pressure of exams, many students study for a week and forget in a month——为考试学一周，一个月就忘。"}
 ,{s:"What is the main idea of the passage?",o:["Exams are useless for students", "Skills are built by practice, not by papers", "Swimming is the best skill to learn", "Good teachers talk a lot"],a:1,e:"全文用学游泳类比学语言，落点是末句 Attach importance to the practice, not to the paper。A 过度引申（考试不是目的≠无用），C、D 以偏概全。"}]},
{d:3,k:'d3-4',t:'The Refund',
 zh:'老市场里的小店卖家用小机器。去年春天它推出新款咖啡机，在本地报纸上做广告，价格不低但不算离谱，还承诺一年内坏了可以退款。半年后一位顾客回来了：机器停了，修一次的价钱超过买新的。店主没有把这种情况排除在外，开箱、看日期、退钱。朋友问为什么，他说：被尊重的顾客会回来，被骗的顾客会告诉十个人。店里只限制一件事：不外销到别的国家，因为那里的零件很难回收——这条印在盒子上。尊重小规矩，大规矩自然有人管。',
 p:`A shop in the old market sells small machines for the home. Last spring it released a new coffee maker and advertised it in the local paper. The price was high but not unreasonable, and the shop offered a refund if the machine broke within a year.

Six months later a customer came back. The machine had stopped, and the repair would exceed the price of a new one. The shop did not exclude this case: the manager opened the box, checked the date and gave the money back.

'Why?' asked a friend. 'Because a customer who is respected will return, and a customer who is cheated will tell ten people.'

The shop also restricts one thing: it will not export the machine to another country, because the parts are hard to recover there. That rule is printed on the box, and the manager can relax about it.

Respect the small rules, and the big ones take care of themselves.`,
 w:['release','refund','exceed','exclude','respect','restrict','export','recover','relax'],
 q:[
  {s:"What did the shop promise when it sold the coffee maker?",o:["A refund if the machine broke within a year","Free coffee for a month","A repair every six months","A lower price next spring"],a:0,e:"the shop offered a refund if the machine broke within a year——一年内坏了可退款。"},
  {s:"Why did the shop give the money back?",o:["The repair would cost more than a new machine","The customer was a friend","The machine was never used","The law forced the shop to do it"],a:0,e:"the repair would exceed the price of a new one… The shop did not exclude this case——修比买贵，而且店里没把这种情况排除在外。"},
  {s:"What is the one thing the shop restricts?",o:["It will not export the machine to another country","It will not sell to local people","It will not repair old machines","It will not advertise in the paper"],a:0,e:"it will not export the machine to another country, because the parts are hard to recover there——不外销，因为零件难回收。"}
 ,{s:"What does the shop owner believe?",o:["Respecting customers brings them back", "Cheap machines sell better", "Rules only matter for big shops", "Advertisements are useless"],a:0,e:"他说被尊重的顾客会回来，被骗的顾客会告诉十个人——这正是他退款的理由。B、C、D 均无据。"}]},
{d:48,k:'d48-1',t:'The Debt Students Never Repay',
 zh:'学生把睡眠当成可以借的债：周二熬夜写论文，指望周末还上，却不知道利息算在记忆上。实验证明睡过的那组第二天多记住约五分之一；补觉只能补情绪和反应，补不回学习当晚的记忆归档；咖啡只是遮住疲劳。真正有效的方法很枯燥：固定作息、睡前少看屏幕、房间凉而暗。睡眠不是懒，是学习的一部分。',
 p:`Most students treat sleep as a loan. They borrow two hours on Tuesday to finish an essay, plan to pay it back at the weekend, and forget that the interest is charged to their memory. A week of five-hour nights does not simply make a student tired; it affects what the brain is able to keep.

The evidence comes from experiments that are almost cruel in their simplicity. In one, students learn a list of words in the evening. Half of them sleep for eight hours; the other half stay awake until morning. Both groups are tested the next day. The sleepers remember about a fifth more on average, and the gap is significant for the words that carry meaning rather than sound. Sleep, it seems, is when the day is filed.

Can the debt be repaid later? Only partly. A long Saturday morning restores mood and improves reaction time, but the deeper work of storing what was learned depends on the night after learning, and that night cannot be replaced. Caffeine makes the problem worse, because it reduces the feeling of fatigue without restoring the ability to react. A student who drinks coffee at midnight feels awake and remembers less.

What doctors recommend is dull. Go to bed and get up at the same time, including at the weekend, so that the body knows when to expect rest. Limit screens for the last hour, because light delays the signal that sleep is coming. Keep the room cool and dark. A fixed routine beats a heroic weekend. None of this is a technique, and none of it can be bought.

The habit is hard to change because the culture rewards the wrong thing. A student who sleeps eight hours is often seen as less serious than one who works until three in the morning. But the evidence is clear: sleep is not a luxury that weak students need and strong students can skip. It is a health question, not a moral one, and the mental cost of ignoring it is paid in the exam hall.`,
 w:['student','sleep','memory','affect','evidence','experiment','average','significant','improve','depend','caffeine','reduce','fatigue','react','recommend','limit','routine','habit','health','mental'],
 q:[
  {s:"What does the word experiment in paragraph 2 show?",o:["Sleeping after learning helps memory","Students learn faster in the evening","Coffee improves test scores","Eight hours of sleep is always enough"],a:0,e:"两组人晚上学同一份词表，一组睡八小时一组不睡，第二天 sleepers remember about a fifth more on average——睡过的那组记得更多。"},
  {s:"Why can the debt not be fully repaid at the weekend?",o:["Because memory work happens on the night after learning","Because students forget the words by Saturday morning","Because coffee makes people sleep for fewer hours","Because weekends are too short for a full review"],a:0,e:"the deeper work of storing what was learned depends on the night after learning, and that night cannot be replaced——归档发生在学习当晚，过了就补不回来。"},
  {s:"What does caffeine do, according to the writer?",o:["It hides fatigue without restoring performance","It improves memory during the night","It helps students fall asleep faster","It replaces the need for sleep"],a:0,e:"it reduces the feeling of fatigue without restoring performance——遮住疲劳感，但没把状态还给你。"},
  {s:"What is the writer's attitude towards sleep advice?",o:["It is simple but effective","It is too expensive for students","It only works for weak students","It has been proved wrong"],a:0,e:"What doctors recommend is dull … A fixed routine beats a heroic weekend——方法很枯燥，但有效。"}
 ,{s:"What is the passage mainly about?",o:["Sleep is part of learning, not a debt to borrow from", "Coffee can repay a sleep debt quickly", "Weekend sleep fully repairs memory", "Serious students should sleep less"],a:0,e:"全文：睡眠债的利息算在记忆上，补觉补不回学习当晚的归档——睡眠是学习的一部分。B 与 caffeine 只遮住疲劳相反；C 与补不回归档相反；D 与文化奖励了错误的事相反。"}]},
{d:50,k:'d50-1',t:'The Village That Shared Its Water',
 zh:'干旱季节，山上的农户有充分理由把水全抽走，四十年他们确实这么干。后来村里定了一条工程师不会设计的规矩：生活用水不限，浇地用水轮流，由七人议事会每天早上定顺序。经济学家会说这必然失败，但他们忽略了同村人每天见面、名声比一季的水更值钱。这套办法不完美，穷人声音小、旱年破过两次例；可比起二十公里外人人有泵却无规矩的镇子，这里的水位还在。技术能计量，泵能输水，但“谁该得水”是政治决定，只能由明天还要见面的人来做。',
 p:`In the dry season, the wells of Rampur run low, and the farmers who own the land at the top of the hill have every reason to take what they can. For forty years they did. Then the community wrote a policy that no engineer would have designed, and the wells have not run dry since. Agriculture uses more water than all the households together, so the rule that matters is the rule about crops.

The rule is simple: every household has free access to the well for its own use, without limit, but the supply for crops is shared. The amount is set each morning by a council of seven, half of them women, and the gate that controls the channel is opened for one section at a time. A farmer who breaks the order loses his turn for a week. There is no police, and no one remembers the last fine.

Economists might call this a common-pool resource problem, and they would expect it to fail. The theory says that each farmer has an interest in taking more than his share, so the resource should be used up. What the theory misses is that the same farmers meet every morning, and that a reputation for cheating is worth less than a field that gets water next week. They cooperate because they will meet again tomorrow.

How water is distributed is not perfect. The poorest families, who own no land, have little voice in the council, and in a drought year the rule has twice been broken. But compare the village with the town twenty kilometres away, where every farmer has a pump and no one has a rule: the water table there has fallen by ten metres, and the small farms have been sold.

Modern technology can measure every litre, and a more efficient pump can move it faster, but neither can decide who should get it. That decision is political, and it is usually made locally, by people who will pay the cost of a bad choice themselves. The village did not solve the problem of scarcity. It solved the problem of trust, which is the part that no pipe can carry. A tradition of sharing is never imported; it is built slowly by people who expect to meet again.`,
 w:['community','policy','household','limit','supply','crop','resource','theory','cooperate','distribute','drought','technology','efficient','cost','scarcity','tradition','agriculture','access'],

  {s:"What happened in the town twenty kilometres away?",o:["The water table fell and small farms were sold","The farmers wrote a better rule than the council","The wells became deeper every year after that","Everyone switched to pumps and prospered for a time"],a:0,e:"the water table there has fallen by ten metres, and the small farms have been sold——有泵没规矩，水位掉了十米，小农场被卖掉。"},
  {s:"What does the writer say technology cannot do?",o:["Decide who should get the water","Measure how much water is used","Move water from one place to another","Make a pump work faster"],a:0,e:"neither can decide who should get it. That decision is political——技术能计量能输水，但“谁该得水”是政治决定。"}
 ,{s:"What can we infer about the village rule?",o:["It works because villagers meet daily and value reputation", "It works because police watch the wells", "It was carefully designed by an engineer", "It has ended every argument about water"],a:0,e:"经济学家忽略了同村人每天见面、名声比一季的水更值钱——规则靠社会资本维持。B 与文中无需警察相反；C 与 no engineer would have designed 相反；D 与规则并不完美（穷人声音小、旱年破例）相反。"}]},
{d:52,k:'d52-1',t:'When a Machine Reads Your Interview',
 zh:'投简历的人太多，雇主用软件给候选人打分，已经不再是未来的故事。支持者说算法不会累、对每个人用同一把尺，能去掉面试官的主观。但记录并不乐观：用过去十年的录用数据训练，模型会学到“以前录什么样的人，以后就偏好什么样的人”，歧视不是写进代码的，是从现实里学来又带着数学的权威还给现实。分数很少被质疑，被拒的人问不出理由。稳妥的做法是既不封禁也不盲信：用机器筛选、人做最后决定、每年用人被拒的样本来检验模型。机器一秒能比一千份文件，但它不能被追责，而录用恰恰是个追责的决定。',
 p:`A candidate sends a video, an algorithm watches it, and a score decides whether a human ever sees the file. This is no longer a story about the future. Large employers receive far more applications than they can read, and software that ranks candidates is cheaper than a team of recruiters.

The promise is fairness. A person who conducts the tenth interview of the day is tired, may prefer someone who reminds him of himself, and cannot remember exactly why he refused the last candidate. An algorithm does not get tired and applies the same standard to every file. In theory it removes the subjective part of the decision.

The record is less encouraging. Several systems have been shown to learn the wrong lesson: trained on ten years of past hires, a model learns to favour the kind of person who was hired before. If most engineers in the data were men, the model treats a man's application as slightly better evidence of success. The bias is not written into the code; it is learned from the world, and then returned to it with the authority of mathematics.

Defenders answer that humans are biased too, and that a measured bias can at least be seen and corrected, while a human prejudice cannot. There is truth in this. But a score is rarely questioned. A candidate who is refused cannot ask why, because the reason is hidden in thousands of weights. The right to an explanation is lost at the moment the decision becomes automatic.

A sensible approach is neither to ban the tools nor to trust them. Use them to evaluate and sort, not to decide; keep a human in the last step; test the model every year on the people it rejected. Hire for what the job needs, not for what the past looked like. A machine can compare a thousand files in a second, but it cannot be held responsible, and responsibility is what a hiring decision finally is.`,
 w:['candidate','algorithm','application','employer','recruit','interview','standard','subjective','bias','prejudice','evidence','refuse','authority','automatic','data','evaluate','responsibility'],
 q:[
  {s:"Why do employers use software to rank candidates?",o:["There are far more applications than they can read","Software is more accurate than any human reader","The law requires it for public companies","Candidates prefer to be judged by machines"],a:0,e:"Large employers receive far more applications than they can read, and software … is cheaper than a team of recruiters——量大、便宜。"},
  {s:"How does a model become biased?",o:["It learns the pattern of past hires from the data","A programmer writes the bias into the code","Candidates give false information","The interview room is too small"],a:0,e:"trained on ten years of past hires, a model learns to favour the kind of person who was hired before… The bias is not written into the code——不是写进代码，是从数据里学来的。"},
  {s:"What does the writer see as the main loss?",o:["A refused candidate cannot ask why","Companies save too much money","Interviews take longer","Fewer people apply for jobs"],a:0,e:"A candidate who is refused cannot ask why… The right to an explanation is lost——被拒的人问不出理由，解释权丢了。"},
  {s:"What does the writer recommend?",o:["Use the tools to sort, but keep a human decision","Ban all hiring algorithms in public companies","Trust the score completely and hire the top ten","Let candidates score themselves before the interview"],a:0,e:"Use them to evaluate and sort, not to decide; keep a human in the last step——机器筛选、人做决定。"}
 ,{s:"What is the writer's attitude toward ranking software?",o:["Use it with limits and keep humans accountable", "Ban it immediately and completely", "Trust it fully because it is objective", "Leave the decision to the industry"],a:0,e:"A sensible approach is neither to ban the tools nor to trust them... keep a human in the last step——有节制地使用并保留人的责任。B、C 走极端；D 无据。"}]},
{d:54,k:'d54-1',t:'A Bottle That Outlives Its Owner',
 zh:'一个塑料瓶做出来三秒、喝完十分钟、消失要四百年——这个算术就是全部论点：我们生产的速度超过任何系统能吸收的速度。瓶子被丢下、冲进下水道、随河入海，被浪打成比指甲还小的碎片，鱼吃碎片、人吃鱼；对野生动物的伤害是直接的，对人的伤害不确定，所以容易被忽略。回收被当成答案，但只有一小部分真被回收，因为分拣贵、新料便宜。真正有效的是押金、薄袋禁令、要求包装可回收这类“把处理成本退回给制造者”的规矩，不需要改变人性，只需要改价格。',
 p:`A plastic bottle takes about three seconds to make, ten minutes to drink and four hundred years to disappear. That arithmetic is the whole argument. We produce the material faster than any system can absorb it, and every year a little more of it reaches the marine environment.

The path is easy to trace. A bottle bought on a hot street is dropped, washed into a drain, carried by a river and broken by waves into pieces smaller than a fingernail. Plastic pollution now reaches places that no ship can clean. Fish eat the pieces, and the fish are eaten. The harm to wildlife is direct: birds feed their young with bottle caps, and turtles mistake bags for food. The harm to people is less certain, which is exactly why it is easy to ignore.

Recycling was sold as the answer, and it is part of one. But only a small share of plastic is ever recycled, because sorting is expensive and new plastic is cheap. A town that collects bottles still has to find someone willing to buy them, and when the price of oil falls, the buyer disappears.

What works is duller and more political. A small tax on every bottle gives the person who picks it up a reason to do so; several countries now collect more than ninety percent of what they sell. A ban on thin bags costs shoppers almost nothing and reduces the material used for minutes that lasts for centuries. Regulations that require packaging to be recyclable push the cost back to the industry that chose the material.

Environmental groups have run a long campaign to raise awareness, and that has changed behaviour at the edges. But awareness alone cannot compete with a price. The measures that work require no change in human nature; they require a change in price, so that the cost of disposal is paid by the person who creates the waste rather than by the ocean. The bottle is not evil. The mistake is a system in which it is cheaper to throw something away than to keep it.`,
 w:['waste','dispose','recycle','harm','wildlife','ocean','marine','pollution','tax','ban','industry','cost','campaign','awareness','reduce','environmental','regulation'],

{d:46,k:'d46-3',t:'The Quiet Revolution in City Streets',
 zh:'城市噪音从“繁荣的标志”变成要治理的问题：调查显示交通噪音是居民最常抱怨的事，研究证明它影响睡眠、加重压力；巴塞罗那降速、柏林限制夜间卡车，几乎不花钱就见效；批评者说安静是富人特权，所以标准必须由城市统一设定；真正的难点是观念转变——把安静当成需要保护的公共品。',
 p:`Fifty years ago, a noisy street was a sign of a healthy economy. Today, many city residents are not so sure. A survey of 4,000 households in three cities found that traffic noise was the complaint people made most often, ahead of parking and rubbish.

The evidence that noise affects health is now hard to ignore. People who live beside a highway report more stress and sleep less. A study that monitored 1,200 residents for five years found that those on the noisiest streets were twenty percent more likely to report poor sleep. The link does not prove that noise is the only cause, but it is strong enough to change policy.

Some cities have taken measures that cost very little. Barcelona reduced the speed limit on main roads from fifty to thirty kilometres an hour; noise fell by a third and crashes by a quarter. Berlin restricted heavy trucks at night and cut the tax of shop owners who switch off their outdoor lights after ten. In both cases the economy did not collapse. Shops stayed open; deliveries simply moved to a different hour.

Critics argue that quiet is a luxury for rich neighbourhoods. There is some truth in this. A poor family on a main road cannot afford thick windows, and it is usually the cheapest housing that suffers most from noise. That is exactly why the standard should be set by the city, not left to each household.

The deeper challenge is a change of attitude. For a century, planners treated silence as empty space — something to be filled with roads, markets and machines. The new approach treats quiet as a public benefit, like clean water, which needs to be protected by rules and measured by facts. A city that monitors its noise is not against growth. It has simply learned that growth which damages the people who produce it is not worth having.`,
 w:['survey','household','complain','traffic','highway','evidence','affect','stress','monitor','link','policy','measure','reduce','restrict','economy','argue','challenge','approach','benefit','standard','suffer','resident','attitude'],
 q:[
  {s:"What did the survey of 4,000 households find?",o:["Traffic noise was the complaint people made most often","Parking was the biggest problem in the centre","Most residents wanted to move to a quieter road","Rubbish collection had improved since last year"],a:0,e:"原文 a survey … found that traffic noise was the complaint people made most often，后面紧跟 ahead of parking and rubbish——噪音排在停车和垃圾之前。"},

  {s:"Why does the writer mention thick windows?",o:["To show that quiet costs money and the poor suffer most","To recommend a product to the readers of the paper","To explain how noise is measured in a street","To prove that old houses are badly built"],a:0,e:"A poor family on a main road cannot afford thick windows, and it is usually the cheapest housing that suffers most from noise——安静要花钱，穷人受害最深。"},
  {s:"How does the new approach treat quiet?",o:["As a public benefit that needs protection","As empty space waiting to be filled","As a luxury only the rich deserve","As a sign of slow economic growth"],a:0,e:"The new approach treats quiet as a public benefit, like clean water, which needs to be protected by rules——把安静当成像干净水一样需要保护的公共品。"}
 ,{s:"What is the writer's attitude toward the new approach to noise?",o:["Supportive but aware of the real difficulty", "Sure that it will fail eventually", "Uninterested in the survey results", "Sure that silence is only for the rich"],a:0,e:"全文介绍降速、限行几乎不花钱就见效，同时承认真正的难点是观念转变——支持但清醒。B、D 与文意相反；C 与重视调查数据相反。"}]},
{d:46,k:'d46-4',t:'The True Price of a Cheap T-shirt',
 zh:'一件四美元 T 恤的账：规模、低工资、快节奏让低价成为可能；顾客只看到折扣，看不到染色用水、运输燃料和被丢弃的衣物；这不等于别买衣服，而是标签上的价格不是真实成本；一些品牌开始公开工厂、提供维修；真正的压力来自消费者、记者和法律，而不是行业自己。',
 p:`A T-shirt that costs four dollars is a small miracle of modern industry. It is also a puzzle: someone grew the cotton, spun the thread, cut and sewed the cloth, shipped it across an ocean and put it on a shelf — and still made a profit. How?

Part of the answer is scale. A single factory may produce forty thousand shirts a day, and a large brand can order a million at once. Part of it is the wage: the worker who sews the shirt may earn less in a day than the customer pays for a coffee. Part of it is speed. A trend that appears on a screen on Monday can be in the shops on Friday, and a design that fails is replaced before anyone notices.

The customer sees none of this. What the customer sees is a discount, and a discount feels like a gift. Advertising does not lie about the price; it simply refuses to mention the other costs — the water used to dye the cloth, the fuel burned to move it, the shirt that will be worn ten times and then thrown away. Every year the world disposes of millions of tonnes of clothing, and much of this waste ends in a landfill in a country that never wore it.

None of this means that buying clothes is wrong. It means that the price on the label is not the true cost. Some brands have begun to publish the names of their factories and to pay for repairs, which is a real change rather than an advertisement. Some customers now choose fewer, better shirts and keep them for years. Repair, which almost disappeared, is slowly returning.

The pressure for change rarely comes from the industry itself. It comes from consumers who ask questions, from journalists who visit factories, and from laws that give a company responsibility for what it produces. A cheap shirt is not a crime. But a market in which nobody pays for the damage is not really cheap: the bill is simply sent to someone else.`,
 w:['industry','profit','factory','brand','wage','customer','trend','discount','advertise','cost','dispose','waste','landfill','publish','pressure','consumer','responsibility','damage'],
 q:[
  {s:"Why can a four-dollar shirt still make a profit?",o:["Because of large scale, low wages and fast production","Because the cotton is given away free","Because the government pays part of the cost","Because customers never return a shirt"],a:0,e:"第二段三个 Part：scale（一次生产几十万件）、wage（缝衣工一天挣的比一杯咖啡少）、speed（周一流行周五上架）——三条合起来才压出低价。"},
  {s:"What does advertising leave out?",o:["The other costs behind the price","The size of the shirt","The name of the brand","The day the shirt goes on sale"],a:0,e:"it simply refuses to mention the other costs——广告不说价格背后的其他代价：染色用水、运输燃料、扔掉的衣服。"},
  {s:"What are some brands doing differently?",o:["Publishing their factory names and paying for repairs","Stopping all advertising for one year","Raising wages to the level of Western countries","Closing down all their factories in Asia"],a:0,e:"Some brands have begun to publish the names of their factories and to pay for repairs——公开工厂名单、为维修付费。"},
  {s:"What is the writer's main point?",o:["The price on the label is not the true cost","Cheap clothes should be completely banned","Consumers are always selfish","Repair is no longer possible today"],a:0,e:"the price on the label is not the true cost… the bill is simply sent to someone else——标签价不是真实成本，账单只是转给了别人。"}
 ,{s:"What is the passage mainly about?",o:["The price on the tag hides costs that consumers and laws must face", "Cheap T-shirts are always a crime", "Factories should raise wages by themselves", "Advertising decides everything in fashion"],a:0,e:"标题 The True Price 即主旨：标签价格不是真实成本，改变的压力来自消费者、记者和法律。B 与 A cheap shirt is not a crime 相反；C 与 pressure rarely comes from the industry itself 相反。"}]},
{d:1,k:'d1-1',t:"An Emergency by the River",zh:"暴雨冲坏了河岸，社区靠调研和分工渡过难关，事后人们反思并改进了防范。",w:["emergency","respond","erosion","elect","remind","research","resource","result","eliminate","replace","reflect","enormous","evolve","receive","accept","emotion"],
 p:`Last month our city had an emergency. Heavy rain caused serious erosion along the river, and several roads were closed. Our community had to respond quickly.
The local government elected a small team to lead the work. They reminded every family to store water and food, and they did a lot of research on what resource could still be used. The result was clear: volunteers were sent to eliminate the biggest danger first, and the oldest pipes were replaced with new ones.
After the rain, people began to reflect on what had gone wrong. Some said the city had an enormous problem — it had grown too fast. But others believed it could evolve and learn. Beside the river a new park was built, and besides that, students began to receive training on safety. Most people accepted the plan, and their emotion turned from fear into hope.`,
 q:[
  {s:"What did the team remind families to do?",o:["Leave the city at once","Store water and food","Repair the old pipes themselves","Close all the schools"],a:1,e:"第二段 They reminded every family to store water and food，直给细节题。"},
  {s:"The word \"eliminate\" in Paragraph 2 is closest in meaning to ______.",o:["add","remove","count","hide"],a:1,e:"eliminate＝消除、去掉，与 remove 同义。同义替换是阅读细节题的常见手法。"},
  {s:"What can we learn from the last paragraph?",o:["Nobody cared about the rain","People changed their attitude after the rain","The park was built before the rain","Students refused to receive training"],a:1,e:"末句 their emotion turned from fear into hope，态度变化。其余三项都与原文相反。"}
 ,{s:"What is the main idea of the passage?",o:["Heavy rain destroys roads every year", "A community handled an emergency and improved afterwards", "Students received books after the flood", "The city has grown too fast"],a:1,e:"文章结构是\"应急响应→事后反思→改进（新公园、学生行动）\"，中心是社区如何应对并进步；A、D 是细节，C 与主旨无关。"}]},
{d:1,k:'d1-2',t:"The Drill",zh:"学校为暴雨做应急预案：老师代表学生说话，演练发现楼梯太窄，于是改成两条路线，并每年更新一次。",w:["emergency","represent","research","result","remind","beside","besides","emerge","replace","eliminate","reflect","enormous","respond","evolve","receive","accept","emotion"],
 p:`Every school should have a plan for an emergency. Ours was written by a science teacher who wanted to represent the students, not only the staff. She asked us to research what a real flood does to a small town, and the result was a short list on the wall.

The plan has three steps. First, a monitor will remind every class to close the windows. Second, we walk to the hill beside the school — not through the gate, besides the gym, where the ground is higher. Third, the office will call the parents.

Last week we practised it. A new problem emerged at once: the stairs were too narrow for so many students. So we replaced the old route with two routes, and we decided to eliminate one step on the second floor, where the windows are already closed. After the drill we sat down to reflect on it. An enormous amount of time was lost at the door, and some students did not respond when their names were called.

The teacher said the plan would evolve every year, because a school that receives a good idea today will need a better one next year. I accepted that. In an emergency, an emotion is not enough; a habit is.`,
 q:[
  {s:"Why did the teacher write the plan?",o:["To close the school in very bad weather","To represent the students as well as the staff","To train a new monitor for each class","To sell the old building to the town"],a:1,e:"首段 who wanted to represent the students, not only the staff。"},
  {s:"The word \"eliminate\" in Paragraph 3 is closest in meaning to ______.",o:["add","remove","count","hide"],a:1,e:"eliminate＝去掉、取消；与前句 replaced the old route 并列，都是减少步骤。"},
  {s:"What did the drill show?",o:["The stairs were too narrow for so many students","The hill behind the school was too far away","The office had no phone that could be used","The windows on the top floor could not be closed"],a:0,e:"第三段 A new problem emerged at once: the stairs were too narrow for so many students，随后改成两条路线。"}
 ,{s:"What does the writer think matters most in an emergency?",o:["A habit, not just an emotion", "A strong teacher", "Modern equipment", "A long plan"],a:0,e:"末句 In an emergency, an emotion is not enough; a habit is. 直接点明：靠演练成的习惯，而不是一时的情绪。"}]},
{d:2,k:'d2-1',t:"A City That Learned to Recycle",zh:"人口增长带来垃圾和拥堵，政府投资可再生能源，条件是标准要始终一致；专家建议从每家少消费做起。",w:["recycle","renewable","invest","revenue","consume","contaminate","congest","condition","increase","indicate","involve","individual","consistent","recommend","contract","presume","assume","context"],
 p:`Every year our city produces more waste than it can recycle. Because of the increasing population, the roads are often congested and the river is contaminated in some places. The government has decided to invest in renewable energy and to build a new plant by the river.
A report indicates that the project will involve about two thousand individuals. Each worker will sign a contract, and the revenue of the town will increase step by step. The condition is simple but firm: the plant must keep a consistent standard — not a high one today and a low one tomorrow.
Experts recommend that every family should consume less and reuse more. They also warn us not to presume that the problem will solve itself. We must assume that change starts at home. In this context, even a small action can make a difference.`,
 q:[
  {s:"What does the report indicate about the project?",o:["It will cost too much money","It will involve about two thousand people","It will be built far from the river","It will reduce the population"],a:1,e:"第二段 A report indicates that the project will involve about two thousand individuals，直给细节。"},
  {s:"The word \"consistent\" in Paragraph 2 is closest in meaning to ______.",o:["the same over time","very high","easy to change","very cheap"],a:0,e:"consistent＝前后一致的，与 the same over time 同义。注意原文用 not a high one today and a low one tomorrow 来解释它。"},
  {s:"What do experts recommend?",o:["Building more roads","Consuming less and reusing more","Moving to another city","Closing all the factories"],a:1,e:"末段 Experts recommend that every family should consume less and reuse more。"}
 ,{s:"What is the writer's attitude toward solving the waste problem?",o:["Optimistic that small actions at home matter", "Pessimistic about any government plan", "Sure the problem will solve itself", "Indifferent to the new plant"],a:0,e:"末段 change starts at home... even a small action can make a difference 表明积极态度；C 与 not to presume that the problem will solve itself 直接相反。"}]},
{d:2,k:'d2-2',t:"A Reference Copy",zh:"老李退休前把修过的机器登记造册、留一份合同参考；旧规定没写废水，他说规矩没人照做就只是一张参考；他建议每人每年下一次清洁队。",w:["retire","register","reference","resign","conflict","include","assume","condition","recommend","presume","consume"],
 p:`When Mr. Li decided to retire, the office asked him to register every machine he had repaired and to keep a reference copy of each contract. He did not resign at once; he stayed for three months to teach the young workers.

There was a conflict between the old rules and the new ones. The old rules did not include a rule about waste water, and the new ones assumed that every factory would clean it. Mr. Li said the condition was simple: a rule that nobody follows is only a reference, not a standard.

He recommended one change: every worker should spend one day a year in the cleaning team. Do not presume that the river will clean itself, he said. A factory that does not consume less will always produce more waste.`,
 q:[
  {s:"What did Mr. Li do before he left the factory?",o:["He resigned at once and left the same day","He stayed three months to teach young workers","He sold the machines to a buyer from the city","He wrote a new contract for the workers"],a:1,e:"首段 He did not resign at once; he stayed for three months to teach the young workers。"},
  {s:"What was the conflict about?",o:["The salary of the workers at the old factory","The old rules had no rule about waste water","The number of workers the new machines would need","The age of the machines and the cost of repairs"],a:1,e:"第二段 The old rules did not include a rule about waste water, and the new ones assumed that every factory would clean it。"},
  {s:"What did Mr. Li recommend?",o:["Closing the factory for one month each year","That every worker spend one day a year cleaning","Buying new machines from a company abroad","Hiring a new manager with a higher pay"],a:1,e:"第三段 He recommended one change: every worker should spend one day a year in the cleaning team。"}
 ,{s:"What can we learn about Mr. Li?",o:["He believed rules need people who follow them", "He refused to register the machines", "He disliked the young workers", "He left the factory at once"],a:0,e:"他说规矩没人照做就只是一张参考，并建议每人每年参加清洁队——规则靠人执行。B、D 与首段他登记机器、留厂三个月矛盾，C 无据。"}]},
{d:3,k:'d3-1',t:"The First Experiment",zh:"一项研究说重视技能的学生考得更好；学校靠捐赠建了实验室，老师要求尊重数据、不许只挑合意的结果。",w:["according to","attach importance to","due to","owing to","thanks to","have access to","exhibit","restrict","exceed","exclude","experiment","knowledge","skill","relax","respect","affect","effect","learn","study","teach","train","exam","recover"],
 p:`According to a recent study, students who attach importance to skills do better in exams than those who only remember facts. Due to the pressure of tests, many students cannot relax, and their health is affected.
Our school has opened a new lab. Thanks to a large donation, students now have access to modern equipment. In the first experiment, we were asked to exhibit our results on a board and explain them. She would teach us to respect the data: we must not exclude the numbers that did not fit our idea. She also restricted the time to forty minutes, so nobody could exceed it.
Knowledge is not something you can recover after losing it. Owing to this, the school attaches great importance to training. We learn how to use limited resources well, and the effect is clear: students study with more interest.`,
 q:[
  {s:"According to the study, which students do better in exams?",o:["Those who remember more facts","Those who attach importance to skills","Those who study all night","Those who have private teachers"],a:1,e:"首句 students who attach importance to skills do better in exams，注意 than those who only remember facts 是对比项，不是答案。"},
  {s:"The word \"restricted\" in Paragraph 2 is closest in meaning to ______.",o:["limited","forgotten","increased","explained"],a:0,e:"restrict＝限制，与 limit 同义；原文后一句 so nobody could exceed it（没人能超过）正好提示它是时间上限。"},
  {s:"What is the effect of the training mentioned at the end?",o:["Students give up the exam","Students study with more interest","Students have less free time","Students forget the knowledge"],a:1,e:"末句 students study with more interest，注意 the effect is clear 是信号词。"}
 ,{s:"What is the passage mainly about?",o:["A school lab built by donation and shaped by data", "How to pass exams without pressure", "Why facts matter more than skills", "How to recover lost knowledge"],a:0,e:"全文围绕学校靠捐赠建实验室、重视技能训练、尊重数据展开。B、C 与首段\"重视技能的学生考得更好\"相反，D 与 Knowledge is not something you can recover 矛盾。"}]},
{d:3,k:'d3-2',t:"The Export Order",zh:"实验室靠\"盯住小数字\"做出耐用电池，首批出口来自国外小公司；教授限定广告用词，不许说\"安全\"；一封退款信贴到墙上，团队反而进步。",w:["pay attention to","release","export","exploit","restrict","exceed","exclude","experiment","refund","effect","train","skill"],
 p:`Our lab had a simple rule: pay attention to the small numbers. When we released a battery that could last two days, the first export order came from a small company abroad.

The manager wanted to exploit the news and print it on every box. The professor restricted the words we could use: we could not exceed three claims, and we had to exclude the word "safe". A claim that is not proved is not an experiment; it is an advertisement.

One customer asked for a refund. Instead of hiding the letter, we put it on the wall. The effect was surprising: the young workers began to train harder, and the skill of the team improved. Knowledge grows when a mistake is released, not when it is hidden.`,
 q:[
  {s:"What was the lab rule?",o:["Sell as fast as possible","Pay attention to the small numbers","Never write to customers","Work only for the government"],a:1,e:"首句 pay attention to the small numbers。"},
  {s:"Why did the professor restrict the words on the box?",o:["To save money on printing the box","Because unproved claims are advertising, not science","Because the box was too small for the words","To make the words easier for students to read"],a:1,e:"第二段 A claim that is not proved is not an experiment; it is an advertisement，所以只准写三条、不准写 safe。"},
  {s:"What happened after a customer asked for a refund?",o:["The team hid the letter","The team trained harder and improved","The lab closed","The manager was fired"],a:1,e:"第三段 Instead of hiding the letter, we put it on the wall … the young workers began to train harder。"}
 ,{s:"What can we learn from the lab's story?",o:["Mistakes can improve a team when shown", "Refunds should be kept secret", "Small numbers are not important", "Export is the only goal"],a:0,e:"末句 Knowledge grows when a mistake is released, not when it is hidden——把退款信贴上墙后团队反而进步。B 与贴墙相反，C 与实验室盯住小数字的规则相反。"}]},
{d:4,k:'d4-1',t:"A Project That Changed a Class",zh:"一位教授推行教育项目：每周复习、复述，收走手机减少干扰，结果成绩开始上升，其他院系也想复制。",w:["professor","introduce","project","improve","education","promote","productive","recruit","review","revise","recite","arise","distract","discard","reduce","influence","dispose","enhance","facilitate","reuse","produce","dismiss","protect","consequence","professional","rise","arouse","reproduce"],
 p:`A professor at our university introduced a new project last term. Its aim is to improve education and promote productive learning. The team recruited thirty students and asked them to review their notes every week, revise what they had written, and recite the key sentences aloud.
One problem soon arose: phones distracted the students, and many discarded their plans after a week. To reduce this influence, the teacher asked them to dispose of their phones before class. This simple rule enhanced their attention and facilitated discussion.
The project also asked students to reuse paper and to produce less waste. Nobody was dismissed for a low score; instead, the team tried to protect those who had fallen behind. The consequence was clear: the class became more professional in its habits, and their grades began to rise. The result aroused interest in other departments, who hope to reproduce the model next year.`,
 q:[
  {s:"What were the students asked to do every week?",o:["Take a short exam on Friday afternoon","Review notes, revise them and recite key sentences","Buy new textbooks for each of the five courses","Write a long paper about the reading"],a:1,e:"第一段 review their notes every week, revise what they had written, and recite the key sentences aloud，三项并列。"},
  {s:"Why did the teacher ask students to dispose of their phones?",o:["To sell them","To reduce distraction","To clean the classroom","To save electricity"],a:1,e:"To reduce this influence 指上文 phones distracted the students，dispose of 在这里是\"处理掉、收起\"。"},
  {s:"What does the last sentence suggest?",o:["The project failed","Other departments want to copy the model","Students refused to reuse paper","The university closed the project"],a:1,e:"hope to reproduce the model next year＝想复制这套做法，是典型的推断题。"}
 ,{s:"What is the main idea of the passage?",o:["Phones should be banned in universities", "A learning project changed students' habits", "Reviewing notes is the only way to learn", "Professors dislike new ideas"],a:1,e:"全文讲项目（每周复习、复述、收走手机）如何让班级习惯变得专业。A 只是一个手段；C 的 only way 过于绝对；D 无据。"}]},
{d:4,k:'d4-2',t:"The Old Books",zh:"图书馆书多地方小，教授被请去清点；她不舍得丢，先给旧书拍封面、发给学生、讲来历；结果旧书被重新借走，阅读人数上升。",w:["review","discard","dismiss","protect","reproduce","distribute","introduce","project","produce","reuse","rise","education","promote","consequence","enhance"],
 p:`The library had too many old books and too little space. The director asked a professor to review the collection and to discard what nobody borrowed.

The professor did not dismiss the idea, but she wanted to protect the collection first. She asked us to reproduce the cover of every old book, to distribute the photos to the students, and to introduce the history of each one. A book that is reviewed by a class is not dead; it is only waiting.

The project produced a surprising result: students began to reuse the old books, and the number of readers rose. The education office decided to promote the model. One consequence was easy to see: a quiet room can enhance a course more than a new building.`,
 q:[
  {s:"What did the director want to do?",o:["Buy more books","Discard books nobody borrowed","Close the library","Hire more teachers"],a:1,e:"首段 asked a professor to review the collection and to discard what nobody borrowed。"},
  {s:"Why did the professor want to reproduce the covers?",o:["To decorate the wall of the reading room","To show students the history of the books","To count the books that were still missing","To sell them to a collector in the city"],a:1,e:"第二段 reproduce the cover … to distribute the photos … to introduce the history of each one。"},
  {s:"What was the result of the project?",o:["Fewer students came","Students began to reuse the old books","The library was closed","The professor resigned"],a:1,e:"第三段 students began to reuse the old books, and the number of readers rose。"}
 ,{s:"What can be inferred about the professor?",o:["She valued old books beyond their borrow records", "She threw away most of the collection", "She disliked the library", "New buildings matter more than quiet rooms"],a:0,e:"她不舍得丢，先拍封面、发给学生、讲来历，结果旧书被重新借走——她看到了旧书的价值。B 与文意相反；D 与末句 a quiet room can enhance a course more than a new building 矛盾。"}]},
{d:5,k:'d5-1',t:"The Factory by the River",zh:"村民抗议老厂污染，市里换经理、上清洁技术，两年后利润没降、污染减少，还有工人升职。",w:["take place","production","exaggerate","expense","take into account","impact","take measures to","take over","take advantage of","take effect","take part in","exact","steady","growth","profit","decline","boost","take up","promotion","progress","extinct","alter"],
 p:`Last spring a protest took place outside an old chemical factory. Local people said that production had damaged the river and that the company had exaggerated its profits while cutting expenses. The factory, they argued, should take into account the impact on the village.
The city decided to take measures to stop the pollution. A new manager was brought in to take over the plant. He promised to take advantage of clean technology, and said that the change would take effect within a year. Many students from the local university took part in the survey, and their exact numbers were published in the report.
Two years later the figures show a steady growth. Profit has not declined; on the contrary, the company has begun to boost its sales. The expense of the new machines was high, but the plant now takes up less water and produces less waste. Some workers have won promotion. Progress has been slow, and the new plan will alter the way the plant works, but nobody talks about the fish becoming extinct any more.`,
 q:[
  {s:"Why did the local people protest?",o:["The factory paid them too little","Production had damaged the river","The factory was too small","The manager was too strict"],a:1,e:"第一段 production had damaged the river and the company had exaggerated its profits，是抗议的两个理由。"},
  {s:"What does it mean that the factory should \"take the impact into account\"?",o:["It should pay a fine to the village every year","It should consider the effect on the village","It should close down at once and move away","It should hire more workers from the village"],a:1,e:"take … into account＝把……考虑进去；impact 是\"影响\"，指对村庄的影响。这是短语题，考搭配理解。"},
  {s:"What do the figures show two years later?",o:["Profit has fallen sharply","Growth is steady and profit has not declined","The factory has closed","Workers have lost their jobs"],a:1,e:"a steady growth；Profit has not declined，两句合起来。on the contrary 之后的 boost its sales 是进一步证据。"}
 ,{s:"What can be inferred from the result two years later?",o:["Clean technology and profit can go together", "Protests always destroy a company", "Factories must move away from rivers", "Growth requires more waste"],a:0,e:"末段 Profit has not declined; on the contrary... takes up less water and produces less waste——清洁技术与利润并行不悖。B、C、D 与文意相反或无据。"}]},
{d:5,k:'d5-2',t:"A Higher Fee",zh:"学生抗议学费太贵：学位不该由家庭收入决定；校方解释成本，学生要求参与预算会议；最后新规生效——涨价必须先公开报告。",w:["protest","expensive","school","course","degree","take measures to","take part in","take effect","progress","growth","teacher","university"],
 p:`Last term the students of our school organized a protest. The reason was simple: the course was becoming too expensive. A degree should not depend on the salary of a family.

The university took measures to explain the cost, but the students did not accept the first answer. They asked to take part in the meeting where the budget was decided. A teacher who supported them said that progress is not a higher fee; it is a better class.

In the end a new rule took effect: no course could raise its price without a public report. The growth of the fee stopped for one year. It was not a victory, but it was a beginning.`,
 q:[
  {s:"Why did the students protest?",o:["The course was too expensive","The teachers were absent","The library was closed","The exam was too hard"],a:0,e:"首段 The reason was simple: the course was becoming too expensive。"},
  {s:"What did the students ask for?",o:["A longer holiday between the two terms","To take part in the meeting about the budget","New classrooms for the first-year students","Free books for every student in the class"],a:1,e:"第二段 They asked to take part in the meeting where the budget was decided。"},
  {s:"What rule took effect in the end?",o:["Teachers could set the price at any level they wanted","No course could raise its price without a public report","Students could not protest against a new price","Every course became free for the first year"],a:1,e:"末段 a new rule took effect: no course could raise its price without a public report。"}
 ,{s:"What is the writer's attitude toward the new rule?",o:["It is a start rather than a final victory", "It solved the fee problem completely", "It was unfair to students", "It should be cancelled"],a:0,e:"末句 It was not a victory, but it was a beginning. 直接点明态度：是开端，不是终局。B 与\"涨价冻结一年\"的有限成果不符，C、D 无据。"}]},
{d:6,k:'d6-1',t:"Phones, Sleep and a Free Clinic",zh:"青少年知道手机成瘾有害却管不住；某市把心理治疗对学生免费，医生先问症状再给\"处方\"，还强调家庭支持不能替代。",w:["be aware of","be capable of","be harmful to","be short of","be responsible for","avoid","reform","therapy","be used to doing","intersection","be subject to","symptom","recipe","be beneficial to","refresh","interpret","physical","support","prevent","addiction","adolescent","nutrition","achieve","depend"],
 p:`Many adolescents today are aware of the danger of phone addiction, but few are capable of controlling it. Doctors say that staying up late is harmful to the body, and that a poor diet is short of the nutrition a young person needs. Parents are responsible for setting limits, and schools should not avoid the topic. Games, after all, are advertised on every platform, and no student can escape them alone.
A recent reform in one city has made therapy free for students. Teenagers who are used to playing games for hours can now get help at the intersection near the school. The clinic is subject to government review, and every case is kept private. Doctors first ask about each symptom, then offer a simple recipe for change: exercise, regular sleep, and a hobby.
Such a plan is beneficial to both mind and body. It helps students refresh themselves and interpret their own emotions. Whether a student can achieve more depends on many things, but since the program began, the number of students who need physical treatment has fallen. Nothing can replace a family's support, yet the reform shows that small steps can prevent a big problem.`,
 q:[
  {s:"Why can few adolescents control phone addiction, according to Paragraph 1?",o:["They do not know it is dangerous","They lack the ability to control it","Their parents buy them phones","Schools teach them to play"],a:1,e:"few are capable of controlling it 中 be capable of＝有能力做；前半句已经说他们 are aware of（知道）危险，所以「知道它危险」那一项是干扰项。"},
  {s:"\"A poor diet is short of the nutrition\" means the diet ______.",o:["has too much nutrition","does not have enough nutrition","is very expensive","is hard to cook"],a:1,e:"be short of＝缺少。同义替换题，注意不要选成\"营养太多\"。"},
  {s:"What does the writer think of the reform?",o:["It costs too much for the poorest families","It helps, but family support still matters","It should be stopped until the money is ready","It is useless without a change in teaching"],a:1,e:"末段 beneficial to both mind and body 是肯定态度，Nothing can replace a family's support 是让步，两者合起来才是完整态度。"}
 ,{s:"What is the passage mainly about?",o:["A city's plan to treat students' phone and health problems for free", "Why phones are dangerous machines", "How parents set limits at home", "The cost of a poor diet"],a:0,e:"全文核心是该市把心理治疗对学生免费、医生先问症状再给处方。B、C、D 都是支撑细节，不是主线。"}]},
{d:6,k:'d6-2',t:"A New Menu",zh:"医院餐厅菜便宜但菜单从不换，护士说营养也是治疗；经理不宣传，只在每桌放卡片让病人自己调盐；厨房员工反而成了支持者。",w:["recipe","remedy","nutrition","reform","advertise","adjust","prevent","achieve","benefit","support"],
 p:`The hospital restaurant had a problem: the food was cheap, but the recipe never changed. A nurse said that nutrition was part of the remedy, not an extra.

The manager decided to reform the menu. He did not advertise it; he simply put a card on each table and asked patients to adjust the salt themselves. We must prevent a second illness, he said, and we cannot achieve that with sugar.

The change was small, but the benefit was real. A patient who eats a fresh meal sleeps better, and a family that learns one recipe takes it home. Support came from an unexpected place: the kitchen staff, who said the work was finally interesting.`,
 q:[
  {s:"What did the nurse say about nutrition?",o:["It is part of the remedy","It is too expensive","It is not important","It is a kind of medicine"],a:0,e:"首段 nutrition was part of the remedy, not an extra。"},
  {s:"How did the manager introduce the change?",o:["With a large advertisement","With a card on each table","With a new building","With a long lecture"],a:1,e:"第二段 He did not advertise it; he simply put a card on each table。"},
  {s:"Where did support come from?",o:["The patients families","The kitchen staff","The city office","The doctors"],a:1,e:"末段 Support came from an unexpected place: the kitchen staff。"}
 ,{s:"What can we learn from the hospital restaurant?",o:["Small changes can improve care", "Nutrition is too expensive to change", "Kitchen staff dislike new ideas", "Patients should cook for themselves"],a:0,e:"末段 The change was small, but the benefit was real——病人睡得更好、家人学到菜谱。C 与 Support came from... the kitchen staff 相反。"}]},
{d:7,k:'d7-1',t:"Robots on the Line",zh:"汽车厂用自动设备提效，但仍有工伤；批评者担心岗位减少、虚拟培训替代不了真实经验；经理承诺升级安全系统。",w:["be known as","automobile","innovation","be based on","automatic","update","be accustomed to","be exposed to","injury","shift","be worth doing","inequality","be opposed to","concern","diminish","virtual","be committed to","address","upgrade","remove","fluctuate","compete","matter","insomnia","innocent"],
 p:`The new factory is known as a leader in automobile innovation. Its system is based on automatic control, and every machine is updated twice a year. Workers are accustomed to working with robots, but they are exposed to danger every day: last month one man suffered an injury when a heavy arm shifted suddenly. Night workers also report insomnia, and no one is innocent when safety rules are ignored.
The company says the risk is worth taking, because the new line has reduced inequality between day and night shifts. Critics are opposed to the plan. They are concerned that the number of jobs will diminish and that virtual training cannot replace real experience. Some of them are committed to fighting the change.
The manager agrees that the problem must be addressed. He has promised to upgrade the safety system and to remove the old machines. Prices fluctuate, and the market is hard to compete in, but he believes the innovation will pay off. What matters, he says, is not speed but safety.`,
 q:[
  {s:"What happened at the factory last month?",o:["A robot stopped working","A worker was injured","The factory closed","Prices went up"],a:1,e:"one man suffered an injury when a heavy arm shifted suddenly，suffer an injury＝受伤。"},
  {s:"Why are critics opposed to the plan?",o:["They dislike the manager and the way he was chosen","They fear fewer jobs and that virtual training is not enough","They want to sell the factory to a foreign brand","They want higher pay before any training begins"],a:1,e:"concerned that the number of jobs will diminish and that virtual training cannot replace real experience，两点并列。"},
  {s:"What does the manager say matters most?",o:["Speed","Profit","Safety","Price"],a:2,e:"末句 What matters, he says, is not speed but safety。not … but … 结构，重点在后半句。"}
 ,{s:"What is the passage mainly about?",o:["A factory balancing innovation with worker safety", "Robots are replacing all workers", "Virtual training is better than real experience", "Prices decide everything in business"],a:0,e:"全文在自动化创新与工伤风险之间，以承诺升级安全系统收尾——主题是平衡。B 的 all workers 绝对化；C 与批评者观点相反；D 与经理最后强调的 what matters 相反。"}]},
{d:7,k:'d7-2',t:"The Night Shift",zh:"夜班工人失眠、出错、质量波动；经理没取消夜班，而是改灯光和排班；医生说身体不容易倒时差；最后设了一间安静休息室。",w:["insomnia","fluctuate","remove","upgrade","update","shift","matter","concern","inequality","innovation","seem","deteriorate"],
 p:`The night shift at the plant had a new problem: insomnia. Workers who could not sleep began to make small errors, and the quality of the product began to fluctuate.

The manager did not remove the night shift; he decided to upgrade the lighting and to update the schedule. A doctor explained that the body does not shift easily, and that twenty minutes of rest can matter more than a bonus.

Critics said the real concern was inequality: the night workers earned less and slept worse. The company answered with an innovation — a quiet room where a worker can rest. It seemed a small thing. But a plant that ignores sleep will watch its product deteriorate.`,
 q:[
  {s:"What problem appeared on the night shift?",o:["Workers could not sleep and made errors","The machines were too old","The pay was too high","The lights were too bright"],a:0,e:"首段 insomnia … make small errors … the quality of the product began to fluctuate。"},
  {s:"What did the doctor say about the body?",o:["It shifts easily from one schedule to another","It does not shift easily to a new schedule","It needs more money to work at night","It cannot rest at night after a long shift"],a:1,e:"第二段 the body does not shift easily。"},
  {s:"What was the company innovation?",o:["A bonus for night workers","A quiet room for a short rest","A new factory","A longer shift"],a:1,e:"末段 an innovation — a quiet room where a worker can rest。"}
 ,{s:"What can be inferred about the company?",o:["It responded to the sleep problem step by step", "It cancelled the night shift at once", "It refused to change anything", "It cared only about inequality"],a:0,e:"公司没有取消夜班，而是改灯光、调排班、设安静休息室——逐步应对。B、C 与文意相反；D 是批评者的观点，不是公司的做法。"}]},
{d:8,k:'d8-1',t:"The Interview",zh:"面试考的是能力不是记忆：除了简历要带成果清单，被问住别编；诚实比背答案更能打动人。",w:["in general","ability","in terms of","market","content","in addition to","resume","achievement","in case of","accuse","experience","complain","cite","clarify","in charge of","appreciate","in spite of","salary","in the long run","accelerate","abuse","condemn","contend","commit","error","absorb","in favor of","subject"],
 p:`In general, a job interview is not a test of memory but of ability. In terms of preparation, you should know the company's market and the content of the position. In addition to your resume, bring a short list of your achievements. In case of a question you cannot answer, do not invent facts. The subject of the interview matters far less than the way you answer.
A friend of mine was once accused of exaggerating her experience. She did not complain; instead, she cited a small project she had really finished and clarified her exact role. The manager, who was in charge of hiring, appreciated her honesty. In spite of a weak salary offer, she accepted the job, because in the long run the position would accelerate her growth.
Some people abuse the interview by memorizing answers. Employers condemn this, and most of them contend that a candidate who commits an error and admits it is better than one who hides it. Nobody expects you to absorb everything on the first day. What they want is someone who is in favor of learning.`,
 q:[
  {s:"What should you bring in addition to your resume?",o:["A letter from your parents","A list of your achievements","A new phone","A photo of your office"],a:1,e:"In addition to your resume, bring a short list of your achievements。in addition to＝除了……还有。"},
  {s:"Why did the manager appreciate the writer's friend?",o:["She had a long resume","She was honest about her experience","She accepted a low salary at once","She knew the market well"],a:1,e:"appreciated her honesty；诚实来自前句 she cited a small project she had really finished，没有编造。"},
  {s:"What do most employers contend?",o:["Candidates should memorize answers","Admitting an error is better than hiding it","Experience is not important","Salary is the first question"],a:1,e:"most of them contend that a candidate who commits an error and admits it is better than one who hides it。contend＝主张。"}
 ,{s:"What is the passage mainly about?",o:["How to prepare for and behave in a job interview", "Why employers reject fresh graduates", "How to memorize answers quickly", "How to write a perfect resume"],a:0,e:"全文给面试建议：了解公司、带成果清单、不编事实、诚实认错。C 与 Some people abuse the interview by memorizing answers. Employers condemn this 相反。"}]},
{d:8,k:'d8-2',t:"A Letter of Complaint",zh:"招聘会后学生写信投诉：公司滥用\"经验\"一词，要求刚毕业的人有三年工龄；老师让她写下日期和证据再指控；两天后工资上调、广告删词。",w:["complain","abuse","condemn","accuse","commit","absorb","salary","achievement","error","market"],
 p:`After the job fair, a student wrote an email to complain about a company. The company, she said, had abused the word "experience": it asked for three years of work from a person who had just finished school.

Her teacher did not condemn the company at once. He asked her to accuse nobody without evidence and to commit her complaint to paper with dates. A letter that is only angry is easy to absorb and easy to forget.

The company answered in two days. The salary was raised, and the word "experience" was removed from the advertisement. The student's achievement was not the money; it was the habit of writing an error down. A market improves when a customer is willing to complain.`,
 q:[
  {s:"What did the student complain about?",o:["The salary was too low for the hours she worked","The company asked for experience from new graduates","The office was too far from the bus stop","The interview was too short to show her skills"],a:1,e:"首段 had abused the word \"experience\": it asked for three years of work from a person who had just finished school。"},
  {s:"What did the teacher tell her to do?",o:["Ask the manager for more money at once","Write the complaint down with dates and evidence","Call the police and report the company","Forget the company and look for another job"],a:1,e:"第二段 accuse nobody without evidence and to commit her complaint to paper with dates。"},
  {s:"What was the result?",o:["Nothing changed for the next three months","The salary was raised and the advertisement changed","The company closed its office in the city","The student lost her job after the letter"],a:1,e:"末段 The salary was raised, and the word \"experience\" was removed from the advertisement。"}
 ,{s:"What does the writer value most in the story?",o:["The habit of writing an error down with evidence", "The raised salary", "The removed word in the ad", "The job fair itself"],a:0,e:"原句 The student's achievement was not the money; it was the habit of writing an error down. 直接点明。"}]},
{d:9,k:'d9-1',t:"The Platform and the Manager",zh:"新平台最大的风险不是技术而是管理：数据再好，没人用也只是纸；好经理先帮同事再表态。",w:["opinion","risk","platform","management","in other words","in contrast to","process","manager","in detail","in response to","in advance","in vain","admire","summarize","advocate","illustrate","trend","anticipate","criticize","assist","declare","appoint","emphasize","standard","pattern","challenge","inform","manage","information","in particular","in the face of","appeal"],
 p:`In my opinion, the biggest risk in a new platform is not technology but management. In other words, the problem is people.
In contrast to older systems, a modern platform records every step of the process, so a manager can see in detail where the work slows down. In response to a complaint, the company can act in advance instead of waiting. But a plan made in vain is worse than no plan: if nobody uses the data, the report is only paper.
We admire a leader who can summarize a long meeting in three lines, and we advocate one who can illustrate a trend with a single chart. Such people anticipate problems. They do not criticize a member of the team in public; they assist him first, and then they declare what must change. They appoint the right person, and they emphasize the standard, not the speed.
One case in particular shows this. In the face of a sudden failure, a good manager appeals to facts, not to fear. I must emphasize one pattern: a challenge is not a crisis, and a trend is not a fate. The best managers inform their team early, and they manage information as carefully as money.`,
 q:[
  {s:"What does the writer think is the biggest risk in a new platform?",o:["Technology","Management","Money","Speed"],a:1,e:"the biggest risk in a new platform is not technology but management。not … but … 结构，重点在后半句。"},
  {s:"What does \"a plan made in vain is worse than no plan\" mean?",o:["Plans are useless","A plan nobody uses wastes effort","Plans should be long","No plan is always better"],a:1,e:"冒号后 if nobody uses the data, the report is only paper 就是解释：没人用，白做。in vain＝徒劳。"},
  {s:"How does a good leader treat a colleague who made a mistake?",o:["Ignore him and give the task to someone else","Assist him first, then declare what must change","Criticize him in public so others take care","Fire him at once and hire a new worker"],a:1,e:"They do not criticize a member of the team in public; they assist him first, and then they declare what must change。"}

{d:9,k:'d9-2',t:"The Launch Meeting",zh:"发布会准备了幻灯片，遇到难题经理只会\"总结\"；记者追问一个数字，会议白开；公司换了发言人——能先说清问题、再举小例子。",w:["in advance","in detail","in the face of","summarize","criticize","appeal","in vain","appoint","declare","illustrate","anticipate","emphasize","admire","opinion"],
 p:`The team prepared the launch in advance and wrote every slide in detail. In the face of a difficult question, however, the manager began to summarize instead of answering.

A journalist criticized him at once. She did not appeal to emotion; she asked for one number. The manager could not give it, and the meeting ended in vain.

Later the company appointed a new speaker. She was not a famous person, but she could declare a problem in one sentence and then illustrate the solution with a small example. We must anticipate the hard question, she said, and we must emphasize what we do not know. I admire that opinion more than any slogan.`,
 q:[
  {s:"What did the manager do when asked a difficult question?",o:["He answered with a number","He summarized instead of answering","He left the room","He called a journalist"],a:1,e:"首段 began to summarize instead of answering。"},
  {s:"Why did the meeting end in vain?",o:["Nobody came except two of the workers","The manager could not give the number","The slides were missing from the computer","The room was too small for the group"],a:1,e:"第二段 She asked for one number. The manager could not give it, and the meeting ended in vain。"},
  {s:"What did the new speaker emphasize?",o:["What the company does not know","How famous she was","The price of the product","The number of employees"],a:0,e:"末段 we must emphasize what we do not know。"}
 ,{s:"What can be inferred about a good speaker?",o:["One who states the problem clearly and gives examples", "One who summarizes every hard question", "One who reads every slide in detail", "One who avoids difficult questions"],a:0,e:"新发言人 could declare a problem in one sentence and then illustrate the solution with a small example。B、C 是旧发言人失败的做法，D 与 must anticipate the hard question 相反。"}]},
{d:10,k:'d10-1',t:"The Rumor on Campus",zh:"一则\"取消奖学金\"的谣言在校园炸开，院长当面澄清；真正的毛病是沟通，后来师生每月见一次。",w:["rumor","campus","scholarship","argument","be prone to","persuasive","tone","be likely to","quarrel","insult","statement","lecture","confront","assure","compensate","shortage","conceal","paragraph","apologize","drawback","opportunity","graduate","academic","be supposed to","be bound to","be engaged in","be involved in","associate","collapse","be attributed to"],
 p:`A rumor began on campus last month: the university was going to cut its scholarships. Nobody knew where the story came from, but it spread fast, and by Friday a serious argument had broken out in the dining hall.
The trouble was easy to explain. Students under exam pressure are prone to worry, and a short message with a persuasive tone is likely to be believed. People associate silence with agreement, though here it meant fear. Two students who had never met began to quarrel; one used an insult, and the other answered with a statement that made the whole room silent.
The next morning the dean held a lecture to confront the problem. She assured everyone that the rumor was false, and that the shortage of money would be compensated by a new fund. Do not conceal bad news, she said; bring it to us before the whole plan collapses. Her paragraph on the school website asked both sides to apologize for the quarrel.
Looking back, the drawback was communication, and it can be attributed to a system that talks only downward. But the affair gave us an opportunity: graduates and academic staff now meet once a month. Students who are engaged in real talk are involved in fewer false stories, and staff are supposed to answer questions on the spot. The new habit is bound to help.`,

  {s:"What did the dean ask the students to do?",o:["Stop using the dining hall after nine","Bring bad news to her instead of hiding it","Pay for the new fund before Friday","Leave the campus before the holiday"],a:1,e:"Do not conceal bad news, she said; bring it to us。conceal＝隐瞒，与 bring 形成对比。"},
  {s:"What does the writer think was the real drawback?",o:["The false rumor itself","The way the school communicated","The shortage of money","The students' quarrel"],a:1,e:"末段 the drawback was communication，argue 之后补充 can be attributed to a system that talks only downward，说明问题在沟通方式。"}
 ,{s:"What is the passage mainly about?",o:["A rumor revealed a communication gap and led to monthly talks", "Scholarships were really cut last month", "Students should never trust each other", "Rumors always help schools improve"],a:0,e:"谣言→院长澄清→发现真正的毛病是沟通→师生每月见面。B 与澄清事实矛盾（谣言不实）；C、D 绝对化。"}]},
{d:10,k:'d10-2',t:"The Broken Pipe",zh:"宿舍半夜水管爆了，没人知道报修电话；第二天学生当面质问，维修单显示管子二十年了；经理道歉并赔食物，还让学生进检查委员会。",w:["collapse","be supposed to","confront","assure","statement","be likely to","apologize","compensate","opportunity","be bound to","quarrel"],
 p:`The water pipe in our dormitory collapsed at midnight. We were supposed to call the office, but nobody knew the number.

The next morning we confronted the manager. He tried to assure us that the problem was small, but a statement from the repair team showed that the pipe was twenty years old. A student who is likely to be angry is not easy to calm.

The manager apologized and promised to compensate every room for the lost food. He also gave us an opportunity: a place on the committee that checks the building twice a year. We are bound to disagree sometimes, but a quarrel in a meeting is better than a flood at midnight.`,
